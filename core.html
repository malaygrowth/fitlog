<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#0e1214; --surface:#161d21; --raised:#1f282e; --line:#2b373f;
    --ink:#edf2f4; --ink2:#93a6b0; --ink3:#5c6d76;
    --wk:#f2a03d; --wk-dim:#f2a03d33;
    --wa:#56b8e8; --wa-dim:#56b8e833;
    --fd:#8fd068; --fd-dim:#8fd06833;
    --bd:#b48ee0; --bd-dim:#b48ee033;
    --sl:#8ea0e8; --stp:#5ecfb5;
    --bad:#e8695e; --good:#4fc98a;
    --r:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;
    font-size:16px; line-height:1.45;
    min-height:100vh; min-height:100dvh;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
  input,select,textarea{font:inherit; color:var(--ink); background:var(--raised); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--wk); outline-offset:1px}
  input[type=number]{font-variant-numeric:tabular-nums}
  ::placeholder{color:var(--ink3)}

  #app{max-width:480px; margin:0 auto; padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 8px;
  }
  header.top .brand{font-weight:800; letter-spacing:-.02em; font-size:20px}
  header.top .brand small{display:block; font-weight:500; font-size:12px; color:var(--ink2); letter-spacing:.01em}
  .gear{width:44px;height:44px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink2)}

  main{padding:6px 14px 20px; display:block}
  section.tab{display:none}
  section.tab.on{display:block}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px}
  .card h2{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink2); margin-bottom:12px; display:flex; align-items:center; gap:8px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%}
  .row{display:flex; align-items:center; gap:10px}
  .row.wrap{flex-wrap:wrap}
  .spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .grow{flex:1}
  .muted{color:var(--ink2)} .tiny{font-size:12px} .small{font-size:13.5px}
  .num{font-variant-numeric:tabular-nums}
  .big{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.1}

  .btn{background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:11px 14px; font-weight:600; font-size:14.5px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:7px}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--wk); border-color:var(--wk); color:#191106}
  .btn.water{background:var(--wa); border-color:var(--wa); color:#0a1920}
  .btn.food{background:var(--fd); border-color:var(--fd); color:#101b0a}
  .btn.body{background:var(--bd); border-color:var(--bd); color:#170f22}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--bad); border-color:#e8695e55}
  .btn.wide{width:100%}
  .btn.sm{padding:7px 11px; min-height:36px; font-size:13px; border-radius:10px}
  .chip{background:var(--raised); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13.5px; font-weight:600; min-height:38px}
  .chip.on{background:var(--wk); border-color:var(--wk); color:#191106}

  /* bottom nav */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs .in{max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
  nav.tabs button{display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px 5px; color:var(--ink3); font-size:10.5px; font-weight:600; letter-spacing:.02em; border-radius:10px}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button.on{color:var(--ink)}
  nav.tabs button.on .ic-today{color:var(--wk)}
  nav.tabs button.on .ic-wk{color:var(--wk)}
  nav.tabs button.on .ic-tm{color:var(--wk)}
  nav.tabs button.on .ic-fd{color:var(--fd)}
  nav.tabs button.on .ic-bd{color:var(--bd)}

  /* rings + bars */
  .ring{position:relative; width:118px; height:118px; flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .mid{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
  .bar{height:8px; background:var(--raised); border-radius:99px; overflow:hidden}
  .bar i{display:block; height:100%; border-radius:99px}

  /* set table */
  .sethead,.setrow{display:grid; grid-template-columns:34px 1fr 74px 64px 44px; gap:8px; align-items:center}
  .sethead{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink3); margin:10px 0 6px}
  .setrow{margin-bottom:8px}
  .setrow input{padding:9px 8px; text-align:center}
  .setrow .prev{font-size:12.5px; color:var(--ink3); text-align:left}
  .setrow .idx{color:var(--ink3); font-weight:700; font-size:13px; text-align:center}
  .check{width:44px;height:40px;border-radius:10px;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink3)}
  .check.on{background:var(--good); border-color:var(--good); color:#06281a}
  .setrow.done input{opacity:.55}
  .setrow.wu input{opacity:.45}
  .idx.wu{color:var(--wk)}
  button.idx{cursor:pointer; min-height:36px}

  .exblock{border-top:1px solid var(--line); padding-top:14px; margin-top:14px}
  .exblock:first-of-type{border-top:0; padding-top:0; margin-top:0}
  .exname{font-weight:700; font-size:16px}

  .listrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 2px; border-bottom:1px solid var(--line)}
  .listrow:last-child{border-bottom:0}

  /* timers */
  .clock{font-size:56px; font-weight:800; letter-spacing:-.01em; font-variant-numeric:tabular-nums; text-align:center; line-height:1.05; margin:8px 0 4px}
  .clock.small{font-size:40px}
  .laps{max-height:180px; overflow-y:auto; margin-top:10px}
  .laps .listrow{padding:8px 2px}

  /* sheet + overlay */
  #shade{position:fixed; inset:0; background:#000a; z-index:60; display:none}
  #shade.on{display:block}
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:61; display:none;
    background:var(--surface); border-radius:20px 20px 0 0; border-top:1px solid var(--line);
    max-height:88vh; overflow-y:auto;
  }
  #sheet.on{display:block}
  #sheet .in{max-width:480px; margin:0 auto; padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
  #sheet h3{font-size:18px; font-weight:800; letter-spacing:-.01em; margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink2); margin-bottom:6px}
  .fields2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .fields3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}

  /* rest overlay */
  #rest{
    position:fixed; left:0; right:0; bottom:0; z-index:70; display:none;
    background:linear-gradient(180deg, #1f2013 0%, #191d10 100%);
    background:var(--surface);
    border-top:2px solid var(--wk); border-radius:20px 20px 0 0;
  }
  #rest.on{display:block}
  #rest .in{max-width:480px; margin:0 auto; padding:16px 18px calc(22px + env(safe-area-inset-bottom)); text-align:center}
  #rest .bar{margin:10px 0 14px}

  #toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom));
    background:var(--raised); border:1px solid var(--line); color:var(--ink);
    padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; z-index:90;
    opacity:0; pointer-events:none; transition:opacity .2s; max-width:88vw; text-align:center;
  }
  #toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }

  .empty{color:var(--ink3); font-size:14px; text-align:center; padding:18px 8px}
  .seg{display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:4px}
  .seg button{padding:8px; border-radius:9px; font-weight:600; font-size:13.5px; color:var(--ink2)}
  .seg button.on{background:var(--bg); color:var(--ink)}
  .datebar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .datebar b{font-size:15px}
  .datebar .btn{min-height:38px; padding:7px 13px}
  .mini{display:flex; gap:4px; align-items:flex-end; height:36px; margin-top:10px}
  .mini i{flex:1; background:var(--sl); border-radius:3px 3px 0 0; min-height:2px; opacity:.85}
  .mini i.off{background:var(--raised)}
  .mini.stp i{background:var(--stp)}
  .mini.stp i.off{background:var(--raised)}
  a{color:var(--wa)}
</style>

<div id="app">
  <header class="top">
    <div class="brand">FitLog<small id="hello">personal tracker</small></div>
    <button class="gear" onclick="openSettings()" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
    </button>
  </header>

  <main>
    <section class="tab on" id="tab-today"></section>
    <section class="tab" id="tab-workout"></section>

    <section class="tab" id="tab-timers">
      <div class="card">
        <h2><span class="dot" style="background:var(--wk)"></span>Stopwatch</h2>
        <div class="clock num" id="swClock">00:00.0</div>
        <div class="row" style="justify-content:center; gap:10px; margin-top:10px">
          <button class="btn primary" id="swMain" onclick="swToggle()">Start</button>
          <button class="btn" onclick="swLap()">Lap</button>
          <button class="btn ghost" onclick="swReset()">Reset</button>
        </div>
        <div class="laps" id="swLaps"></div>
      </div>

      <div class="card">
        <h2><span class="dot" style="background:var(--wk)"></span>Rest timer</h2>
        <div class="row wrap" id="restPresets" style="margin-bottom:6px"></div>
        <div class="row" style="margin-top:8px">
          <input type="number" id="restCustom" placeholder="Custom seconds" min="5" step="5" inputmode="numeric">
          <button class="btn" onclick="restFromCustom()">Start</button>
        </div>
        <p class="tiny muted" style="margin-top:10px">A rest timer also starts automatically when you tick off a set during a workout.</p>
      </div>

      <div class="card">
        <h2><span class="dot" style="background:var(--wk)"></span>Interval / HIIT</h2>
        <div class="fields3">
          <div class="field"><label for="hiWork">Work (s)</label><input type="number" id="hiWork" value="40" min="5" inputmode="numeric"></div>
          <div class="field"><label for="hiRest">Rest (s)</label><input type="number" id="hiRest" value="20" min="0" inputmode="numeric"></div>
          <div class="field"><label for="hiRounds">Rounds</label><input type="number" id="hiRounds" value="8" min="1" inputmode="numeric"></div>
        </div>
        <div class="clock small num" id="hiClock">Ready</div>
        <div class="tiny muted" style="text-align:center" id="hiPhase">40s work · 20s rest · 8 rounds</div>
        <div class="row" style="justify-content:center; gap:10px; margin-top:12px">
          <button class="btn primary" id="hiMain" onclick="hiToggle()">Start</button>
          <button class="btn ghost" onclick="hiReset()">Reset</button>
        </div>
      </div>

      <div class="card">
        <h2><span class="dot" style="background:var(--wk)"></span>Plate calculator</h2>
        <div class="row">
          <input type="number" id="plW" inputmode="decimal" step="0.5" placeholder="Target weight (kg)">
          <select id="plBar" style="max-width:120px">
            <option value="20">20 kg bar</option>
            <option value="15">15 kg bar</option>
            <option value="10">10 kg bar</option>
            <option value="0">No bar</option>
          </select>
        </div>
        <button class="btn wide" style="margin-top:10px" onclick="plates()">What do I load?</button>
        <div id="plOut" class="small num" style="margin-top:10px"></div>
      </div>
    </section>

    <section class="tab" id="tab-food"></section>
    <section class="tab" id="tab-body"></section>
  </main>

  <nav class="tabs"><div class="in">
    <button data-tab="today" class="on" onclick="go('today')">
      <svg class="ic-today" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6.5 10.5V20h11v-9.5"/></svg>Today</button>
    <button data-tab="workout" onclick="go('workout')">
      <svg class="ic-wk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7.5 12h9"/><rect x="4" y="8.5" width="3" height="7" rx="1"/><rect x="17" y="8.5" width="3" height="7" rx="1"/><path d="M2 10.5v3M22 10.5v3"/></svg>Workout</button>
    <button data-tab="timers" onclick="go('timers')">
      <svg class="ic-tm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9.5V13l2.5 2M9.5 2h5"/></svg>Timers</button>
    <button data-tab="food" onclick="go('food')">
      <svg class="ic-fd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3v7c0 1.2.8 2 2 2s2-.8 2-2V3M7 3v18M17 3c-1.7 0-3 2.2-3 5s1.3 5 3 5v8"/></svg>Food</button>
    <button data-tab="body" onclick="go('body')">
      <svg class="ic-bd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.5 9 11l4 4 7.5-8.5"/><path d="M15.5 6.5h5v5"/></svg>Body</button>
  </div></nav>

  <div id="shade" onclick="closeSheet()"></div>
  <div id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>

  <div id="rest"><div class="in">
    <div class="tiny muted" style="letter-spacing:.09em; text-transform:uppercase; font-weight:700">Rest</div>
    <div class="clock num" id="restClock">1:30</div>
    <div class="bar"><i id="restBar" style="background:var(--wk); width:100%"></i></div>
    <div class="row" style="justify-content:center; gap:10px">
      <button class="btn" onclick="restAdd(-15)">−15s</button>
      <button class="btn" onclick="restAdd(15)">+15s</button>
      <button class="btn primary" onclick="restSkip()">Skip</button>
    </div>
  </div></div>

  <div id="toast" role="status"></div>
</div>

<script>
/* ============ state ============ */
const K='fitlog.v1';
const DEF_EX=[
  ['Bench press','Chest'],['Incline dumbbell press','Chest'],['Push-ups','Chest'],
  ['Squat','Legs'],['Leg press','Legs'],['Romanian deadlift','Legs'],['Lunges','Legs'],['Calf raise','Legs'],
  ['Deadlift','Back'],['Barbell row','Back'],['Lat pulldown','Back'],['Pull-ups','Back'],['Seated cable row','Back'],
  ['Overhead press','Shoulders'],['Lateral raise','Shoulders'],['Face pull','Shoulders'],
  ['Barbell curl','Arms'],['Dumbbell curl','Arms'],['Triceps pushdown','Arms'],['Skull crushers','Arms'],
  ['Plank','Core'],['Crunches','Core'],['Hanging leg raise','Core'],
  ['Treadmill run','Cardio'],['Cycling','Cardio'],['Jump rope','Cardio'],['Running (outdoor)','Cardio'],['Walking','Cardio'],
  ['Chest fly (dumbbell)','Chest'],['Cable crossover','Chest'],
  ['One-arm dumbbell row','Back'],['Reverse fly','Shoulders'],['Arnold press','Shoulders'],
  ['Front squat','Legs'],['Hip thrust','Legs'],['Bulgarian split squat','Legs'],
  ['Leg extension','Legs'],['Leg curl','Legs'],['Seated calf raise','Legs'],
  ['Close-grip bench press','Arms'],['Triceps dip','Arms'],['Hammer curl','Arms'],['Incline curl','Arms'],
  ['Incline barbell press','Chest'],['Overhead triceps extension','Arms'],['Wrist curl','Arms'],
  ['Wrist circles & prayer stretch','Mobility'],['Straight-leg raise','Mobility'],['Wall sit (pain-free)','Mobility'],
  ['Deep squat hold','Mobility'],['90/90 hip switch','Mobility'],['Couch stretch','Mobility'],
  ["World's greatest stretch",'Mobility'],['Cat-cow','Mobility'],['Downward dog to cobra','Mobility'],
  ['Standing hamstring fold','Mobility'],['Shoulder dislocates (stick)','Mobility'],['Dead hang','Mobility'],
  ['Cossack squat','Mobility'],['Thoracic rotations','Mobility'],['Ankle rocks','Mobility'],['Glute bridge','Mobility'],
  ['Burpees','Conditioning'],['Mountain climbers','Conditioning'],['Jumping jacks','Conditioning'],
  ['High knees','Conditioning'],['Kettlebell swing','Conditioning'],['Farmer’s carry','Conditioning'],
  ['Bear crawl','Conditioning'],['Broad jump','Conditioning'],
  ['Rowing (erg)','Cardio'],['SkiErg','Cardio'],
  ['Wall balls','Conditioning'],['Burpee broad jump','Conditioning'],
  ['Sled push','Conditioning'],['Sled pull','Conditioning'],['Sandbag lunges','Conditioning']
];
/* starter routines (by exercise name) and lacto-veg quick foods */
const SEED_RT=[
  {name:'Push day', ex:['Bench press','Overhead press','Incline dumbbell press','Chest fly (dumbbell)','Lateral raise','Triceps pushdown']},
  {name:'Pull day', ex:['Deadlift','Pull-ups','Seated cable row','Face pull','Barbell curl','Hammer curl']},
  {name:'Legs day', ex:['Squat','Romanian deadlift','Leg press','Leg curl','Bulgarian split squat','Calf raise']},
  {name:'Push — wrist-safe return', ex:['Incline dumbbell press','Chest fly (dumbbell)','Lateral raise','Overhead triceps extension','Triceps pushdown','Plank']},
  {name:'Pull — wrist-safe return', ex:['Lat pulldown','Seated cable row','One-arm dumbbell row','Face pull','Reverse fly','Hammer curl']},
  {name:'Legs — knee-safe return', ex:['Glute bridge','Romanian deadlift','Hip thrust','Leg curl','Calf raise','Wall sit (pain-free)']},
  {name:'Rehab: knee & wrist (~15 min)', ex:['Wrist circles & prayer stretch','Straight-leg raise','Wall sit (pain-free)','Glute bridge','Ankle rocks','Deep squat hold']},
  {name:'Conditioning — joint-friendly', ex:['Cycling','Kettlebell swing','Farmer’s carry','Glute bridge','Plank']},
  {name:'Hyrox stations', ex:['Rowing (erg)','Wall balls','Burpee broad jump','Farmer’s carry','Sandbag lunges','Kettlebell swing']},
  {name:'Mobility & flexibility (~20 min)', ex:['Cat-cow','Downward dog to cobra',"World's greatest stretch",'90/90 hip switch','Deep squat hold','Couch stretch','Standing hamstring fold','Shoulder dislocates (stick)','Cossack squat','Dead hang']},
  {name:'Agility & conditioning', ex:['Jumping jacks','High knees','Mountain climbers','Cossack squat','Bear crawl','Burpees','Kettlebell swing']}
];
const SEED_QK=[
  {name:'Whey (1 scoop)',kcal:130,p:24,c:4,f:2},{name:'Casein (1 scoop)',kcal:120,p:24,c:4,f:1},
  {name:'Milk 250ml',kcal:150,p:8,c:12,f:8},{name:'Curd (bowl, 200g)',kcal:120,p:7,c:9,f:6},
  {name:'Paneer 100g',kcal:265,p:18,c:4,f:20},{name:'Dal (bowl)',kcal:150,p:9,c:22,f:3},
  {name:'Roti (1)',kcal:100,p:3,c:18,f:2},{name:'Rice (bowl)',kcal:200,p:4,c:44,f:1},
  {name:'Hung curd 150g',kcal:130,p:15,c:6,f:5},{name:'Moong sprouts (bowl)',kcal:120,p:9,c:18,f:1},
  {name:'Peanuts 30g',kcal:170,p:8,c:5,f:14},
  {name:'Rajma/chole (bowl)',kcal:210,p:11,c:33,f:4},{name:'Oats 50g + milk',kcal:330,p:14,c:45,f:9},
  {name:'Peanut butter (tbsp)',kcal:95,p:4,c:3,f:8},{name:'Banana',kcal:105,p:1,c:27,f:0}
];
function defaults(){
  return {
    settings:{name:'', unit:'kg', waterGoal:3000, calGoal:2600, proteinGoal:120, carbGoal:340, fatGoal:75,
      rest:90, height:'176', goalWeight:'68', waterRemind:true, waterEvery:75, workoutRemind:'',
      sleepRemind:'22:30', sleepGoal:8, stepGoal:8000},
    exercises: DEF_EX.map(function(e,i){ return {id:'ex'+i, name:e[0], group:e[1]}; }),
    routines:[], sessions:[], active:null,
    water:{}, food:{}, quick:[], weights:[], sleep:{}, steps:{}, measures:[], reminders:[], plan:{}
  };
}
let S;
try{ S = Object.assign(defaults(), JSON.parse(localStorage.getItem(K)||'null') || {}); }
catch(e){ S = defaults(); }
S.settings = Object.assign(defaults().settings, S.settings||{});
/* one-time seed/upgrade: adds new exercises, starter routines and quick foods
   to an existing store without touching anything the user already changed */
(function seedV2(){
  if(S.seedV2) return; S.seedV2=true;
  DEF_EX.forEach(function(e,i){
    if(!S.exercises.some(function(x){return x.name===e[0];}))
      S.exercises.push({id:'ex'+i, name:e[0], group:e[1]});
  });
  SEED_RT.forEach(function(r){
    if(S.routines.some(function(x){return x.name===r.name;})) return;

/* beep via WebAudio */
let AC=null;
function beep(times){
  times = times||2;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    for(let i=0;i<times;i++){
      const o=AC.createOscillator(), g=AC.createGain();
      o.connect(g); g.connect(AC.destination);
      o.frequency.value=880; o.type='sine';
      const t0=AC.currentTime + i*0.28;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.4,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
      o.start(t0); o.stop(t0+0.24);
    }
  }catch(e){}
}
function notify(title, body, sound){
  /* Android only shows notifications via a service worker registration;
     desktop and iOS Safari accept the Notification constructor. Try both. */
  try{
    if('Notification' in window && Notification.permission==='granted'){
      const fallback=function(){ try{ new Notification(title,{body:body, tag:'fitlog'}); }catch(e){} };
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
        navigator.serviceWorker.getRegistration().then(function(reg){
          if(reg && reg.showNotification) reg.showNotification(title,{body:body, tag:'fitlog', vibrate:[200,80,200]});
          else fallback();
        }).catch(fallback);
      } else fallback();
    }
  }catch(e){}
  toast(title + (body ? ' — '+body : ''));
  vib([200,80,200]);
  if(sound) beep(2);
}

function targetFor(exId){
  const g=exGroupOf(exId);
  if(g==='Cardio'||g==='Mobility') return null;
  const pa=prevArr(exId); if(!pa) return null;
  const work=pa.filter(function(s){ return !s.wu && (+s.w||+s.r); });

  if(!w) return r ? 'target: '+(r+1)+' reps' : null;
  if(r>=12) return 'target: '+round25(w+2.5)+'×8 — add weight, reset reps';
  return 'target: '+w+'×'+(r+1)+' — one more rep than last time';

  const work=pa.filter(function(s){ return !s.wu && +s.w; });

  const w=Math.max.apply(null, work.map(function(s){return +s.w;}));

function weekStats(ws){
  const we=dShift(ws,6);
  function inR(d){ return d>=ws && d<=we; }
  const ses=S.sessions.filter(function(s){ return inR(s.date); });
  let vol=0, dur=0, km=0;
  ses.forEach(function(s){ vol+=s.vol||0; dur+=s.dur||0;
    s.ex.forEach(function(e){ if(exGroupOf(e.exId)==='Cardio') e.sets.forEach(function(t){ km+=+t.w||0; }); }); });
  let pr=0;
  S.exercises.forEach(function(ex){
    if(ex.group==='Cardio'||ex.group==='Mobility') return;
    let inBest=0, preBest=0;
    S.sessions.forEach(function(s){
      const e=s.ex.find(function(x){return x.exId===ex.id;}); if(!e) return;
      e.sets.forEach(function(t){
        const est=(+t.w||0)*(1+(+t.r||0)/30);
        if(inR(s.date)){ if(est>inBest) inBest=est; }
        else if(s.date<ws && est>preBest) preBest=est;
      });
    });
    if(inBest>0 && preBest>0 && inBest>preBest) pr++;
  });
  let slS=0,slN=0, waS=0,waN=0,waHit=0, stS=0,stN=0,stHit=0, kcS=0,ptS=0,fdN=0;
  for(let i=0;i<7;i++){
    const d=dShift(ws,i);
    const sl=S.sleep[d]; if(sl){ slS+=sl.hrs; slN++; }
    const w=S.water[d]||0; if(w>0){ waS+=w; waN++; if(w>=S.settings.waterGoal) waHit++; }
    const sp=S.steps[d]||0; if(sp>0){ stS+=sp; stN++; if(sp>=(+S.settings.stepGoal||8000)) stHit++; }
    const ft=foodTotals(d); if(ft.kcal>0){ kcS+=ft.kcal; ptS+=ft.p; fdN++; }
  }
  const wts=S.weights.filter(function(x){return inR(x.date);}).sort(function(a,b){return a.date<b.date?-1:1;});
  return {ses:ses.length, vol:vol, dur:dur, km:Math.round(km*10)/10, pr:pr,
    sleep: slN? Math.round(slS/slN*10)/10 :0, slN:slN,
    water: waN? Math.round(waS/waN) :0, waHit:waHit,
    steps: stS, stHit:stHit,
    kcal: fdN? Math.round(kcS/fdN) :0, prot: fdN? Math.round(ptS/fdN) :0, fdN:fdN,
    wDelta: wts.length>1? Math.round((wts[wts.length-1].kg-wts[0].kg)*10)/10 : null,

}
function dif(c,p,unitTxt,goodUp){
  if(!p && !c) return '';
  const d=Math.round((c-p)*10)/10;
  if(!d) return '<span class="muted">same as last wk</span>';
  const up=d>0, good=(goodUp===false)? !up : up;
  return '<span style="color:var(--'+(good?'good':'bad')+')">'+(up?'▲':'▼')+Math.abs(d)+(unitTxt||'')+' vs last wk</span>';
}
function coachNotes(cur,prv,adh){
  const n=[];
  if(cur.ses===0) n.push('No workouts this week. Restart small — one 15-minute rehab session tonight beats a perfect plan tomorrow.');
  else if(adh.planned>0 && adh.done>=adh.planned) n.push('You followed the plan '+adh.done+'/'+adh.planned+' days. This is the consistency that changes bodies.');
  else if(adh.planned>0) n.push('Plan adherence '+adh.done+'/'+adh.planned+'. Missed days happen — the rule is: never miss twice in a row.');
  if(cur.slN>=3 && cur.sleep<7) n.push('Sleep averaged '+cur.sleep+'h. Under 7 hours, strength and recovery stall — protect the 22:30 wind-down.');
  if(prv.vol>0 && cur.vol>prv.vol*1.25) n.push('Training volume jumped '+Math.round((cur.vol/prv.vol-1)*100)+'% vs last week. Keep increases near 10% — your knee and wrist are watching.');
  if(cur.fdN>=3 && cur.prot<(+S.settings.proteinGoal||120)*0.8) n.push('Protein averaged '+cur.prot+'g against your '+S.settings.proteinGoal+'g goal — one more whey scoop or 100g paneer daily closes it.');
  if(cur.wLast && prv.wLast && cur.wLast<prv.wLast-0.3 && cur.vol>=prv.vol) n.push('Body weight fell while training rose — you are under-eating for a muscle-building goal. Add ~200 kcal/day.');
  return n.slice(0,3);
}
function openReport(ws){
  ws = ws || wkMonday(today());
  const curWk = wkMonday(today());
  const cur=weekStats(ws), prv=weekStats(dShift(ws,-7));
  /* plan adherence + sets per muscle for this week */
  const we=dShift(ws,6), adh={planned:0, done:0}, gsets={};
  for(let i=0;i<7;i++){
    const d=dShift(ws,i);
    if(d>today()) break;
    const pid=(S.plan||{})[new Date(d+'T12:00:00').getDay()];
    if(pid){ adh.planned++; if(S.sessions.some(function(s){return s.date===d;})) adh.done++; }
  }
  S.sessions.forEach(function(s){
    if(s.date<ws||s.date>we) return;
    s.ex.forEach(function(e){
      const g=exGroupOf(e.exId);
      if(g==='Mobility') return;
      gsets[g]=(gsets[g]||0)+e.sets.filter(function(t){return !t.wu;}).length;
    });
  });
  const gtxt=Object.keys(gsets).sort(function(a,b){return gsets[b]-gsets[a];})
    .map(function(g){return g+' '+gsets[g];}).join(' · ');
  function row(l,v,d){ return '<div class="listrow"><span class="small">'+l+'</span><span class="small num" style="text-align:right">'+v+(d?'<div class="tiny">'+d+'</div>':'')+'</span></div>'; }
  function sect(t){ return '<div class="tiny muted" style="margin:14px 0 2px; font-weight:700; letter-spacing:.07em; text-transform:uppercase">'+t+'</div>'; }
  let h='<h3 style="margin-bottom:4px">Weekly report</h3>'+
    '<div class="datebar" style="margin-bottom:4px"><button class="btn sm" onclick="openReport(\''+dShift(ws,-7)+'\')">‹</button>'+
    '<b class="num">'+fmtD(ws)+' – '+fmtD(dShift(ws,6))+(ws===curWk?' (this week)':'')+'</b>'+
    '<button class="btn sm" onclick="openReport(\''+dShift(ws,7)+'\')" '+(ws>=curWk?'disabled style="opacity:.35"':'')+'>›</button></div>';
  h+=sect('Training')+
    row('Workouts', cur.ses, dif(cur.ses,prv.ses,''))+
    (adh.planned? row('Plan adherence', adh.done+' / '+adh.planned,'') : '')+
    row('Volume', Math.round(cur.vol).toLocaleString()+' '+unit(), dif(Math.round(cur.vol),Math.round(prv.vol),''))+
    row('Time training', Math.round(cur.dur/60)+' min','')+
    row('New PRs', cur.pr,'')+
    (gtxt? '<div class="tiny muted num" style="padding:8px 2px">Working sets: '+gtxt+'</div>' : '');
  h+=sect('Cardio & steps')+
    row('Distance', cur.km+' km', dif(cur.km,prv.km,' km'))+
    row('Steps', cur.steps.toLocaleString(), dif(cur.steps,prv.steps,''))+
    row('Step-goal days', cur.stHit+' / 7','');
  h+=sect('Sleep')+
    row('Average', cur.slN? cur.sleep+' h':'—', dif(cur.sleep,prv.sleep,' h'))+
    row('Nights logged', cur.slN+' / 7','');
  h+=sect('Nutrition & water')+
    row('Avg calories', cur.fdN? cur.kcal+' kcal':'—', dif(cur.kcal,prv.kcal,''))+
    row('Avg protein', cur.fdN? cur.prot+' g':'—', dif(cur.prot,prv.prot,' g'))+
    row('Water goal days', cur.waHit+' / 7','')+
    row('Avg water', cur.water? Math.round(cur.water/100)/10+' L':'—','');
  h+=sect('Body')+
    row('Weight', cur.wLast? cur.wLast+' '+unit():'—',
        cur.wDelta!==null? '<span class="muted">'+(cur.wDelta>0?'+':'')+cur.wDelta+' '+unit()+' within week</span>':'');
  const notes=coachNotes(cur,prv,adh);
  if(notes.length){
    h+=sect('Coach’s notes');
    notes.forEach(function(x){ h+='<p class="small" style="margin:6px 0; color:var(--ink2)">— '+x+'</p>'; });
  }
  h+='<p class="tiny muted" style="margin-top:14px">Deltas compare with the previous week. Green = moving the right way for your goals.</p>';
  openSheet(h);
}

let WV='home'; /* home | session | library | history | routine */
let editRoutineId=null;
function exName(id){ const e=S.exercises.find(function(x){return x.id===id;}); return e?e.name:'(deleted)'; }
function exGroupOf(id){ const e=S.exercises.find(function(x){return x.id===id;}); return e?e.group:''; }
function fmtSet(s, grp){
  if(grp==='Cardio') return s.w+'km/'+s.r+'min';
  return s.w+'×'+s.r;
}
function prevArr(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const ex=S.sessions[i].ex.find(function(e){ return e.exId===exId; });
    if(ex && ex.sets.length) return ex.sets;
  }
  return null;
}
function prevSets(exId){
  const grp=exGroupOf(exId), pa=prevArr(exId);
  return pa ? pa.map(function(s){ return fmtSet(s,grp); }).join('  ') : '';
}
function cardioBest(exId){
  let km=0, pace=null;
  S.sessions.forEach(function(s){ s.ex.forEach(function(e){
    if(e.exId!==exId) return;
    e.sets.forEach(function(t){
      const d=+t.w||0, m=+t.r||0;
      if(d>km) km=d;
      if(d>=0.4 && m>0){ const p=m/d; if(pace===null||p<pace) pace=p; }
    });
  });});
  if(!km) return null;
  let ptxt='—';
  if(pace!==null){ const pm=Math.floor(pace); ptxt=pm+':'+pad(Math.round((pace-pm)*60)); }
  return {km:km, pace:ptxt};
}
function bestFor(exId){
  let best=null;
  S.sessions.forEach(function(s){ s.ex.forEach(function(e){
    if(e.exId!==exId) return;
    e.sets.forEach(function(t){
      if(t.wu) return;
      const est=(+t.w||0)*(1+(+t.r||0)/30);
      if(!best || est>best.est) best={w:+t.w||0, r:+t.r||0, est:est, date:s.date};
    });
  });});
  return best;
}

     '<button class="btn grow" onclick="WV=\'library\';renderWorkout()">Exercises</button></div>';

function startSession(routineId){
  const ex=[];
  if(routineId){

function finishSession(){
  const a=S.active;
  a.ex=a.ex.filter(function(e){ return e.sets.some(function(s){ return s.done||s.w||s.r; }); });
  if(!a.ex.length){ toast('Nothing logged — discarding'); S.active=null; save(); WV='home'; renderWorkout(); return; }
  let vol=0, nSets=0;
  const prs=[];
  a.ex.forEach(function(e){
    e.sets=e.sets.filter(function(s){return s.w||s.r;});
    const g=exGroupOf(e.exId), lift=(g!=='Cardio'&&g!=='Mobility');
    /* bests before this session (warm-ups never count) */
    let bw=0, b1=0;
    if(lift) S.sessions.forEach(function(s){
      const pe=s.ex.find(function(x){return x.exId===e.exId;}); if(!pe) return;
      pe.sets.forEach(function(t){ if(t.wu) return;
        const w=+t.w||0, est=w*(1+(+t.r||0)/30);
        if(w>bw) bw=w; if(est>b1) b1=est; });
    });
    let exPR=null;
    e.sets.forEach(function(s){
      nSets++;
      if(g==='Cardio'||s.wu) return;
      const w=+s.w||0, r=+s.r||0, est=w*(1+r/30);
      vol+=w*r;
      if(!lift) return;
      if(bw>0 && w>bw){ exPR={ex:exName(e.exId), txt:w+'×'+r+' — heaviest ever'}; bw=w; }
      else if(b1>0 && est>b1 && !exPR){ exPR={ex:exName(e.exId), txt:w+'×'+r+' — est 1RM '+Math.round(est)+' '+unit()}; b1=est; }
    });
    if(exPR) prs.push(exPR);
  });
  const dur=Math.round((Date.now()-a.start)/1000);
  const sess={id:a.id, name:a.name, date:a.date, dur:dur, vol:vol, ex:a.ex, prs:prs};
  S.sessions.push(sess);
  S.active=null; save(); WV='home'; renderWorkout();
  openSheet('<h3>Workout complete 💪</h3>'+
    '<div class="row" style="gap:18px; margin-bottom:8px">'+
    '<div><div class="big num" style="font-size:24px">'+Math.round(dur/60)+'m</div><div class="tiny muted">duration</div></div>'+
    '<div><div class="big num" style="font-size:24px">'+Math.round(vol).toLocaleString()+'</div><div class="tiny muted">'+unit()+' volume</div></div>'+
    '<div><div class="big num" style="font-size:24px">'+nSets+'</div><div class="tiny muted">sets</div></div>'+
    '<div><div class="big num" style="font-size:24px">'+(prs.length||'—')+'</div><div class="tiny muted">PRs</div></div></div>'+
    (prs.length
      ? prs.map(function(p){ return '<div class="listrow"><span class="small">🏆 '+esc(p.ex)+'</span><span class="small num muted">'+p.txt+'</span></div>'; }).join('')
      : '<p class="small muted">No records today — showing up is the base of every PR.</p>')+
    '<div class="field" style="margin-top:14px"><label for="sesNote">Note (optional)</label>'+
    '<textarea id="sesNote" rows="2" placeholder="How did it feel? Knee/wrist okay?"></textarea></div>'+
    '<button class="btn primary wide" onclick="saveSesNote(\''+sess.id+'\')">Done</button>');
}

function plates(){

  const AVAIL=[25,20,15,10,5,2.5,1.25];
  let side=(target-bar)/2, picked=[];
  AVAIL.forEach(function(p){ while(side>=p-0.001){ picked.push(p); side-=p; } });
  const loaded=target-side*2;
  out.innerHTML = picked.length
    ? '<b>Per side:</b> '+picked.join(' + ')+' kg'+
      (side>0.001? '<div class="tiny muted" style="margin-top:4px">Closest loadable: '+loaded+' kg (off by '+Math.round(side*2*100)/100+')</div>':'')
    : '<b>Empty bar</b> — '+bar+' kg total.';
}

/* ============ REST TIMER ============ */
let restEnd=0, restTotal=0, restInt=null, restLastS=-1;
const REST_PRESETS=[30,60,90,120,180,300];
function drawRestPresets(){
  $('#restPresets').innerHTML = REST_PRESETS.map(function(s){
    const lbl = s<60 ? s+'s' : (s%60===0 ? (s/60)+'m' : Math.floor(s/60)+':'+pad(s%60));
    return '<button class="chip" onclick="startRest('+s+')">'+lbl+'</button>';

function startRest(sec){
  sec=+sec||90; restTotal=sec; restEnd=Date.now()+sec*1000; restLastS=-1;
  $('#rest').classList.add('on');
  clearInterval(restInt); restInt=setInterval(restTick,150); restTick();
}
function restFromCustom(){ const v=+$('#restCustom').value; if(v>0) startRest(v); }
function restAdd(d){ restEnd+=d*1000; restTotal=Math.max(restTotal+d,1); restTick(); }
function restTick(){
  const left=Math.max(0, restEnd-Date.now());
  const s=Math.ceil(left/1000);
  $('#restClock').textContent = Math.floor(s/60)+':'+pad(s%60);
  $('#restBar').style.width = (restTotal? (left/1000)/restTotal*100 :0)+'%';
  if(s!==restLastS){
    restLastS=s;
    if(s<=5 && s>0){ vib(140); $('#restClock').style.color='var(--wk)'; }
    else $('#restClock').style.color='';
  }
  if(left<=0){
    clearInterval(restInt); restInt=null;
    beep(3); vib([300,100,300]); notify('Rest over','Next set!');
    setTimeout(function(){ $('#rest').classList.remove('on'); }, 1200);
  }
}

/* ============ STOPWATCH ============ */
let swRun=false, swAcc=0, swT0=0, swInt=null, swLapsArr=[];
function swFmt(ms){
  const t=Math.floor(ms/100), d=t%10, s=Math.floor(t/10)%60, m=Math.floor(t/600);
  return pad(m)+':'+pad(s)+'.'+d;
}
function swToggle(){
  if(swRun){ swAcc+=Date.now()-swT0; swRun=false; clearInterval(swInt); $('#swMain').textContent='Start'; }
  else{ swT0=Date.now(); swRun=true; swInt=setInterval(swDraw,100); $('#swMain').textContent='Pause'; }
}
function swNow(){ return swAcc + (swRun? Date.now()-swT0 :0); }
function swDraw(){ $('#swClock').textContent=swFmt(swNow()); }
function swLap(){
  if(!swRun && swNow()===0) return;
  swLapsArr.unshift(swNow());
  $('#swLaps').innerHTML=swLapsArr.map(function(t,i){
    const prev=swLapsArr[i+1]||0;
    return '<div class="listrow"><span class="tiny muted">Lap '+(swLapsArr.length-i)+'</span><span class="small num">'+swFmt(t-prev)+' <span class="muted">· '+swFmt(t)+'</span></span></div>';
  }).join('');
}
function swReset(){ swRun=false; clearInterval(swInt); swAcc=0; swLapsArr=[];
  $('#swClock').textContent='00:00.0'; $('#swLaps').innerHTML=''; $('#swMain').textContent='Start'; }

/* ============ HIIT ============ */
let hi={run:false, phase:'ready', round:0, end:0, int:null};
function hiToggle(){
  if(hi.run){ hi.pauseLeft=hi.end-Date.now(); hi.run=false; clearInterval(hi.int); $('#hiMain').textContent='Resume'; return; }
  if(hi.phase==='ready'||hi.phase==='done'){ hi.phase='work'; hi.round=1; hi.end=Date.now()+(+$('#hiWork').value||30)*1000; beep(1); }
  else if(hi.pauseLeft){ hi.end=Date.now()+hi.pauseLeft; hi.pauseLeft=0; }
  hi.run=true; $('#hiMain').textContent='Pause';
  clearInterval(hi.int); hi.int=setInterval(hiTick,150); hiTick();
}
function hiTick(){
  const W=+$('#hiWork').value||30, R=+$('#hiRest').value||0, N=+$('#hiRounds').value||1;
  const left=hi.end-Date.now();
  if(left<=0){
    if(hi.phase==='work'){
      if(hi.round>=N && R===0){ return hiDone(); }
      if(R>0){ hi.phase='rest'; hi.end=Date.now()+R*1000; beep(2); vib(200); }
      else { hi.round++; hi.end=Date.now()+W*1000; beep(1); }
    } else { /* rest over */
      if(hi.round>=N){ return hiDone(); }
      hi.round++; hi.phase='work'; hi.end=Date.now()+W*1000; beep(1); vib(100);
    }
  }
  const s=Math.ceil(Math.max(0,hi.end-Date.now())/1000);
  $('#hiClock').textContent=Math.floor(s/60)+':'+pad(s%60);
  $('#hiClock').style.color = hi.phase==='work' ? 'var(--wk)' : 'var(--wa)';
  $('#hiPhase').textContent = (hi.phase==='work'?'WORK':'REST')+' · round '+hi.round+' of '+N;
}
function hiDone(){
  clearInterval(hi.int); hi.run=false; hi.phase='done';
  $('#hiClock').textContent='Done'; $('#hiClock').style.color='var(--good)';
  $('#hiPhase').textContent='All rounds complete';
  $('#hiMain').textContent='Start';
  beep(4); vib([400,120,400]); notify('HIIT complete','Nice work.');
}
function hiReset(){ clearInterval(hi.int); hi={run:false,phase:'ready',round:0,end:0,int:null};
  $('#hiClock').textContent='Ready'; $('#hiClock').style.color='';
  $('#hiPhase').textContent=($('#hiWork').value||40)+'s work · '+($('#hiRest').value||20)+'s rest · '+($('#hiRounds').value||8)+' rounds';
  $('#hiMain').textContent='Start'; }

    });

function weightChart(ws){
  const data=ws.slice(-30);
  const W=396, H=140, PL=34, PR=12, PT=12, PB=20;
  let mn=Math.min.apply(null,data.map(function(d){return d.kg;}));
  let mx=Math.max.apply(null,data.map(function(d){return d.kg;}));
  const goal=+S.settings.goalWeight||null;
  if(goal){ mn=Math.min(mn,goal); mx=Math.max(mx,goal); }
  const span=(mx-mn)||1; mn-=span*0.12; mx+=span*0.12;
  const X=function(i){ return PL+(W-PL-PR)*(data.length===1?0.5:i/(data.length-1)); };
  const Y=function(v){ return PT+(H-PT-PB)*(1-(v-mn)/(mx-mn)); };
  let pts=data.map(function(d,i){ return X(i)+','+Y(d.kg); }).join(' ');
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto; margin-top:12px" role="img" aria-label="Weight trend, last '+data.length+' entries">';
  /* faint grid: 3 lines */
  [0.25,0.5,0.75].forEach(function(f){
    const y=PT+(H-PT-PB)*f, v=Math.round((mx-(mx-mn)*f)*10)/10;
    svg+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'+
      '<text x="'+(PL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="var(--ink3)" style="font-variant-numeric:tabular-nums">'+v+'</text>';
  });
  if(goal){
    svg+='<line x1="'+PL+'" y1="'+Y(goal)+'" x2="'+(W-PR)+'" y2="'+Y(goal)+'" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/>'+
      '<text x="'+(W-PR)+'" y="'+(Y(goal)-4)+'" text-anchor="end" font-size="10" fill="var(--good)">goal '+goal+'</text>';
  }
  /* area + line */
  svg+='<polygon points="'+X(0)+','+(H-PB)+' '+pts+' '+X(data.length-1)+','+(H-PB)+'" fill="var(--bd)" opacity="0.13"/>';
  svg+='<polyline points="'+pts+'" fill="none" stroke="var(--bd)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  /* endpoint emphasized */
  const lx=X(data.length-1), ly=Y(data[data.length-1].kg);
  svg+='<circle cx="'+lx+'" cy="'+ly+'" r="4.5" fill="var(--bd)" stroke="var(--surface)" stroke-width="2"/>';
  /* x labels: first + last */
  svg+='<text x="'+PL+'" y="'+(H-5)+'" font-size="10" fill="var(--ink3)">'+fmtD(data[0].date)+'</text>';
  svg+='<text x="'+(W-PR)+'" y="'+(H-5)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+fmtD(data[data.length-1].date)+'</text>';
  svg+='</svg>';
  return svg;
}

  a.href=URL.createObjectURL(blob);
  a.download='fitlog-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  S.lastBackup=today(); save();
  toast('Backup downloaded');
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=function(){
    try{
      const d=JSON.parse(rd.result);
      if(!d.settings || !d.exercises) throw 0;
      S=Object.assign(defaults(), d);
      save(); closeSheet(); render(); toast('Backup restored');
    }catch(e){ toast('That file is not a FitLog backup'); }
  };
  rd.readAsText(f);
}
function resetAll(){
  if(!confirm('Erase ALL data? This cannot be undone.')) return;
  if(!confirm('Really sure? Export a backup first if in doubt.')) return;
  S=defaults(); save(); closeSheet(); go('today'); toast('Fresh start');
}

/* ============ reminders engine ============ */
let lastDrinkTs=Date.now(), lastRemindTs=0, wkRemindedOn='', slRemindedOn='', remFiredOn={};
setInterval(function(){
  const st=S.settings, now=new Date(), hr=now.getHours();
  const hm=pad(hr)+':'+pad(now.getMinutes());
  if(st.sleepRemind && slRemindedOn!==today() && hm===st.sleepRemind){
    slRemindedOn=today();
    notify('Wind down 🌙','In bed by 11pm — sleep is where the muscle gets built.', true);
  }
  (S.reminders||[]).forEach(function(r){
    if(remFiredOn[r.id]===today() || hm!==r.time) return;
    remFiredOn[r.id]=today();
    notify('⏰ '+r.label,'', true);
  });
  if(st.waterRemind && hr>=8 && hr<22){
    const since=Date.now()-Math.max(lastDrinkTs,lastRemindTs);
    if(since > st.waterEvery*60000){
      lastRemindTs=Date.now();
      const left=Math.max(0, st.waterGoal-waterToday());
      notify('Time to drink water 💧', left>0 ? Math.round(left/1000*10)/10+'L to go today' : 'Goal already met — sip anyway', true);
    }
  }
  if(st.workoutRemind && wkRemindedOn!==today()){
    if(hm===st.workoutRemind && !S.sessions.some(function(s){return s.date===today();})){
      wkRemindedOn=today();
      const prt=todaysPlanRoutine();
      notify('Workout time 🏋️', prt? 'Today’s plan: '+prt.name : 'You planned to train at '+st.workoutRemind, true);
    }
  }
}, 30000);

/* ============ boot ============ */
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
drawRestPresets();
hiReset();
renderToday();
</script>
