function weightChart(ws, bmiMode){
  const data=ws.slice(-30);
  const W=396, H=140, PL=34, PR=12, PT=12, PB=20;
  let mn=Math.min.apply(null,data.map(function(d){return d.kg;}));
  let mx=Math.max.apply(null,data.map(function(d){return d.kg;}));
  /* in BMI mode the series is BMI, so the goal has to be converted too or it
     would draw a 68 kg line onto a scale that tops out around 25 */
  const goal=(bmiMode==='vo2') ? null
    : bmiMode
      ? (S.settings.height? bmiOf(+S.settings.goalWeight, S.settings.height) : null)
      : (+S.settings.goalWeight||null);
  if(goal){ mn=Math.min(mn,goal); mx=Math.max(mx,goal); }
  const span=(mx-mn)||1; mn-=span*0.12; mx+=span*0.12;
  const X=function(i){ return PL+(W-PL-PR)*(data.length===1?0.5:i/(data.length-1)); };
  const Y=function(v){ return PT+(H-PT-PB)*(1-(v-mn)/(mx-mn)); };
  let pts=data.map(function(d,i){ return X(i)+','+Y(d.kg); }).join(' ');
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto; margin-top:12px" role="img" aria-label="Weight trend, last '+data.length+' entries">';
  /* faint grid: 3 lines */
  [0.25,0.5,0.75].forEach(function(f){
    const y=PT+(H-PT-PB)*f, v=Math.round((mx-(mx-mn)*f)*10)/10;
    svg+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'+
      '<text x="'+(PL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="var(--ink3)" style="font-variant-numeric:tabular-nums">'+v+'</text>';
  });
  if(goal){
    svg+='<line x1="'+PL+'" y1="'+Y(goal)+'" x2="'+(W-PR)+'" y2="'+Y(goal)+'" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/>'+
      '<text x="'+(W-PR)+'" y="'+(Y(goal)-4)+'" text-anchor="end" font-size="10" fill="var(--good)">goal '+goal+'</text>';
  }
  /* area + line */
  svg+='<polygon points="'+X(0)+','+(H-PB)+' '+pts+' '+X(data.length-1)+','+(H-PB)+'" fill="var(--bd)" opacity="0.13"/>';
  svg+='<polyline points="'+pts+'" fill="none" stroke="var(--bd)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  /* endpoint emphasized */
  const lx=X(data.length-1), ly=Y(data[data.length-1].kg);
  svg+='<circle cx="'+lx+'" cy="'+ly+'" r="4.5" fill="var(--bd)" stroke="var(--surface)" stroke-width="2"/>';
  /* x labels: first + last */
  svg+='<text x="'+PL+'" y="'+(H-5)+'" font-size="10" fill="var(--ink3)">'+fmtD(data[0].date)+'</text>';
  svg+='<text x="'+(W-PR)+'" y="'+(H-5)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+fmtD(data[data.length-1].date)+'</text>';
  svg+='</svg>';
  return svg;
}

function addPhoto(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=function(){
    const img=new Image();
    img.onload=function(){
      const MAX=720;
      let w=img.width, h=img.height;
      const sc=Math.min(1, MAX/Math.max(w,h));
      w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const data=c.toDataURL('image/jpeg',0.72);
      const entry={id:uid(), date:today(), data:data};
      S.photos.push(entry);
      try{
        localStorage.setItem(K, JSON.stringify(S));
        renderBody(); toast('Photo saved ('+Math.round(data.length/1365)+' KB)');
      }catch(e){
        S.photos.pop();
        toast('Storage full. Delete old photos or export a backup first');
      }
    };
    img.onerror=function(){ toast('Could not read that image'); };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
  inp.value='';
}

function collectSettings(){

function snapshotMeta(){
  try{ const m=localStorage.getItem(K+'.bak.meta'); return m? JSON.parse(m) : null; }catch(e){ return null; }
}
function restoreSnapshot(){
  let raw=null;
  try{ raw=localStorage.getItem(K+'.bak'); }catch(e){}
  if(!raw){ toast('No snapshot stored'); return; }
  const m=snapshotMeta()||{};
  if(!confirm('Restore your data as it was before the '+(m.from?'v'+m.from+' → v'+m.to+' ':'')+'update?\n\nAnything logged since then will be replaced.')) return;
  try{
    /* keep the current state recoverable too, so this is never a one-way door */
    localStorage.setItem(K+'.undo', localStorage.getItem(K)||'');
    localStorage.setItem(K, raw);
    location.reload();
  }catch(e){ toast('Could not restore, storage unavailable'); }
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='coachz-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  S.lastBackup=today(); save();
  toast('Backup downloaded');
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=function(){
    try{
      const d=JSON.parse(rd.result);
      if(!d.settings || !d.exercises) throw 0;
      S=Object.assign(defaults(), d);
      /* same normalization as boot: fill any settings keys the backup predates */
      S.settings=Object.assign(defaults().settings, S.settings||{});
      /* a pre-v16 backup carries steps and the retired breathwork checkbox;
         migrations only run at boot, so apply the current one here too */
      delete S.seedV16; seedV16();
      delete S.seedV17; seedV17();
      save(); closeSheet(); render(); toast('Backup restored');
    }catch(e){ toast('That file is not a CoachZ backup'); }
  };
  rd.readAsText(f);
}
function resetAll(){
  if(!confirm('Erase ALL data? This cannot be undone.')) return;
  if(!confirm('Really sure? Export a backup first if in doubt.')) return;
  S=defaults(); save(); closeSheet(); go('today'); toast('Fresh start');
}

/* ============ reminders engine ============ */
let lastDrinkTs=Date.now(), lastRemindTs=0, wkRemindedOn='', slRemindedOn='', spRemindedOn='', remFiredOn={};
setInterval(function(){
  const st=S.settings, now=new Date(), hr=now.getHours();
  const hm=pad(hr)+':'+pad(now.getMinutes());
  if(st.sleepRemind && slRemindedOn!==today() && hm===st.sleepRemind){
    slRemindedOn=today();
    notify('Wind down 🌙','In bed by 11pm. Sleep is where the muscle gets built.', true);
  }
  (S.reminders||[]).forEach(function(r){
    if(r.date && r.date!==today()) return;
    if(remFiredOn[r.id]===today() || hm!==r.time) return;
    remFiredOn[r.id]=today();
    notify('⏰ '+r.label,'', true);
    if(r.date){ S.reminders=S.reminders.filter(function(x){return x.id!==r.id;}); save(); }
  });
  if(spRemindedOn!==today() && hm==='21:00'){
    spRemindedOn=today();
    const missed=S.supps.filter(function(sp){ return !(S.suppLog[today()]||{})[sp.id]; })
      .map(function(sp){ return shortSuppName(sp.name); });
    if(!breathMins(today())) missed.push('breathwork');
    if(missed.length) notify('Evening check ✅', missed.join(', '), true);
  }
  if(st.waterRemind && hr>=8 && hr<22){
    const since=Date.now()-Math.max(lastDrinkTs,lastRemindTs);
    if(since > st.waterEvery*60000){
      lastRemindTs=Date.now();
      const left=Math.max(0, st.waterGoal-waterToday());
      notify('Time to drink water 💧', left>0 ? Math.round(left/1000*10)/10+'L to go today' : 'Goal already met, sip anyway', true);
    }
  }
  if(st.workoutRemind && wkRemindedOn!==today()){
    if(hm===st.workoutRemind && !S.sessions.some(function(s){return s.date===today();})){
      wkRemindedOn=today();
      const prt=todaysPlanRoutine();
      notify('Workout time 🏋️', prt? 'Today’s plan: '+prt.name : 'You planned to train at '+st.workoutRemind, true);
    }
  }
}, 30000);

    [['ppl3','3 days a week','Push · Pull · Legs with rest between: the honest starting point'],
     ['ppl6','6 days a week','Full Push-Pull-Legs ×2, for experienced lifters'],
     ['cardio','Strength + VO2max','Push · Pull · Legs plus two 4×4 interval sessions, the best-evidenced cardio there is'],
     ['gentle','Gentle start','3 joint-friendly days + mobility, returning after a break or injury']].map(function(p){
      return '<button class="btn wide" style="margin-bottom:10px; justify-content:flex-start; text-align:left" onclick="obFinish(\''+p[0]+'\')"><span><b>'+p[1]+'</b><span class="tiny muted" style="display:block; font-weight:500">'+p[2]+'</span></span></button>';
    }).join(''));

function obFinish(planKey){
  const st=S.settings;
  st.name=OB.name||''; st.height=String(OB.h||''); st.unit='kg';
  const w=OB.w||65, hgt=OB.h||170, age=OB.age||27;
  /* the onboarding already asks for these for the BMR maths; keep them, or
     VO2max banding has nothing to work with later */
  st.age=String(age); st.sex=(OB.sex==='f'?'f':'m'); st.fiberGoal=30;
  st.diet=DIET_ALLOWS[OB.diet]?OB.diet:'veg';
  const bmr = 10*w + 6.25*hgt - 5*age + (OB.sex==='f' ? -161 : 5);
  const adj = OB.goal==='gain' ? 300 : (OB.goal==='lose' ? -350 : 0);
  st.calGoal = Math.round((bmr*1.5 + adj)/50)*50;
  st.proteinGoal = Math.round(w*1.8);
  st.carbGoal = Math.round(st.calGoal*0.45/4);
  st.fatGoal = Math.round(st.calGoal*0.27/9);
  st.waterGoal = Math.round(w*35/250)*250;
  st.goalWeight = OB.goal==='gain' ? String(Math.round(w+4)) : (OB.goal==='lose' ? String(Math.round(w-4)) : '');
  if(w>0 && !S.weights.length) S.weights.push({date:today(), kg:w});
  function rid(n){ const r=S.routines.find(function(x){return x.name===n;}); return r?r.id:''; }
  if(planKey==='ppl6') S.plan={1:rid('Push day'),2:rid('Pull day'),3:rid('Legs day'),4:rid('Push day'),5:rid('Pull day'),6:rid('Legs day'),0:''};
  else if(planKey==='gentle') S.plan={1:rid('Push: joint-friendly'),2:rid('Joint prep (~15 min)'),3:rid('Pull: joint-friendly'),4:'',5:rid('Legs: joint-friendly (legs)'),6:rid('Mobility & flexibility (~20 min)'),0:''};
  /* Lifting on the odd days, 4×4 intervals on the even ones: hard cardio never
     lands the day before legs, and the two interval sessions sit three days
     apart, which is the spacing the Norwegian protocol was tested at. */
  else if(planKey==='cardio') S.plan={1:rid('Push day'),2:rid('VO2max intervals (4×4)'),3:rid('Pull day'),4:'',5:rid('Legs day'),6:rid('VO2max intervals (4×4)'),0:''};
  else S.plan={1:rid('Push day'),2:'',3:rid('Pull day'),4:'',5:rid('Legs day'),6:rid('Mobility & flexibility (~20 min)'),0:''};
  S.programStart=today();
  S.lastPhase=null; st.onboarded=true;
  save();
  S.lastPhase=currentPhase().name; save();
  closeSheet(); go('today');
  toast('Welcome, '+(st.name||'athlete')+': '+st.calGoal+' kcal · '+st.proteinGoal+'g protein set');
}

/* Swipe-left to delete on food rows. Deliberately conservative: it only starts
   once the gesture is clearly horizontal, so it never fights the page scroll. */
function initSwipe(){
  let el=null, x0=0, y0=0, dx=0, locked='';
  const root=document.body;
  root.addEventListener('touchstart', function(e){
    const t=e.target.closest && e.target.closest('.swipe[data-sw]');
    if(!t || e.touches.length!==1){ el=null; return; }
    el=t; x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; locked='';
    el.classList.add('sw');
  }, {passive:true});
  root.addEventListener('touchmove', function(e){
    if(!el) return;
    const x=e.touches[0].clientX, y=e.touches[0].clientY;
    if(!locked){
      if(Math.abs(x-x0)>10 && Math.abs(x-x0)>Math.abs(y-y0)) locked='x';
      else if(Math.abs(y-y0)>10){ locked='y'; el.classList.remove('sw'); el.style.transform=''; el=null; return; }
    }
    if(locked!=='x') return;
    dx=Math.min(0, x-x0);
    el.style.transform='translateX('+dx+'px)';
    el.style.opacity=String(Math.max(0.35, 1+dx/220));
  }, {passive:true});
  root.addEventListener('touchend', function(){
    if(!el) return;
    const node=el, ref=node.dataset.sw;
    node.classList.remove('sw');
    if(dx < -90){
      node.classList.add('gone'); vib(14);
      const parts=ref.split(':');
      setTimeout(function(){ delFood(parts[0], parts[1]); }, 160);
    } else {
      node.style.transform=''; node.style.opacity='';
    }
    el=null; dx=0; locked='';
  }, {passive:true});
}
