<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#0e1214; --surface:#161d21; --raised:#1f282e; --line:#2b373f;
    --ink:#edf2f4; --ink2:#93a6b0; --ink3:#5c6d76;
    --wk:#f2a03d; --wk-dim:#f2a03d33;
    --wa:#56b8e8; --wa-dim:#56b8e833;
    --fd:#8fd068; --fd-dim:#8fd06833;
    --bd:#b48ee0; --bd-dim:#b48ee033;
    --sl:#8ea0e8; --br:#5ecfb5;
    --bad:#e8695e; --good:#4fc98a;
    --r:16px;
    --fd-disp:'Oswald', 'Arial Narrow', -apple-system, Roboto, system-ui, sans-serif;
    --fd-serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
    
    --grad-am:linear-gradient(135deg, #ffc76e, #f08a2b);
  }
  body.light{
    --bg:#f3f1ea; --surface:#ffffff; --raised:#eae7de; --line:#ddd8cc;
    --ink:#20262b; --ink2:#5d6b73; --ink3:#9aa4ab;
  }
  body.light .card, body.light .tile{box-shadow:0 1px 3px #0000000f}
  body.light #celebrate{background:radial-gradient(circle at 50% 38%, #2a2416e6, #14100af0)}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;
    font-size:16px; line-height:1.45;
    min-height:100vh; min-height:100dvh;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
  input,select,textarea{font:inherit; color:var(--ink); background:var(--raised); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--wk); outline-offset:1px}
  input[type=number]{font-variant-numeric:tabular-nums}
  ::placeholder{color:var(--ink3)}

  #app{max-width:480px; margin:0 auto; padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 8px;
  }
  header.top .brand{font-family:var(--fd-disp); font-weight:800; letter-spacing:-.02em; font-size:21px}
  header.top .brand small{display:block; font-weight:500; font-size:12px; color:var(--ink2); letter-spacing:.01em}
  .gear{width:44px;height:44px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink2)}

  main{padding:6px 14px 20px; display:block}
  section.tab{display:none}
  section.tab.on{display:block}

  .card{background:var(--surface); border:0; border-radius:var(--r); padding:17px; margin-bottom:14px}
  .osec{padding:4px 4px 0; margin-bottom:24px}
  .statrow{display:flex; gap:10px; margin:2px 6px 22px}
  .stat{flex:1}
  .stat .tv{font-family:var(--fd-disp); font-size:34px; font-weight:700; line-height:1.05}
  .stat .tl{font-family:var(--fd-disp); font-size:10px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--ink3); margin-bottom:7px; display:block}
  .orow{width:100%; text-align:left; padding:13px 2px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px}
  .card h2,.osec h2{font-family:var(--fd-disp); font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); margin-bottom:12px; display:flex; align-items:center; gap:8px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%}
  .row{display:flex; align-items:center; gap:10px}
  .row.wrap{flex-wrap:wrap}
  .spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .grow{flex:1}
  .muted{color:var(--ink2)} .tiny{font-size:12px} .small{font-size:13.5px}
  .num{font-variant-numeric:tabular-nums}
  .big{font-family:var(--fd-disp); font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
  .serifacc{font-family:var(--fd-serif); font-style:italic; font-size:1.18em; letter-spacing:.01em}
  .qcard{font-family:var(--fd-serif); font-style:italic; font-size:19.5px; line-height:1.4; color:var(--ink)}
  .qcard .qtip{font-family:-apple-system, Roboto, system-ui, sans-serif; font-style:normal; font-size:12px; color:var(--ink2); margin-top:10px; line-height:1.5}
  .mini2{display:flex; gap:8px; margin-top:14px; align-items:flex-end; height:52px}
  .mcol{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%}
  .mcol b{width:100%; max-width:24px; border-radius:7px 7px 4px 4px; background:var(--raised); display:block; min-height:4px; transform-origin:bottom}
  .mcol .dl{font-size:9px; color:var(--ink3); font-weight:700; font-family:var(--fd-disp); letter-spacing:.06em}
  .wkrow{display:flex; gap:8px; margin-top:14px}
  .wkrow .wc{flex:1; max-width:42px; aspect-ratio:1; border-radius:11px; background:var(--raised);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; box-sizing:border-box;
    font-family:var(--fd-disp); font-size:9.5px; letter-spacing:.05em; color:var(--ink3); font-weight:600}
  .wkrow .wc .ck{font-size:13px; line-height:1; font-weight:700}
  .wkrow .wc.done{background:var(--grad-am); color:#191106}
  .wkrow .wc.plan{border:1.5px dashed var(--ink3); background:transparent}
  .wkrow .wc.today{outline:2px solid var(--wk); outline-offset:2px}
  @keyframes barup{from{transform:scaleY(0)}}
  .anim2 b{animation:barup .5s cubic-bezier(.22,1,.36,1) both}

  .btn{background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:11px 14px; font-weight:600; font-size:14.5px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:7px}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--grad-am); border-color:transparent; color:#191106; box-shadow:0 4px 16px #f2a03d33; font-family:var(--fd-disp); font-weight:600; text-transform:uppercase; letter-spacing:.07em}
  .btn.water{background:var(--wa); border-color:var(--wa); color:#0a1920}
  .btn.food{background:var(--fd); border-color:var(--fd); color:#101b0a}
  .btn.body{background:var(--bd); border-color:var(--bd); color:#170f22}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--bad); border-color:#e8695e55}
  .btn.wide{width:100%}
  .btn.sm{padding:7px 11px; min-height:36px; font-size:13px; border-radius:10px}
  .chip{background:var(--raised); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13.5px; font-weight:600; min-height:38px}
  .chip.on{background:var(--wk); border-color:var(--wk); color:#191106}
  /* section row: every sub-screen one tap from the top, instead of buried
     under the routine list */
  .subnav{position:sticky; top:0; z-index:40; display:flex; gap:7px; overflow-x:auto;
    background:var(--bg); padding:8px 0 10px; margin:-6px 0 10px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch}
  .subnav::-webkit-scrollbar{display:none}
  .subnav .chip{flex:0 0 auto; min-height:36px; padding:7px 13px; font-size:13px}
  /* BMI band scale spanning 15-32: under / normal / overweight / obese */
  .bmiscale{position:relative; height:12px; border-radius:99px; margin-bottom:5px;
    background:linear-gradient(90deg,
      var(--sl) 0%, var(--sl) 20.6%,
      var(--good) 20.6%, var(--good) 47.1%,
      var(--wk) 47.1%, var(--wk) 58.8%,
      var(--bad) 58.8%, var(--bad) 100%)}
  .bmiscale i{position:absolute; top:-4px; width:4px; height:20px; border-radius:2px;
    background:var(--ink); box-shadow:0 0 0 2px var(--bg); transform:translateX(-2px)}
  .bmiticks{display:flex; justify-content:space-between; font-size:10px; color:var(--ink3);
    font-variant-numeric:tabular-nums; margin-bottom:14px}

  /* bottom nav */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs .in{max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
  nav.tabs button{display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px 5px; color:var(--ink3); font-family:var(--fd-disp); font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; border-radius:10px}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button.on{color:var(--ink)}
  nav.tabs button.on .ic-today{color:var(--wk)}
  nav.tabs button.on .ic-wk{color:var(--wk)}
  nav.tabs button.on .ic-tm{color:var(--wk)}
  nav.tabs button.on .ic-fd{color:var(--fd)}
  nav.tabs button.on .ic-bd{color:var(--bd)}

  /* rings + bars */
  .ring{position:relative; width:118px; height:118px; flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .mid{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
  .bar{height:8px; background:var(--raised); border-radius:99px; overflow:hidden}
  .bar i{display:block; height:100%; border-radius:99px}

  /* set table */
  .sethead,.setrow{display:grid; grid-template-columns:38px 1fr 76px 64px 46px; gap:7px; align-items:center}
  /* lifting rows carry increment buttons so a set can be adjusted without the
     keyboard covering half the screen */
  .setrow.lift,.sethead.lift{grid-template-columns:30px 26px 1fr 26px 26px 54px 26px 42px; gap:4px}
  .setrow.lift input{padding:12px 2px}
  .stp{background:var(--raised); border:1px solid var(--line); border-radius:9px; color:var(--ink2);
    font-size:17px; font-weight:700; height:46px; min-height:0; padding:0; line-height:1}
  .stp:active{background:var(--wk); color:#191106}
  .sethead{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink3); margin:10px 0 6px}
  .setrow{margin-bottom:6px; padding:3px 0; border-radius:10px}
  .setrow input{padding:12px 8px; text-align:center; font-size:16px; font-weight:600}
  .setrow .prev{font-size:12.5px; color:var(--ink3); text-align:left}

let AC=null;
function beep(times){
  times = times||2;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    for(let i=0;i<times;i++){
      const o=AC.createOscillator(), g=AC.createGain();
      o.connect(g); g.connect(AC.destination);
      o.frequency.value=880; o.type='sine';
      const t0=AC.currentTime + i*0.28;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.4,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
      o.start(t0); o.stop(t0+0.24);
    }
  }catch(e){}
}

      if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){

function schemeFor(exId){

  if(g==='Power') return {sets:4, lo:3, hi:6};

function recentSleep(n){

function dayGap(a,b){
  return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
}
/* Rate of change, not raw difference between two readings that may be months
   apart: weigh-ins are sporadic, and 3 kg over ten weeks is not 3 kg in a week. */
function bwChange(days){
  const ws=(S.weights||[]).slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  if(ws.length<2) return null;
  const latest=ws[ws.length-1];
  if(daysSince(latest.date)>10) return null;        /* no current reading to judge from */
  let base=null;
  for(let i=ws.length-2;i>=0;i--){
    if(dayGap(ws[i].date, latest.date)>=days){ base=ws[i]; break; }
  }
  if(!base) base=ws[0];
  const span=dayGap(base.date, latest.date);
  if(span<3) return null;
  const delta=latest.kg-base.kg;
  return {from:base.kg, to:latest.kg, span:span,
    delta:Math.round(delta*10)/10,
    perWeek:Math.round(delta/span*7*10)/10};
}
function isBodyweightEx(exId){

function readiness(){
  const reasons=[]; let hold=false;
  const goal=+S.settings.sleepGoal||8;
  const sl=recentSleep(2);
  let avg=null;
  if(sl.length){
    avg=Math.round((sl.reduce(function(a,b){return a+b;},0)/sl.length)*10)/10;
    if(avg < goal-1.5){
      hold=true;
      reasons.push(avg+'h sleep'+(sl.length>1?' across two nights':' last night')+', short of your '+goal+'h');
    }
  }
  const bw=bwChange(7);
  if(bw && bw.perWeek<0 && bw.to>0 && Math.abs(bw.perWeek)/bw.to > 0.01){
    hold=true;
    reasons.push('losing '+Math.abs(bw.perWeek)+' '+unit()+' a week, fast enough that recovery is running behind');
  }
  return {hold:hold, reasons:reasons, sleepAvg:avg, bw:bw};

function prescribe(exId){
  const sc=schemeFor(exId), g=exGroupOf(exId), tmd=isTimedEx(exId);
  const hist=historyFor(exId,3);
  const mk=function(w,r,n){ const a=[]; for(let i=0;i<(n||sc.sets);i++) a.push({w:w,r:r}); return a; };

  const iv=exIv(exId);
  if(iv){
    const hr=hrTarget(iv.type);
    const prev=hist.length? hist[0].sets : null;
    const best=prev? Math.max.apply(null, prev.map(function(t){return +t.w||0;})) : 0;
    /* no age means no Tanaka estimate, so fall back to the talk test rather
       than printing a band computed from nothing */
    const band=hr? 'Aim for '+hr.lo+'-'+hr.hi+' bpm'
      : 'Hard enough that talking is down to a few words at a time; set your age in Settings for a heart-rate target.';
    /* Zone 2 is one continuous block, not rounds. Prescribing it as sets would
       invite you to break it up, and the unbroken duration is the stimulus. */
    if(iv.block){
      return {sets:mk('', '', 1),
        why: iv.mins+' min continuous, easy. '+band+
          (hr? ' — '+hr.note+'.' : '')+' '+iv.check+
          (iv.lever? ' '+iv.lever : '')+
          (best? ' Last time '+best+' km.' : ''),
        tag:'intervals', iv:iv};
    }
    const mins=Math.round(iv.work/60);
    /* reps used to be prescribed as "4", which is the same 4 every session and
       tells the next prescription nothing. The number that decides whether the
       session worked is the peak heart rate, so that column holds it instead. */
    return {sets:mk('', '', iv.rounds),
      why: iv.rounds+' × '+mins+' min hard, '+Math.round(iv.rest/60)+' min between. '+
        band+
        (hr? ' ('+hr.note+(iv.ramp? '; the full band is '+hr.full : '')+'). '+
             'Keep moving through the recovery at '+hr.recLo+'-'+hr.recHi+', do not stop. ' : ' ')+
        iv.check+
        (iv.lever? ' '+iv.lever : '')+
        (best? ' Best interval so far '+best+' km.' : ''),
      tag:'intervals', iv:iv};
  }
  /* Power gets its own branch or it falls through to the lifting default and
     tells you to pick a weight for a pogo hop. The rule it has to communicate
     is the one that makes power training work: stop on quality, not on failure. */
  if(g==='Power'){
    const prevBest=hist.length? Math.max.apply(null, hist[0].sets.map(function(t){return +t.w||0;})) : 0;
    return {sets:mk(prevBest||'', sc.hi),
      why: sc.sets+' × '+sc.lo+'-'+sc.hi+', full recovery between. Stop the set the moment a rep '+
        'gets slower or lands heavier — a tired jump trains the opposite of what a jump is for. '+
        (prevBest? 'Last time '+prevBest+' '+unit()+' or height.' : 'Log height, distance or load, whichever the movement has.'),
      tag:'power'};
  }
  if(g==='Cardio'){
    const cb=hist.length? hist[0].sets[0] : null;
    return {sets:mk(cb?cb.w:'', cb?cb.r:'', 1),
      why: cb? 'last time '+cb.w+' km in '+cb.r+' min, match it or beat the pace' : 'log distance and minutes',
      tag:'steady'};
  }
  if(!hist.length){
    return {sets:mk(tmd?'':'', sc.lo),
      why: tmd? 'first time: hold '+sc.lo+'s, stop before form goes'
              : 'first time: pick a weight you could do about '+sc.hi+' with two reps left in reserve',
      tag:'first'};
  }

  const last=hist[0], gap=daysSince(last.date), topW=topWeight(last.sets);

  /* three weeks away: the old numbers are a ceiling, not a starting point */
  if(gap>21){
    if(tmd){
      const b=Math.max.apply(null,last.sets.map(function(s){return +s.r||0;}));
      return {sets:mk('', Math.max(10,Math.round(b*0.6/5)*5)),
        why:gap+' days off, rebuild the hold at about 60%', tag:'comeback'};
    }
    return {sets:mk(topW? Math.max(incFor(exId), roundTo(topW*0.6, incFor(exId))) : '', sc.hi),
      why:gap+' days off, rebuild at about 60% and earn it back', tag:'comeback'};
  }

  if(tmd){
    const b=Math.max.apply(null,last.sets.map(function(s){return +s.r||0;}));
    const rdT=readiness();
    if(rdT.hold) return {sets:mk('', b), why:'match last time’s '+b+'s rather than pushing it: '+rdT.reasons[0], tag:'hold', readiness:rdT};
    if(last.sets.some(function(s){ return s.e==='hard'; }))
      return {sets:mk('', b), why:'last hold felt hard, so repeat '+b+'s clean before adding time', tag:'reps'};
    /* same doubling rule the weighted branch uses when every set felt easy */
    const easyT=last.sets.length>1 && last.sets.every(function(s){ return s.e==='easy'; });
    const step=easyT?10:5;
    const bwn=bwNote(exId,last.date);
    return {sets:mk('', b+step),
      why:(easyT? 'you called '+b+'s easy, so ten seconds longer' : 'five seconds longer than last time ('+b+'s)')+(bwn?', and '+bwn:''),
      tag:'progress'};
  }

  const reps=last.sets.map(function(s){ return +s.r||0; });
  const hardSet=last.sets.some(function(s){ return s.e==='hard'; });
  const allEasy=last.sets.length>1 && last.sets.every(function(s){ return s.e==='easy'; });
  const atTop=last.sets.filter(function(s){ return (+s.w||0)>=topW && (+s.r||0)>=sc.hi; }).length;
  const hitAll=atTop>=sc.sets && !hardSet;

  /* earned the increase: every prescribed set at the top of the range */
  if(hitAll){
    const inc=incFor(exId)*(allEasy?2:1);
    const rd=readiness();
    /* the increase was earned, but sleep or a sharp weight drop says today is
       not the day to take it. Hold, and say both halves out loud. */
    if(rd.hold){
      return {sets:mk(topW, sc.hi),
        why:'you earned +'+inc+' '+unit()+', but '+rd.reasons[0]+' — repeat '+topW+' '+unit()+' today and take it next session',
        tag:'hold', held:inc, readiness:rd};
    }
    return {sets:mk(roundTo(topW+inc, incFor(exId)), sc.lo),
      why:'you hit '+sc.sets+'×'+sc.hi+' at '+topW+' '+unit()+(allEasy?' and called it easy, so up '+inc:', so up '+inc)+' '+unit(),
      tag:'up'};
  }

  /* stalled: same weight for three sessions and the top of the range never came */
  const stuck=hist.length>=3 && hist.every(function(hh){
    return topWeight(hh.sets)===topW && !hh.sets.some(function(s){ return (+s.r||0)>=sc.hi; });
  });
  if(stuck && topW>0){
    return {sets:mk(Math.max(incFor(exId), roundTo(topW*0.9, incFor(exId))), sc.lo+2),
      why:'three sessions stuck at '+topW+' '+unit()+', back off 10% and build through it again',
      tag:'deload'};
  }

  /* otherwise hold the weight and chase reps, set by set */
  const out=[];
  for(let i=0;i<sc.sets;i++){
    const had=reps[i]||reps[reps.length-1]||sc.lo;
    out.push({w:topW||'', r:Math.min(sc.hi, had+1)});
  }
  const fell=reps.length>1 && reps[reps.length-1] < reps[0]*0.7;
  const bwn=bwNote(exId, last.date);
  return {sets:out,
    why:(hardSet ? 'last set felt hard, so hold '+topW+' '+unit()+' and repeat it clean'
       : fell ? 'reps dropped off badly last time, hold '+topW+' '+unit()+' until all '+sc.sets+' sets match'
       : 'hold '+topW+' '+unit()+', one more rep per set until you reach '+sc.sets+'×'+sc.hi)
       +(bwn? ' — '+bwn : ''),
    tag:'reps'};
}
/* One-line summary of the prescription, for cards and the exercise sheet.
   Same engine as the session screen, so guidance never disagrees with itself. */
function targetFor(exId){
  const rx=prescribe(exId);
  if(!rx || rx.tag==='first') return null;
  const s=rx.sets, g=exGroupOf(exId);
  if(g==='Cardio') return rx.why;
  const load=isTimedEx(exId)
    ? s.length+'×'+s[0].r+'s'
    : (s[0].w? s.length+'×'+s[0].w+'×'+s[0].r : s.length+'×'+s[0].r+' reps');
  return load+' — '+rx.why;
}
function warmupFor(exId){
  const pa=prevArr(exId); if(!pa) return null;
  const work=pa.filter(function(s){ return !s.wu && +s.w; });
  if(!work.length) return null;
  const w=Math.max.apply(null, work.map(function(s){return +s.w;}));
  if(w<30) return null;
  return 'warm-up: bar×10 · '+Math.max(20,round25(w*0.5))+'×5 · '+round25(w*0.75)+'×3';
}

const HR_RAMP=[

  {lo:0.80, hi:0.87, note:'still calibrating: one step harder than last time'},
  {lo:0.85, hi:0.90, note:'closing on the real zone now'},
  {lo:0.85, hi:0.90, note:'one more step before the full band'}

    lo=t.lo; hi=t.hi; note=t.label.toLowerCase()+' is a fixed band, not something to push';

function patternOf(n,g){
  if(PAT_EX[n]) return PAT_EX[n];
  n=n.toLowerCase();
  /* Power reads before everything else: a med-ball slam is a throw, not a
     press, and a pogo hop is a jump, not a squat. */
  if(/balance|tandem stance|single[- ]leg stand/.test(n)) return 'balance';
  if(/med[- ]?ball|slam|throw|chest pass/.test(n)) return 'throw';
  if(g==='Power') return 'jump';
  if(g==='Mobility'){
    if(/hang/.test(n)) return 'vpull';
    if(/plank/.test(n)) return 'core';
    if(/curl|hamstring|hip lift|90\/90/.test(n)) return 'hinge';
    if(/cars|circles|dislocate/.test(n)) return 'raise';
    return 'stretch';
  }
  if(g==='Cardio') return 'cardio';
  if(/leg extension|leg curl|calf/.test(n)) return null;
  if(/bench|push[- ]?up|fly|crossover|dip/.test(n)) return 'hpush';
  if(/split|bulgarian|lunge|step[- ]?up/.test(n)) return 'lunge';
  if(/squat|leg press|wall sit|wall ball|burpee|jump|climber|jack|knees|bear/.test(n)) return 'squat';
  if(/deadlift|swing|thrust|bridge/.test(n)) return 'hinge';
  if(/pulldown|pull[- ]?up|chin/.test(n)) return 'vpull';
  if(/row|face pull|reverse fly/.test(n)) return 'hpull';
  if(/carry/.test(n)) return 'carry';
  if(/plank|crunch|leg raise|sit[- ]?up/.test(n)) return 'core';
  if(/curl|pushdown|extension|skull/.test(n)) return 'curl';
  if(/raise/.test(n)) return 'raise';
  if(/press/.test(n)) return 'vpush';
  return null;
}

function missedSessions(days){
  const out=[];
  for(let i=1;i<=(days||3);i++){
    const d=dShift(today(),-i);
    if(activeBreak(d)) continue;
    if((S.skipped||[]).indexOf(d)>-1) continue;
    const id=(S.plan||{})[new Date(d+'T12:00:00').getDay()];
    if(!id) continue;
    if(S.sessions.some(function(s){ return s.date===d; })) continue;
    const rt=S.routines.find(function(r){ return r.id===id; });
    if(rt) out.push({date:d, routine:rt, ago:i});

/* Bedtimes cross midnight, so shift the small hours forward before averaging. */

    const pid=(S.plan||{})[new Date(d+'T12:00:00').getDay()];
    if(pid){ adh.planned++; if(S.sessions.some(function(s){return s.date===d;})) adh.done++; }
  }
  S.sessions.forEach(function(s){
    if(s.date<ws||s.date>we) return;
    s.ex.forEach(function(e){
      const g=exGroupOf(e.exId);
      if(g==='Mobility') return;
      gsets[g]=(gsets[g]||0)+e.sets.filter(function(t){return !t.wu;}).length;
    });
  });
  const gtxt=Object.keys(gsets).sort(function(a,b){return gsets[b]-gsets[a];})
    .map(function(g){return g+' '+gsets[g];}).join(' · ');
  function row(l,v,d){ return '<div class="listrow"><span class="small">'+l+'</span><span class="small num" style="text-align:right">'+v+(d?'<div class="tiny">'+d+'</div>':'')+'</span></div>'; }
  function sect(t){ return '<div class="tiny muted" style="margin:14px 0 2px; font-weight:700; letter-spacing:.07em; text-transform:uppercase">'+t+'</div>'; }
  let h='<h3 style="margin-bottom:4px">Weekly report</h3>'+
    '<div class="datebar" style="margin-bottom:4px"><button class="btn sm" onclick="openReport(\''+dShift(ws,-7)+'\')">‹</button>'+
    '<b class="num">'+fmtD(ws)+' – '+fmtD(dShift(ws,6))+(ws===curWk?' (this week)':'')+'</b>'+
    '<button class="btn sm" onclick="openReport(\''+dShift(ws,7)+'\')" '+(ws>=curWk?'disabled style="opacity:.35"':'')+'>›</button></div>';
  h+=sect('The five')+pillarRows(ws)+
    '<div class="tiny muted" style="margin-top:6px; line-height:1.55">A filled dot is a quality this week actually contained. An empty one is not a failure, it is the next thing to schedule.</div>';
  h+=sect('Training')+
    row('Workouts', cur.ses, dif(cur.ses,prv.ses,''))+
    (adh.planned? row('Plan adherence', adh.done+' / '+adh.planned,'') : '')+
    (adh.brk? row('Planned break days', adh.brk,'') : '')+
    row('Volume', Math.round(cur.vol).toLocaleString()+' '+unit(), dif(Math.round(cur.vol),Math.round(prv.vol),''))+
    row('Time training', Math.round(cur.dur/60)+' min','')+
    row('New PRs', cur.pr,'')+
    (gtxt? '<div class="tiny muted num" style="padding:8px 2px">Working sets: '+gtxt+'</div>' : '');
  const rv=lastVo2(), rz=zone2Mins(7);
  h+=sect('Cardio & breathwork')+
    row('Distance', cur.km+' km', dif(cur.km,prv.km,' km'))+
    row('Zone 2', rz+' min', rz>=150?'target met':'of 150-300')+
    (rv? row('VO2max', rv.val+'', esc(rv.method)+', '+fmtD(rv.date)) : '')+
    /* total, not an average over practised days — an average makes one long
       session look better than a consistent week and flips the delta arrow */
    row('Breathwork', cur.breath+' min', dif(cur.breath,prv.breath,' min'))+
    row('Days practised', cur.brDays+' / 7','')+
    row('Goal days', cur.brHit+' / 7','');
  const rr=sleepRegularity(14);
  h+=sect('Sleep')+
    (rr? row('Regularity', rr.score+' / 100','bed \u00b1'+rr.sdBed+'m, wake \u00b1'+rr.sdWake+'m') : '')+
    row('Average', cur.slN? cur.sleep+' h':'-', dif(cur.sleep,prv.sleep,' h'))+
    row('Nights logged', cur.slN+' / 7','');
  h+=sect('Nutrition & water')+
    row('Avg calories', cur.fdN? cur.kcal+' kcal':'-', dif(cur.kcal,prv.kcal,''))+
    row('Avg protein', cur.fdN? cur.prot+' g':'-', dif(cur.prot,prv.prot,' g'))+
    row('Avg fiber', cur.fdN? cur.fiber+' g':'-', dif(cur.fiber,prv.fiber,' g'))+
    row('Water goal days', cur.waHit+' / 7','')+
    row('Avg water', cur.water? Math.round(cur.water/100)/10+' L':'-','');
  h+=sect('Body')+
    row('Weight', cur.wLast? cur.wLast+' '+unit():'-',
        cur.wDelta!==null? '<span class="muted">'+(cur.wDelta>0?'+':'')+cur.wDelta+' '+unit()+' within week</span>':'');
  const notes=coachNotes(cur,prv,adh);
  if(notes.length){
    h+=sect('Coach’s notes');
    notes.forEach(function(x){ h+='<p class="small" style="margin:6px 0; color:var(--ink2)">· '+x+'</p>'; });
  }
  h+='<button class="btn primary wide" style="margin-top:14px" onclick="shareWeek(\''+ws+'\')">Share this week</button>';
  h+='<p class="tiny muted" style="margin-top:12px">Deltas compare with the previous week. Green = moving the right way for your goals.</p>';
  openSheet(h);
}

function shareWeek(ws){
  const cur=weekStats(ws), we=dShift(ws,6);
  const trained=[];
  for(let i=0;i<7;i++){ const d=dShift(ws,i); trained.push(S.sessions.some(function(s){return s.date===d;})); }
  const ready = (document.fonts && document.fonts.load)
    ? Promise.all([document.fonts.load('700 90px Oswald'), document.fonts.load('500 40px Oswald'), document.fonts.load('italic 46px "Instrument Serif"')])
    : Promise.resolve();
  ready.then(function(){
    const cv=document.createElement('canvas'); cv.width=1080; cv.height=1350;
    const x=cv.getContext('2d');
    x.fillStyle='#0e1214'; x.fillRect(0,0,1080,1350);
    const g=x.createLinearGradient(0,0,1080,0); g.addColorStop(0,'#ffc76e'); g.addColorStop(1,'#f08a2b');
    x.fillStyle=g; x.fillRect(0,0,1080,14);
    x.fillStyle='#f2a03d'; x.font='700 58px Oswald'; x.textAlign='left';
    x.fillText('COACHZ', 72, 128);
    x.fillStyle='#93a6b0'; x.font='italic 42px "Instrument Serif"';
    x.fillText('Week of '+fmtD(ws)+' – '+fmtD(we), 72, 190);
    const stats=[[String(cur.ses),'WORKOUTS'],[Math.round(cur.vol).toLocaleString(),'KG LIFTED'],[String(cur.pr),'RECORDS']];
    stats.forEach(function(st2,i){
      const cx=72+i*330;
      x.fillStyle='#edf2f4'; x.font='700 108px Oswald'; x.fillText(st2[0], cx, 400);
      x.fillStyle='#5c6d76'; x.font='500 30px Oswald'; x.fillText(st2[1], cx, 448);
    });
    const L=['M','T','W','T','F','S','S'];
    for(let i=0;i<7;i++){
      const bx=72+i*136;
      x.fillStyle = trained[i] ? '#f2a03d' : '#1f282e';
      if(x.roundRect){ x.beginPath(); x.roundRect(bx,520,112,112,26); x.fill(); }
      else x.fillRect(bx,520,112,112);
      x.fillStyle = trained[i] ? '#191106' : '#5c6d76';
      x.font='700 44px Oswald'; x.textAlign='center';
      x.fillText(trained[i]?'✓':L[i], bx+56, trained[i]?592:588);
      x.fillStyle='#5c6d76'; x.font='500 24px Oswald';
      x.fillText(L[i], bx+56, 676);
      x.textAlign='left';
    }
    x.fillStyle='#93a6b0'; x.font='500 38px Oswald';
    const bits=[];
    if(cur.slN) bits.push('SLEEP '+cur.sleep+'H AVG');
    if(cur.brDays) bits.push('BREATHWORK ×'+cur.brDays);
    if(cur.waHit) bits.push('WATER GOAL ×'+cur.waHit);
    if(cur.km) bits.push(cur.km+' KM');
    x.fillText(bits.join('   ·   ')||'THE WORK CONTINUES', 72, 790);
    const q='“'+QUOTES[dayIdx()%QUOTES.length]+'”';
    x.fillStyle='#edf2f4'; x.font='italic 52px "Instrument Serif"';
    const words=q.split(' '); let line='', y=980;
    words.forEach(function(w2){
      if(x.measureText(line+w2).width>930){ x.fillText(line, 72, y); y+=68; line=''; }
      line+=w2+' ';
    });
    x.fillText(line.trim(), 72, y);
    x.fillStyle='#5c6d76'; x.font='500 28px Oswald';
    x.fillText('TRACKED ON COACHZ', 72, 1270);
    cv.toBlob(function(blob){
      const file=new File([blob], 'coachz-week.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:'My CoachZ week'}).catch(function(){});
      } else {
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob); a.download='coachz-week.png';
        document.body.appendChild(a); a.click(); a.remove();
        toast('Week card downloaded');
      }
    }, 'image/png');
  });
}

function ring(pct,color,size,text,sub){

    '<svg width="'+size+'" height="'+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--raised)" stroke-width="10"/>'+
    '<circle class="rp" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" data-off="'+off+'"/>'+
    '</svg><div class="mid"><div class="big num" style="font-size:24px">'+text+'</div><div class="tiny muted">'+sub+'</div></div></div>';
}

function lineChartSVG(data,color){ /* data=[{d:iso,y:num}] chronological */
  const W=372,H=118,PL=36,PR=12,PT=12,PB=18;
  const ys=data.map(function(p){return p.y;});
  let mn=Math.min.apply(null,ys), mx=Math.max.apply(null,ys);
  const span=(mx-mn)||1; mn-=span*0.15; mx+=span*0.15;
  const X=function(i){ return PL+(W-PL-PR)*(data.length===1?0.5:i/(data.length-1)); };
  const Y=function(v){ return PT+(H-PT-PB)*(1-(v-mn)/(mx-mn)); };
  const pts=data.map(function(p,i){ return X(i)+','+Y(p.y); }).join(' ');
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto">';
  [0.3,0.7].forEach(function(f){
    const y=PT+(H-PT-PB)*f, v=Math.round(mx-(mx-mn)*f);
    s+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'+
       '<text x="'+(PL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+v+'</text>';
  });
  s+='<polygon points="'+X(0)+','+(H-PB)+' '+pts+' '+X(data.length-1)+','+(H-PB)+'" fill="'+color+'" opacity="0.12"/>';
  s+='<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  s+='<circle cx="'+X(data.length-1)+'" cy="'+Y(data[data.length-1].y)+'" r="4.5" fill="'+color+'" stroke="var(--surface)" stroke-width="2"/>';
  s+='<text x="'+PL+'" y="'+(H-4)+'" font-size="10" fill="var(--ink3)">'+fmtD(data[0].d)+'</text>';
  s+='<text x="'+(W-PR)+'" y="'+(H-4)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+fmtD(data[data.length-1].d)+'</text>';
  return s+'</svg>';
}
function barChartSVG(items,color){ /* items=[{l:label,y:num}] */
  const W=372,H=132,PB=20,PT=16;
  const mx=Math.max.apply(null,items.map(function(i){return i.y;}))||1;
  const n=items.length, gap=6, bw=(W-12)/n-gap;
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto">';
  items.forEach(function(it,i){
    const bh=Math.max(2,(H-PT-PB)*it.y/mx), x=6+i*(bw+gap), y=H-PB-bh;
    const last=i===n-1;
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+color+'" opacity="'+(last?1:0.55)+'"/>';
    if(last||it.y===mx) s+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="10" fill="var(--ink2)">'+(it.y>=1000? Math.round(it.y/100)/10+'k' : Math.round(it.y))+'</text>';
  });
  s+='<line x1="4" y1="'+(H-PB)+'" x2="'+(W-4)+'" y2="'+(H-PB)+'" stroke="var(--line)" stroke-width="1.5"/>';
  s+='<text x="6" y="'+(H-5)+'" font-size="10" fill="var(--ink3)">'+items[0].l+'</text>';
  s+='<text x="'+(W-6)+'" y="'+(H-5)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+items[n-1].l+'</text>';
  return s+'</svg>';
}

let WV='home'; /* home | session | library | history | routine */
let editRoutineId=null;
function exName(id){ const e=S.exercises.find(function(x){return x.id===id;}); return e?e.name:'(deleted)'; }
function exGroupOf(id){ const e=S.exercises.find(function(x){return x.id===id;}); return e?e.group:''; }
function isTimedEx(id){
  const e=S.exercises.find(function(x){return x.id===id;});
  if(!e) return false;
  return e.group==='Mobility' || e.timed===true || e.name==='Plank';
}
/* timed PRs: planks/hangs count, plain stretches don't — a longer calf
   stretch is not a record */
function isPRTimed(id){
  const e=S.exercises.find(function(x){return x.id===id;});
  if(!e || !isTimedEx(id)) return false;
  return e.group!=='Mobility' || e.name==='Dead hang';
}
function holdBest(exId){
  let best=0;
  S.sessions.forEach(function(ss){
    if(ss.id===editingId()) return;
    ss.ex.forEach(function(e){
      if(e.exId!==exId) return;
      e.sets.forEach(function(t){ if(!t.wu && (+t.r||0)>best) best=+t.r; });
    });
  });
  return best;
}
function fmtSet(s, grp, timed, iv){
  /* on an interval machine the second column is peak heart rate, not minutes:
     "140min" read as a forty-minute interval, which is nonsense */
  if(iv) return (s.w? s.w+'km/' : '')+(s.r? s.r+'bpm' : '-');
  if(grp==='Cardio') return s.w+'km/'+s.r+'min'+(s.z?' Z2':'');
  if(timed) return ((+s.w)? s.w+'kg · ':'')+(s.r||0)+'s';
  return s.w+'×'+s.r;
}
function prevArr(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    if(S.sessions[i].id===editingId()) continue;
    const ex=S.sessions[i].ex.find(function(e){ return e.exId===exId; });
    if(ex && ex.sets.length) return ex.sets;
  }
  return null;
}
function prevSets(exId){
  const grp=exGroupOf(exId), tmd=isTimedEx(exId), pa=prevArr(exId), iv=!!exIv(exId);
  return pa ? pa.map(function(s){ return fmtSet(s,grp,tmd,iv); }).join('  ') : '';
}
function cardioBest(exId){
  let km=0, pace=null;
  S.sessions.forEach(function(s){ s.ex.forEach(function(e){
    if(e.exId!==exId) return;
    e.sets.forEach(function(t){
      const d=+t.w||0, m=+t.r||0;
      if(d>km) km=d;
      if(d>=0.4 && m>0){ const p=m/d; if(pace===null||p<pace) pace=p; }
    });
  });});
  if(!km) return null;
  let ptxt='-';
  if(pace!==null){ const pm=Math.floor(pace); ptxt=pm+':'+pad(Math.round((pace-pm)*60)); }
  return {km:km, pace:ptxt};
}
function bestFor(exId){
  let best=null;
  S.sessions.forEach(function(s){ s.ex.forEach(function(e){
    if(e.exId!==exId) return;
    e.sets.forEach(function(t){
      if(t.wu) return;
      const est=est1RM(t.w,t.r);
      if(!best || est>best.est) best={w:+t.w||0, r:+t.r||0, est:est, date:s.date};
    });
  });});
  return best;
}
/* ---- what a routine actually costs you, so a card can say something ---- */
function routineStats(exIds){
  const groups=[]; let sets=0, secs=0, ready=0;
  (exIds||[]).forEach(function(id){
    const g=exGroupOf(id); if(g && groups.indexOf(g)<0) groups.push(g);
    const n=schemeFor(id).sets; sets+=n;   /* what the coach prescribes, not what got logged */
    /* Mobility flows straight through with no rest (toggleSet doesn't start a
       rest timer for it either), so charging it 90s a set made a 15-minute
       rehab block read as 47 */
    const ivS=exIv(id);
    if(ivS) secs += ivS.rounds*(ivS.work+ivS.rest);
    else if(g==='Cardio') secs += n*600;
    else secs += n*((isTimedEx(id)?45:40) + exRest(id));
    if(prescribe(id).tag==='up') ready++;   /* only an earned load increase counts */
  });
  return {groups:groups, sets:sets, mins:Math.max(1,Math.round(secs/60)), ready:ready};
}
/* Match by name first, then by what was actually trained: a routine renamed or
   started empty still counts as having been done. */
function lastDoneOf(name, exIds){
  for(let i=S.sessions.length-1;i>=0;i--) if(S.sessions[i].name===name) return S.sessions[i];
  if(!exIds || !exIds.length) return null;
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    const shared=s.ex.filter(function(e){ return exIds.indexOf(e.exId)>-1; }).length;
    if(shared >= Math.ceil(exIds.length*0.6)) return s;
  }
  return null;
}
function agoTxt(iso){
  if(!iso) return null;
  const d=Math.round((new Date(today()+'T12:00:00')-new Date(iso+'T12:00:00'))/86400000);
  return d<=0? 'today' : d===1? 'yesterday' : d+'d ago';
}
function exThumb(exId){
  const nm=exName(exId), im=(window.EXIMG||{})[nm];
  const initial=esc(nm.replace(/[^A-Za-z]/g,'').slice(0,1).toUpperCase()||'?');
  if(im) return '<span class="exthumb"><img src="img/ex/'+esc(im)+'_0.jpg" alt="" loading="lazy" onerror="thumbFail(this,\''+initial+'\')"></span>';
  /* no photo: the movement's own drawing beats a grey letter */
  const pat=patternOf(nm, exGroupOf(exId));
  if(pat && PATTERNS[pat]) return '<span class="exthumb fig">'+patternThumb(pat)+'</span>';
  return '<span class="exthumb ph">'+initial+'</span>';
}
function thumbFail(img, initial){ const p=img.parentNode; p.className='exthumb ph'; p.textContent=initial; }
function thumbRow(exIds, max){

  if(!kg||!age||!minutes||!hr) return null;

    if(s.date<=from) return;
    s.ex.forEach(function(e){
      const g=exGroupOf(e.exId);
      if(!g||g==='Cardio'||g==='Mobility') return;
      const n=e.sets.filter(function(t){ return !t.wu && (t.done||t.w||t.r); }).length;
      if(!n) return;
      byGroup[g]=byGroup[g]||{sets:0, days:{}};
      byGroup[g].sets+=n;
      byGroup[g].days[s.date]=true;
    });
  });
  return Object.keys(byGroup).map(function(g){
    return {group:g, sets:byGroup[g].sets, freq:Object.keys(byGroup[g].days).length};
  }).sort(function(a,b){ return b.sets-a.sets; });
}

function finishSession(){

     before anything counts it as volume, a PR, or next time's baseline */

  a.ex=a.ex.filter(function(e){ return e.sets.some(function(s){ return s.done||s.w||s.r; }); });

    /* nothing measurable, but never silently destroy: an edit keeps its
       original, and a fresh session goes to Recently deleted */
    if(a.editing){ S.active=null; save(); WV='home'; renderWorkout(); toast('Edit discarded, workout unchanged'); return; }
    if(rawEx.length) binSession({id:a.id, name:a.name, date:a.date, dur:0, vol:0, ex:rawEx, prs:[]});
    toast('Nothing logged'+(rawEx.length?', moved to Recently deleted':''));

  }
  let vol=0, nSets=0;
  const prs=[];

    e.sets=e.sets.filter(function(s){return s.w||s.r;});
    const g=exGroupOf(e.exId), tmd=isTimedEx(e.exId), lift=(g!=='Cardio'&&g!=='Mobility'&&!tmd);

      const pe=s.ex.find(function(x){return x.exId===e.exId;}); if(!pe) return;
      pe.sets.forEach(function(t){ if(t.wu) return;
        const w=+t.w||0, est=est1RM(t.w,t.r);
        if(w>bw) bw=w; if(est>b1) b1=est; });
    });
    if(tmd && isPRTimed(e.exId)) bh=holdBest(e.exId);
    let exPR=null;
    e.sets.forEach(function(s){
      nSets++;
      /* Power is excluded alongside Cardio: its weight column holds a jump
         height or a throw distance, so counting it as tonnage adds "240 kg"
         to the week for four box jumps. Neither group has tonnage to report. */
      if(g==='Cardio'||g==='Power'||s.wu) return;
      const w=+s.w||0, r=+s.r||0, est=est1RM(w,r);
      vol+=w*r;
      if(tmd){
        if(bh>0 && r>bh){ exPR={ex:exName(e.exId), txt:r+'s: longest hold'}; bh=r; }
        return;
      }
      if(!lift) return;
      if(bw>0 && w>bw){ exPR={ex:exName(e.exId), txt:w+'×'+r+': heaviest ever'}; bw=w; }
      else if(b1>0 && est>b1 && !exPR){ exPR={ex:exName(e.exId), txt:w+'×'+r+': est 1RM '+Math.round(est)+' '+unit()}; b1=est; }
    });
    if(exPR) prs.push(exPR);
  });
  const dur=Math.round((Date.now()-a.start)/1000);
  const sess={id:a.id, name:a.name, date:a.date, dur:dur, vol:vol, ex:a.ex, prs:prs};
  if(a.note) sess.note=a.note;
  const at=a.editing ? S.sessions.findIndex(function(s){return s.id===a.editing;}) : -1;
  if(at>-1){ sess.dur=S.sessions[at].dur||dur; S.sessions[at]=sess; } /* replace in place, keep the logged duration */
  else S.sessions.push(sess);
  S.sessions.sort(function(x,y){ return x.date<y.date?-1:1; });
  S.active=null; save(); WV='home'; renderWorkout();
  const total=S.sessions.length;
  if(total%10===0) setTimeout(function(){ toast('🏅 Workout #'+total+' all-time: consistency compounds'); }, 600);
  const showSummary=function(){ openSheet(summaryHTML); };
  const summaryHTML='<h3>Workout complete 💪</h3>'+
    '<div class="row" style="gap:18px; margin-bottom:8px">'+
    '<div><div class="big num" style="font-size:24px">'+Math.round(dur/60)+'m</div><div class="tiny muted">duration</div></div>'+
    '<div><div class="big num" style="font-size:24px">'+Math.round(vol).toLocaleString()+'</div><div class="tiny muted">'+unit()+' volume</div></div>'+
    '<div><div class="big num" style="font-size:24px">'+nSets+'</div><div class="tiny muted">sets</div></div>'+
    '<div><div class="big num" style="font-size:24px">'+(prs.length||'-')+'</div><div class="tiny muted">PRs</div></div></div>'+
    (prs.length
      ? prs.map(function(p){ return '<div class="listrow"><span class="small">🏆 '+esc(p.ex)+'</span><span class="small num muted">'+p.txt+'</span></div>'; }).join('')
      : '<p class="small muted">No records today. Showing up is the base of every PR.</p>')+
    '<div class="field" style="margin-top:14px"><label for="sesNote">Note (optional)</label>'+
    '<textarea id="sesNote" rows="2" placeholder="'+(PUB?'How did it feel?':'How did it feel? Knee/wrist okay?')+'"></textarea></div>'+
    '<button class="btn primary wide" onclick="saveSesNote(\''+sess.id+'\')">Done</button>';
  if(prs.length) prCelebrate(prs, showSummary); else showSummary();
}
function prCelebrate(prs, done){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ done(); return; }
  let el=$('#celebrate');
  if(!el){ el=document.createElement('div'); el.id='celebrate'; document.body.appendChild(el); }
  let dots='';
  for(let i=0;i<46;i++){
    const l=Math.random()*100, dl=Math.random()*0.7, sz=6+Math.random()*9, dur=1.4+Math.random()*1.0;
    const c=['#ffc76e','#f2a03d','#f08a2b','#4fc98a'][i%4];
    dots+='<i style="left:'+l+'%; width:'+sz+'px; height:'+sz+'px; background:'+c+'; animation-delay:'+dl+'s; animation-duration:'+dur+'s"></i>';
  }
  el.innerHTML=dots+'<div class="cin">'+
    '<div class="tclock" style="font-size:120px; margin:0; color:var(--wk)">PR</div>'+
    '<div class="serifacc" style="font-size:23px; color:var(--ink)">'+(prs.length>1? prs.length+' records today':'New record')+'</div>'+
    '<div class="tiny muted" style="margin-top:8px">'+esc(prs.map(function(p){return p.ex;}).join(' · '))+'</div></div>';
  el.classList.add('on');
  beep(4); vib([80,40,80,40,240]);
  setTimeout(function(){ el.classList.remove('on'); done(); }, 2300);
}

function cancelSession(){
  const a=S.active; if(!a) return;
  /* an edit and a new workout are different things — say which one is at stake */
  if(a.editing){
    if(!confirm('Discard your edits? The logged workout stays in history.')) return;
    S.active=null; save(); WV='home'; renderWorkout(); toast('Edits discarded, workout unchanged'); return;
  }
  const logged=a.ex.some(function(e){ return e.sets.some(function(s){ return s.done||s.w||s.r; }); });
  if(!confirm(logged? 'Discard this workout? It moves to Recently deleted.' : 'Discard this workout?')) return;
  if(logged) binSession({id:a.id, name:a.name, date:a.date, dur:Math.round((Date.now()-a.start)/1000), vol:0, ex:a.ex, prs:[]});
  S.active=null; save(); WV='home'; renderWorkout();
  if(logged) toastUndo('Workout discarded', function(){ restoreSession(a.id); });
}

/* ---- Recently deleted: nothing leaves the app without a way back ---- */
const TRASH_MAX=20;
function binSession(sess){
  if(!sess) return;
  S.trash=S.trash||[];
  S.trash.push(Object.assign({}, sess, {deletedAt:Date.now()}));
  if(S.trash.length>TRASH_MAX) S.trash=S.trash.slice(-TRASH_MAX);
  save();
}
function restoreSession(id){
  const i=(S.trash||[]).findIndex(function(s){return s.id===id;});
  if(i<0) return;
  const s=S.trash.splice(i,1)[0];
  delete s.deletedAt;
  if(!S.sessions.some(function(x){return x.id===s.id;})){
    S.sessions.push(s);
    S.sessions.sort(function(x,y){ return x.date<y.date?-1:1; });
  }
  save(); renderWorkout(); toast('Restored '+s.name);
}
function purgeSession(id){
  if(!confirm('Delete permanently? This cannot be undone.')) return;
  S.trash=(S.trash||[]).filter(function(s){return s.id!==id;}); save(); trashSheet();
}
function trashSheet(){
  const t=(S.trash||[]).slice().reverse();
  openSheet('<h3>Recently deleted</h3>'+
    '<p class="tiny muted" style="margin:-6px 0 12px">The last '+TRASH_MAX+' deleted or discarded workouts are kept here so nothing is lost by accident.</p>'+
    (t.length ? t.map(function(s){
      return '<div class="listrow"><div><b class="small">'+esc(s.name)+'</b>'+
        '<div class="tiny muted">'+fmtD(s.date)+' · '+(s.ex||[]).length+' exercises · deleted '+fmtD(isoOf(s.deletedAt))+'</div></div>'+
        '<div class="row"><button class="btn sm primary" onclick="restoreSession(\''+s.id+'\')">Restore</button>'+
        '<button class="btn ghost sm danger" onclick="purgeSession(\''+s.id+'\')">✕</button></div></div>';
    }).join('') : '<div class="empty">Nothing deleted recently.</div>'));
}
function isoOf(ms){ const d=new Date(ms||Date.now());
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function delSession(id){
  if(!confirm('Delete this workout? It moves to Recently deleted.')) return;
  const s=S.sessions.find(function(x){return x.id===id;});
  binSession(s);
  S.sessions=S.sessions.filter(function(x){return x.id!==id;}); save(); renderWorkout();
  toastUndo('Workout deleted', function(){ restoreSession(id); });
}
function editSession(id){
  if(S.active){ toast('Finish or discard the current session first'); return; }
  const s=S.sessions.find(function(x){return x.id===id;});
  if(!s) return;
  /* the session STAYS in history while it is edited. Finishing replaces it in
     place; discarding just drops the edit. Editing must never be able to
     destroy a logged workout. */
  S.active={id:s.id, name:s.name, date:s.date, start:Date.now()-(s.dur||0)*1000,
    ex:JSON.parse(JSON.stringify(s.ex)), note:s.note, editing:id};
  save(); WV='session'; go('workout');
  toast('Editing '+s.name+'. Fix the sets, then press Finish');
}

      : '<div class="empty">No logs yet.</div>';
  } else if(isTimedEx(exId)){
    let bh=null;
    S.sessions.forEach(function(s){ s.ex.forEach(function(e){

      e.sets.forEach(function(t){
        if(t.wu) return;

  } else {
    let bw=null, b1=null, bv=0;
    S.sessions.forEach(function(s){ s.ex.forEach(function(e){
      if(e.exId!==exId) return;
      let sv=0;
      e.sets.forEach(function(t){
        if(t.wu) return;
        const w=+t.w||0, r=+t.r||0, est=est1RM(w,r); sv+=w*r;
        if(!bw||w>bw.w) bw={w:w, r:r, date:s.date};
        if(!b1||est>b1.est) b1={w:w, r:r, est:est, date:s.date};
      });

        '<div class="listrow"><span class="small">Best est 1RM</span><span class="small num"><b>'+Math.round(b1.est)+' '+unit()+'</b> <span class="muted">('+b1.w+'×'+b1.r+')</span></span></div>'+
        '<div class="listrow"><span class="small">Best session volume</span><span class="small num"><b>'+Math.round(bv).toLocaleString()+'</b> '+unit()+'</span></div>'
      : '<div class="empty">No logs yet. Records appear after your first sets.</div>';

  /* strength / hold trend */
  if(g!=='Cardio'){

  const rec=[];
  for(let i=S.sessions.length-1; i>=0 && rec.length<5; i--){
    const s=S.sessions[i], e=s.ex.find(function(x){return x.exId===exId;});

function plates(){
  const target=+$('#plW').value, bar=+$('#plBar').value;
  const out=$('#plOut');
  if(!target){ out.textContent='Enter a target weight first.'; return; }
  if(target<bar){ out.textContent='Target is lighter than the bar.'; return; }
  const AVAIL=[25,20,15,10,5,2.5,1.25];
  let side=(target-bar)/2, picked=[];
  AVAIL.forEach(function(p){ while(side>=p-0.001){ picked.push(p); side-=p; } });
  const loaded=target-side*2;
  out.innerHTML = picked.length
    ? '<b>Per side:</b> '+picked.join(' + ')+' kg'+
      (side>0.001? '<div class="tiny muted" style="margin-top:4px">Closest loadable: '+loaded+' kg (off by '+Math.round(side*2*100)/100+')</div>':'')
    : '<b>Empty bar</b>: '+bar+' kg total.';
}

function delRoutine(id){ if(!confirm('Delete routine?')) return;
  S.routines=S.routines.filter(function(r){return r.id!==id;});
  /* the weekly plan kept pointing at it, so that day silently became a rest day */
  const days=[];
  Object.keys(S.plan||{}).forEach(function(k){ if(S.plan[k]===id){ S.plan[k]=''; days.push(k); } });
  save(); WV='home'; renderWorkout();
  if(days.length) toast(days.length+' plan day'+(days.length>1?'s':'')+' now open, set them in Plan');
}

/* ============ REST TIMER ============ */
let restEnd=0, restTotal=0, restInt=null, restLastS=-1;
const REST_PRESETS=[30,60,90,120,180,300];
function drawRestPresets(){
  $('#restPresets').innerHTML = REST_PRESETS.map(function(s){
    return '<button onclick="startRest('+s+')">'+fmtRest(s)+'</button>';
  }).join('');
}
function timerView(v){
  document.querySelectorAll('.tpanel').forEach(function(p){ p.classList.toggle('on', p.id==='tp-'+v); });
  document.querySelectorAll('[data-tv]').forEach(function(b){ b.classList.toggle('on', b.dataset.tv===v); });
}
function startRest(sec){
  sec=+sec||90; restTotal=sec; restEnd=Date.now()+sec*1000; restLastS=-1;
  $('#rest').classList.add('on');
  clearInterval(restInt); restInt=setInterval(restTick,150); restTick();
}
function restFromCustom(){ const v=+$('#restCustom').value; if(v>0) startRest(v); }
function restAdd(d){ restEnd+=d*1000; restTotal=Math.max(restTotal+d,1); restTick(); }
function restTick(){
  const left=Math.max(0, restEnd-Date.now());
  const s=Math.ceil(left/1000);
  $('#restClock').textContent = Math.floor(s/60)+':'+pad(s%60);
  $('#restBar').style.width = (restTotal? (left/1000)/restTotal*100 :0)+'%';
  if(s!==restLastS){
    restLastS=s;
    if(s<=5 && s>0){ vib(140); $('#restClock').style.color='var(--wk)'; }
    else $('#restClock').style.color='';
  }
  if(left<=0){
    clearInterval(restInt); restInt=null;
    beep(3); vib([300,100,300]); notify('Rest over','Next set!');
    setTimeout(function(){ $('#rest').classList.remove('on'); }, 1200);
  }
}
function restSkip(){ clearInterval(restInt); restInt=null; $('#rest').classList.remove('on'); }

/* ============ HOLD TIMER (timed exercises: plank, hangs, stretches) ============ */
let holdInt=null, holdT0=0, holdTarget=0, holdEi=-1, holdSi=-1, holdLastS=-1;
function holdStart(ei,si){
  const a=S.active; if(!a) return;
  const e=a.ex[ei]; if(!e) return;
  const st=e.sets[si]; if(!st) return;
  holdEi=ei; holdSi=si; holdTarget=Math.max(0, Math.round(+st.r||0));
  holdT0=Date.now(); holdLastS=-1;
  $('#holdLbl').textContent = exName(e.exId)+(holdTarget? ': hold '+holdTarget+'s' : ': max hold');
  $('#holdMain').textContent = holdTarget? 'Done early' : 'Stop & save';
  $('#holdClock').style.color='';
  $('#hold').classList.add('on');
  clearInterval(holdInt); holdInt=setInterval(holdTick,150); holdTick();
}
function holdTick(){
  const el=(Date.now()-holdT0)/1000;
  if(holdTarget){
    /* countdown to the entered seconds — same language as the rest timer */
    const left=Math.max(0, holdTarget-el), s=Math.ceil(left);
    $('#holdClock').textContent = Math.floor(s/60)+':'+pad(s%60);
    $('#holdBar').style.width = (left/holdTarget*100)+'%';
    if(s!==holdLastS){
      holdLastS=s;
      if(s<=5 && s>0){ vib(140); $('#holdClock').style.color='var(--wk)'; }
      else $('#holdClock').style.color='';
    }
    if(left<=0){ beep(3); vib([300,100,300]); holdFinish(holdTarget); }
  } else {
    /* count-up stopwatch for max holds — gentle pulse every 15 s */
    const s=Math.floor(el);
    $('#holdClock').textContent = Math.floor(s/60)+':'+pad(s%60);
    $('#holdBar').style.width='100%';
    if(s!==holdLastS){ holdLastS=s; if(s>0 && s%15===0) vib(80); }
  }
}
function holdStop(){
  const el=(Date.now()-holdT0)/1000;
  holdFinish(holdTarget? Math.min(holdTarget, Math.round(el)) : Math.round(el));
}
function holdFinish(secs){
  clearInterval(holdInt); holdInt=null; $('#hold').classList.remove('on');
  const a=S.active; if(!a) return;
  const e=a.ex[holdEi]; if(!e) return;
  const st=e.sets[holdSi]; if(!st) return;
  st.r=String(Math.max(1, Math.round(secs))); st.done=true;
  delete st.plan;                 /* a completed hold is a real set, not a suggestion */
  save(); renderWorkout();
  if(exGroupOf(e.exId)!=='Cardio') startRest(exRest(e.exId));
}
function holdCancel(){ clearInterval(holdInt); holdInt=null; $('#hold').classList.remove('on'); }

/* ============ STOPWATCH ============ */
let swRun=false, swAcc=0, swT0=0, swInt=null, swLapsArr=[];
function swFmt(ms){
  const t=Math.floor(ms/100), d=t%10, s=Math.floor(t/10)%60, m=Math.floor(t/600);
  return pad(m)+':'+pad(s)+'.'+d;
}
function swToggle(){
  if(swRun){ swAcc+=Date.now()-swT0; swRun=false; clearInterval(swInt); $('#swMain').textContent='Start'; }
  else{ swT0=Date.now(); swRun=true; swInt=setInterval(swDraw,100); $('#swMain').textContent='Pause'; }
}
function swNow(){ return swAcc + (swRun? Date.now()-swT0 :0); }
function swDraw(){ $('#swClock').textContent=swFmt(swNow()); }
function swLap(){
  if(!swRun && swNow()===0) return;
  swLapsArr.unshift(swNow());
  $('#swLaps').innerHTML=swLapsArr.map(function(t,i){
    const prev=swLapsArr[i+1]||0;
    return '<div class="listrow"><span class="tiny muted">Lap '+(swLapsArr.length-i)+'</span><span class="small num">'+swFmt(t-prev)+' <span class="muted">· '+swFmt(t)+'</span></span></div>';
  }).join('');
}
function swReset(){ swRun=false; clearInterval(swInt); swAcc=0; swLapsArr=[];
  $('#swClock').textContent='00:00.0'; $('#swLaps').innerHTML=''; $('#swMain').textContent='Start'; }

/* ============ HIIT ============ */
let hi={run:false, phase:'ready', round:0, end:0, int:null};
function hiToggle(){
  if(hi.run){ hi.pauseLeft=hi.end-Date.now(); hi.run=false; clearInterval(hi.int); $('#hiMain').textContent='Resume'; return; }
  if(hi.phase==='ready'||hi.phase==='done'){
    hi.phase='work'; hi.round=1; hi.end=Date.now()+(+$('#hiWork').value||30)*1000; beep(1);
    S.settings.hiit={w:+$('#hiWork').value||40, r:+$('#hiRest').value||20, n:+$('#hiRounds').value||8}; save();
  }
  else if(hi.pauseLeft){ hi.end=Date.now()+hi.pauseLeft; hi.pauseLeft=0; }
  hi.run=true; $('#hiMain').textContent='Pause';
  clearInterval(hi.int); hi.int=setInterval(hiTick,150); hiTick();
}
function hiTick(){
  const W=+$('#hiWork').value||30, R=+$('#hiRest').value||0, N=+$('#hiRounds').value||1;
  const left=hi.end-Date.now();
  if(left<=0){
    if(hi.phase==='work'){
      if(hi.round>=N && R===0){ return hiDone(); }
      if(R>0){ hi.phase='rest'; hi.end=Date.now()+R*1000; beep(2); vib(200); }
      else { hi.round++; hi.end=Date.now()+W*1000; beep(1); }
    } else { /* rest over */
      if(hi.round>=N){ return hiDone(); }
      hi.round++; hi.phase='work'; hi.end=Date.now()+W*1000; beep(1); vib(100);
    }
  }
  const s=Math.ceil(Math.max(0,hi.end-Date.now())/1000);
  $('#hiClock').textContent=Math.floor(s/60)+':'+pad(s%60);
  $('#hiClock').style.color = hi.phase==='work' ? 'var(--wk)' : 'var(--wa)';
  $('#hiPhase').textContent = (hi.phase==='work'?'WORK':'REST')+' · round '+hi.round+' of '+N;
}
function hiDone(){
  clearInterval(hi.int); hi.run=false; hi.phase='done';
  $('#hiClock').textContent='Done'; $('#hiClock').style.color='var(--good)';
  $('#hiPhase').textContent='All rounds complete';
  $('#hiMain').textContent='Start';
  beep(4); vib([400,120,400]); notify('HIIT complete','Nice work.');
}
function hiReset(){ clearInterval(hi.int); hi={run:false,phase:'ready',round:0,end:0,int:null};
  $('#hiClock').textContent='Ready'; $('#hiClock').style.color='';
  $('#hiPhase').textContent=($('#hiWork').value||40)+'s work · '+($('#hiRest').value||20)+'s rest · '+($('#hiRounds').value||8)+' rounds';
  $('#hiMain').textContent='Start'; }

function foodHistoryCounts(){
  const seen={};
  Object.keys(S.food||{}).sort().reverse().slice(0,90).forEach(function(d){
    ['b','l','d','s'].forEach(function(m){
      ((S.food[d]||{})[m]||[]).forEach(function(e){
        if(!e.name) return;
        if(!seen[e.name]) seen[e.name]={name:e.name, kcal:e.kcal, p:e.p, c:e.c, f:e.f, fb:e.fb||0, n:0, last:d};
        seen[e.name].n++;
        if(d>seen[e.name].last) seen[e.name].last=d;
      });
    });
  });
  return seen;
}
function recentFoods(limit){
  const seen=foodHistoryCounts();

  (day[meal]=day[meal]||[]).push({id:uid(), name:f.name, kcal:f.kcal, p:f.p, c:f.c, f:f.f, fb:f.fb||0});
  save(); vib(12); closeSheet(); renderFood();
  toast(f.name+': '+Math.round(f.kcal)+' kcal logged');
}
/* ---------- diet ----------
   Classified by name rather than a seventh column, so the 343 rows keep the
   six-field shape everything else relies on. This filters what is OFFERED only:
   entries you already logged and barcodes you already taught are snapshots, and
   must never be filtered out from under you. */
/* Substring matching has predictable false positives: "no ghee" contains ghee,
   "peanut butter" contains butter, "kheera" contains kheer. Tested BEFORE
   DIET_TAGS so the tag wins outright, rather than patching three names and
   waiting for the next food that says butter. */
const DIET_EXCEPT=[
  [/no ghee|without ghee|peanut butter|almond butter|kheera/i, 'veg']
];
const DIET_TAGS=[
  /* \bmaas\b, not loose: laal maas, safed maas and junglee maas are mutton and
     were classifying as vegetarian, which is the worst direction for this
     mistake to go. gosht, murgh, machli and jhinga are here for the same reason
     - the dish is not always named in English. */
  [/chicken|mutton|lamb|keema|fish|prawn|shrimp|shawarma|\bmaas\b|\bgosht\b|\bmurgh\b|\bmachh?li\b|\bjhinga\b/i, 'nonveg'],
  /* no loose "bhurji": egg bhurji is caught by \begg\b and anda, whereas a
     bare bhurji match hid paneer bhurji from vegetarians */
  /* every alternative is word-bounded: an unanchored "anda" is a substring of
     "standard", which tagged a vegetarian thali as egg and hid it from
     vegetarians. The same trap waits in any loose three-letter alternative. */
  [/\begg\b|\beggs\b|\bomelette\b|\banda\b|\bhalf fry\b|\bsunny side\b/i, 'egg'],
  [/paneer|milk|curd|dahi|lassi|ghee|butter|cheese|cream|malai|khoya|mawa|rabri|kheer|shrikhand|kulfi|ice cream|softy|choco bar|cassata|whey|casein|chaas|buttermilk|hung curd|latte|cappuccino|frappe|cold coffee|hot chocolate|milkshake|shake|cold cocoa/i, 'dairy']
];
function foodDiet(name){
  const n=name||'';
  for(let i=0;i<DIET_EXCEPT.length;i++) if(DIET_EXCEPT[i][0].test(n)) return DIET_EXCEPT[i][1];
  /* egg bhurji is egg; paneer bhurji is dairy, so nonveg and egg are tested first */
  for(let i=0;i<DIET_TAGS.length;i++) if(DIET_TAGS[i][0].test(n)) return DIET_TAGS[i][1];
  return 'veg';
}
const DIET_ALLOWS={
  nonveg:['nonveg','egg','dairy','veg'],
  egg:['egg','dairy','veg'],
  veg:['dairy','veg'],
  vegan:['veg']
};
function dietAllows(name, diet){
  const allow=DIET_ALLOWS[diet||'veg']||DIET_ALLOWS.veg;
  return allow.indexOf(foodDiet(name))>-1;
}
function fdbAllFoods(){
  const diet=S.settings.diet||'veg';
  return FOODDB.filter(function(f){ return dietAllows(f[0], diet); })
    .map(function(f){ return {name:f[0], kcal:f[1], p:f[2], c:f[3], f:f[4], fb:f[5]||0}; })
    /* your own saved foods are never filtered: you made them on purpose */
    .concat((S.myFoods||[]).map(function(m){ return {name:m.name, kcal:m.kcal, p:m.p, c:m.c, f:m.f, fb:m.fb||0, mine:true, id:m.id}; }));
}
/* ---------- search synonyms ----------
   The rows are named the way the food is called here, which means half of them
   are invisible to the other name for the same thing: searching "cucumber"
   found nothing because the row says kheera, and you would reasonably conclude
   the food was missing. Each entry is [what you might type, what the rows
   actually say] — a matched phrase is consumed and becomes ONE alternatives
   group, so "pani patashi" is a single concept rather than two words that must
   both appear. Same shape as PAT_EX, SUPP_INFO and DIET_TAGS. */
const FOOD_ALIAS=[
  /* multi-word first: they must be consumed before their words are tokenised */
  [/\bpani\s*patashi\b|\bgol\s*gappa?e?s?\b|\bpuchkas?\b/i, ['pani puri','golgappa']],
  [/\blady\s*fingers?\b|\bokra\b/i,          ['bhindi']],
  [/\bcottage\s*cheese\b/i,                  ['paneer']],
  [/\bridge\s*gourd\b/i,                     ['turai']],
  [/\bbottle\s*gourd\b/i,                    ['lauki']],
  [/\bpointed\s*gourd\b/i,                   ['parwal']],
  [/\bbitter\s*(gourd|melon)\b/i,            ['karela']],
  [/\bbell\s*pepper\b|\bcapsicum\b/i,        ['shimla']],
  [/\bkidney\s*beans?\b/i,                   ['rajma']],
  [/\bchick\s*peas?\b|\bgarbanzos?\b/i,      ['chole','chana']],
  [/\bclarified\s*butter\b/i,                ['ghee']],
  [/\bsoft\s*drinks?\b|\bcokes?\b|\bpepsi\b|\bsodas?\b/i, ['cold drink']],
  [/\bfrench\s*fries\b/i,                    ['fries']],
  [/\bice[\s-]*creams?\b/i,                  ['ice cream']],
  /* run-together spellings of things that are two words in the rows */
  [/\bpatra\b|\baloo\s*vadi\b|\barbi\s*ke?\s*patte\b/i, ['pattod','patra']],
  [/\bmoong\s*badi\b|\bmoong\s*ki\s*badi\b/i,   ['mangodi']],
  [/\bbhelpuri\b/i,                          ['bhel puri']],
  [/\bsevpuri\b/i,                           ['sev puri']],
  [/\bdahipuri\b/i,                          ['dahi puri']],
  [/\bpanipuri\b/i,                          ['pani puri']],
  /* single words */
  [/^cucumbers?$/i,      ['kheera','cucumber']],
  [/^yogh?urts?$/i,      ['curd','dahi','yogurt']],
  [/^pumpkins?$/i,       ['kaddu']],
  [/^spinach$/i,         ['palak']],
  [/^fenugreek$/i,       ['methi']],
  [/^potatoe?s?$/i,      ['aloo','potato']],
  [/^onions?$|^kanda$/i, ['pyaaz','kande','onion']],
  [/^cauliflower$/i,     ['gobi']],
  [/^peas$/i,            ['matar']],
  [/^(eggplants?|aubergines?|brinjals?)$/i, ['baingan']],
  [/^(colocasia|taro)$/i,['arbi']],
  [/^lentils?$/i,        ['dal']],
  [/^flatbreads?$/i,     ['roti']],
  [/^noodles?$/i,        ['noodles','chowmein']],
  [/^(chips|crisps|wafers?)$/i, ['chips','chipps','lays','kurkure','bingo']],
  [/^koftas?$|^guftes?$/i,['kofta','gufte']],
  [/^granola$/i,         ['muesli','granola']],
  [/^sabj(i|ee)$/i,      ['sabzi']],
  [/^(chapat(i|hi)|phulka)$/i, ['roti','chapati','phulka']],
  [/^murgh$/i,           ['chicken']],
  [/^(gosht|lamb)$/i,    ['mutton','lamb']],
  [/^machh?li$/i,        ['fish']],
  [/^(jhinga|shrimps?)$/i,['prawn']],
  [/^anda$/i,            ['egg','anda']],
  [/^doodh$/i,           ['milk']],
  [/^kela$/i,            ['banana']],
  [/^(seb|apples?)$/i,   ['apple']],
  [/^aam$/i,             ['mango']],
  [/^badam$/i,           ['almond','badam']],
  [/^kaju$/i,            ['cashew','kaju']],
  [/^(moongfali|groundnuts?)$/i, ['peanut']],
  [/^kishmish$/i,        ['raisin']],
  [/^akhrot$/i,          ['walnut']],
  [/^cheeni$/i,          ['sugar']],
  [/^amrood$/i,          ['guava']],
  [/^lok(i|hi)$/i,       ['lauki','loki']],
  [/^tomatoe?s?$/i,      ['tamatar','tomato']],
  [/^vegetables?$/i,     ['veg']]
];
/* Hindi and English joining words carry no meaning here, and requiring them
   made "loki ke gufte" miss a row literally called "Lauki ke gufte" because
   the alias fired on lauki and left "ke" as a token of its own. */
const FOOD_STOP=/^(ke|ki|ka|aur|se|with|and|the|of|in|a|an)$/i;
/* A query becomes a list of alternatives-groups. Every group must match the
   name somewhere; within a group, any one alternative is enough. */
function foodTokens(q){
  let s=String(q||'').toLowerCase().trim();
  const groups=[];
  /* pass 1, on the whole string: a multi-word alias has to be consumed before
     tokenising, or "pani patashi" becomes two words that must both appear */
  FOOD_ALIAS.forEach(function(a){
    if(/\\s/.test(a[0].source) && a[0].test(s)){ s=s.replace(a[0],' '); groups.push(a[1]); }
  });
  const words=s.split(/\s+/).filter(Boolean);
  const kept=words.filter(function(t){ return !FOOD_STOP.test(t); });
  /* if the query was nothing BUT joining words, keep them rather than
     silently searching for everything */
  /* pass 2, per word: the single-word aliases are anchored, so they only ever
     matched when the whole query was that one word */
  (kept.length||groups.length? kept : words).forEach(function(t){
    let alts=null;
    for(let i=0;i<FOOD_ALIAS.length && !alts;i++) if(FOOD_ALIAS[i][0].test(t)) alts=FOOD_ALIAS[i][1];
    groups.push(alts? alts.concat([t]) : [t]);
  });
  return groups;
}
/* Transliterated Hindi has no fixed spelling: pattod, patod, patode and pattode
   are one dish, and nobody should have to guess which one the row used. Collapse
   doubled letters and drop a trailing vowel, and they all land on "patod". */
function foodStem(w){
  return String(w||'').toLowerCase()
    .replace(/[^a-z0-9]+/g,'')
    .replace(/([a-z])\1+/g,'$1')
    .replace(/[aeiou]+$/,'');
}
function nameStems(name){
  return String(name||'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).map(foodStem);
}
function foodMatches(name, groups){
  const n=String(name||'').toLowerCase();
  let stems=null;
  return groups.every(function(alts){
    if(alts.some(function(a){ return n.indexOf(a)>-1; })) return true;
    /* Stems are compared whole word to whole word, never as a substring: an
       over-stemmed fragment used as a substring would match half the database. */
    if(!stems) stems=nameStems(name);
    return alts.some(function(a){
      const st=foodStem(a);
      return st.length>2 && stems.indexOf(st)>-1;
    });
  });
}
function fdbSearch(q){
  FDQ=(q||'').trim();
  const box=$('#fdbRes'); FDITEM=null; $('#fdbSel').innerHTML='';
  if(!FDQ){ box.innerHTML=''; return; }
  const groups=foodTokens(FDQ);
  const first=(groups[0]||[''])[0];
  const hist=foodHistoryCounts();
  FDRES=fdbAllFoods().filter(function(f){
    return foodMatches(f.name, groups);
  }).sort(function(a,b){
    /* what you log often should not be buried under what you never eat, but a
       name that STARTS with what you typed beats history: typing "dal" wants
       Dal tadka, not Moong dal halwa. */
    const pa=a.name.toLowerCase().indexOf(first)===0?1:0, pb=b.name.toLowerCase().indexOf(first)===0?1:0;
    if(pa!==pb) return pb-pa;
    const ca=(hist[a.name]||{}).n||0, cb=(hist[b.name]||{}).n||0;
    return cb-ca;
    /* 12, not 8: with 480 rows a broad word like "paneer" overflowed the list
       and the row you wanted was cut off with no way to see it */
  }).slice(0,12);
  box.innerHTML = FDRES.map(function(f,i){
    return '<div class="listrow" style="cursor:pointer" onclick="fdbPick('+i+')"><span class="small">'+esc(f.name)+
      (f.mine? ' <span class="tiny" style="color:var(--wk)">★ mine</span>':'')+'</span>'+
      '<span class="row" style="gap:8px"><span class="tiny muted num">'+f.kcal+' kcal · P'+f.p+'</span>'+
      (f.mine? '<button class="btn ghost sm danger" onclick="event.stopPropagation();delMyFood(\''+f.id+'\')">✕</button>':'')+'</span></div>';
  }).join('')
  + (FDRES.length
      ? '<div class="tiny" style="padding:8px 2px"><a href="#" style="color:var(--wk)" onclick="myFoodForm();return false">＋ Not here? Save “'+esc(FDQ)+'” as my food</a></div>'
      /* a dead end here is why a dish goes unlogged: asking for four macro
         numbers nobody knows is not an offer, it is a refusal */
      : '<div style="padding:6px 2px 2px"><div class="tiny muted" style="margin-bottom:8px; line-height:1.5">Nothing matched “'+esc(FDQ)+'”. Home cooking has a longer tail than any database — estimate it instead.</div>'+
        '<button class="btn food wide" onclick="sabziSheet()">Estimate “'+esc(FDQ)+'”</button>'+
        '<div class="tiny" style="padding:8px 2px"><a href="#" style="color:var(--wk)" onclick="myFoodForm();return false">＋ Or enter the numbers yourself</a></div></div>');
}
function fdbPick(i){

    '<div class="tiny muted num" style="margin:2px 0 10px">'+FDITEM.kcal+' kcal · P '+FDITEM.p+' · C '+FDITEM.c+' · F '+FDITEM.f+' (per unit)</div>'+

/* ---- build a plate from parts, log it as one meal ---- */
function plateAdd(){
  const f=FDITEM; if(!f) return;
  const n=Math.max(0.5, +$('#fdbQty').value||1);
  const same=PLATE.find(function(x){ return x.name===f.name; });

  else PLATE.push({name:f.name, kcal:f.kcal, p:f.p, c:f.c, f:f.f, fb:f.fb||0, n:n});

function plateQty(i,d){

function plateDel(i){ PLATE.splice(i,1); renderPlate(); }
function plateTotals(){

  },{kcal:0,p:0,c:0,f:0,fb:0});
}
function plateName(){

function plateLog(){

function fdbAdd(){
  const f=FDITEM; if(!f) return;

/* ---------- the sabzi estimator ----------
   Three rounds of "I cannot find X" said the same thing: the tail of Indian
   home cooking has no end, and 553 rows still will not cover one household.
   The old dead end asked for calories, protein, carbs and fat, none of which
   anyone knows for their mother's pattod — so the honest choices were to log
   something wrong or log nothing.

   Six shapes cover almost all of it. Per-100g figures, calibrated against the
   component rows already in the database (Dry sabzi / Sabzi gravy only / Dal
   plain boiled, per katori) so the estimates agree with it rather than
   inventing a second scale. Marked as estimates wherever they appear: a guess
   must never look like a measurement. */
const SABZI_TPL=[
  {key:'dry',   name:'Dry sabzi',        note:'Vegetable, oil, masala. Bhindi, aloo, gobi, cabbage.',
   per100:[75,2,7,4.5,2.8]},
  {key:'gravy', name:'Gravy sabzi',      note:'Onion-tomato base, more oil. Aloo matar, mixed veg.',
   per100:[95,2.5,9,5.5,2.6]},
  {key:'besan', name:'Besan-based',      note:'Gatte, pattod, pakodi, mangodi. Carries real protein.',
   per100:[165,7,14,9,2.5]},
  {key:'stuff', name:'Stuffed / bharwan',note:'Bharwan baingan or mirch: vegetable, filling and the oil it cooked in.',
   per100:[140,3,10,10,3.2]},
  {key:'dal',   name:'Dal',              note:'Any lentil, tadka included.',
   per100:[95,6,14,2,5.2]},
  {key:'leafy', name:'Leafy / saag',     note:'Palak, methi, sarson.',

const SABZI_PORTION=[['katori',150],['bowl',250],['plate',350]];

function sabziEstimate(key, grams){
  const t=SABZI_TPL.find(function(x){ return x.key===key; })||SABZI_TPL[0];
  const k=grams/100;
  const r=function(v,d){ const m=Math.pow(10,d||0); return Math.round(v*k*m)/m; };
  return {kcal:r(t.per100[0]), p:r(t.per100[1],1), c:r(t.per100[2],1),

function sabziSheet(){

  openSheet('<h3>Estimate a dish</h3>'+

    SABZI_TPL.map(function(t){

/* ---------- barcode scanning ----------
   There is no product database to call: the app makes no network requests and
   the artifact's CSP blocks external hosts outright. So it learns instead. The
   first scan of a packet asks what it is, once, and remembers the code for good.
   The stored value is a snapshot, not a reference, so it survives the source
   food being edited or deleted later. */
let BC={stream:null, timer:null, meal:'s', det:null};
function barcodeSupported(){ return typeof window.BarcodeDetector!=='undefined'; }
function scanSheet(meal){
  BC.meal=meal||'s';
  const known=Object.keys(S.barcodes||{}).length;
  if(!barcodeSupported()){
    openSheet('<h3>Scan a barcode</h3>'+
      '<p class="small" style="color:var(--ink2); line-height:1.6">This browser has no barcode reader built in. '+
      'Chrome on Android does; Safari and every browser on iPhone do not, and Apple has not shipped it.</p>'+
      '<p class="tiny muted" style="line-height:1.6">You can still type the number off the packet, and it will be remembered the same way.</p>'+
      barcodeManualField()+
      (known? '<button class="btn ghost wide" style="margin-top:10px" onclick="barcodeList()">'+known+' saved product'+(known>1?'s':'')+'</button>':''));
    return;
  }
  openSheet('<h3>Scan a barcode</h3>'+
    '<p class="tiny muted" style="margin:-6px 0 10px">Hold the packet steady, barcode filling the frame.</p>'+
    '<div style="position:relative; background:#000; border-radius:14px; overflow:hidden; aspect-ratio:4/3">'+
      '<video id="bcVid" playsinline muted style="width:100%; height:100%; object-fit:cover"></video>'+
      '<div style="position:absolute; left:8%; right:8%; top:38%; height:24%; border:2px solid var(--wk); border-radius:8px"></div>'+
    '</div>'+
    '<div id="bcMsg" class="tiny muted" style="margin-top:10px; text-align:center">Starting the camera…</div>'+
    barcodeManualField()+
    (known? '<button class="btn ghost wide" style="margin-top:10px" onclick="barcodeList()">'+known+' saved product'+(known>1?'s':'')+'</button>':''));
  startScan();
}
function barcodeManualField(){
  return '<div class="field" style="margin-top:12px"><label for="bcNum">Or type the number</label>'+
    '<input id="bcNum" type="number" inputmode="numeric" placeholder="8901058…"></div>'+
    '<button class="btn wide" onclick="onCode((document.querySelector(\'#bcNum\')||{}).value)">Look it up</button>';
}
function startScan(){
  const v=$('#bcVid'); if(!v) return;
  try{ BC.det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']}); }
  catch(e){ BC.det=new window.BarcodeDetector(); }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(function(st){
    BC.stream=st; v.srcObject=st; v.play();
    const msg=$('#bcMsg'); if(msg) msg.textContent='Looking for a barcode…';
    BC.timer=setInterval(function(){
      if(!BC.det||!v.videoWidth) return;
      BC.det.detect(v).then(function(codes){
        if(codes&&codes.length) onCode(codes[0].rawValue);
      }).catch(function(){});
    }, 350);
  }).catch(function(err){
    const msg=$('#bcMsg');
    if(msg) msg.innerHTML='<span style="color:var(--wk)">Camera unavailable: '+esc(err.name||'blocked')+
      '.</span> Type the number below instead.';
  });
}
function stopScan(){
  clearInterval(BC.timer); BC.timer=null;
  if(BC.stream){ BC.stream.getTracks().forEach(function(t){ t.stop(); }); BC.stream=null; }
  BC.det=null;
}
function onCode(code){
  code=String(code||'').trim();
  if(!code){ toast('Enter a number first'); return; }
  stopScan(); vib(18);
  const hit=(S.barcodes||{})[code];
  if(hit) barcodePick(code, hit);
  else barcodeLink(code);
}

     should still find the kheera row to attach the barcode to */

    return foodMatches(f.name, groups);
  }).slice(0,6);
  box.innerHTML=BCRES.map(function(f,i){
    return '<div class="listrow" style="cursor:pointer" onclick="bcAttach('+i+')"><span class="small">'+esc(f.name)+'</span>'+

function delFood(meal,id){
  const day=S.food[foodDate]||{};
  const gone=(day[meal]||[]).find(function(e){return e.id===id;});
  const at=(day[meal]||[]).findIndex(function(e){return e.id===id;});
  day[meal]=(day[meal]||[]).filter(function(e){return e.id!==id;});
  save(); renderFood();
  if(!gone) return;
  const d=foodDate;
  toastUndo(esc(gone.name)+' removed', function(){
    const back=S.food[d]=S.food[d]||{};
    back[meal]=back[meal]||[];
    back[meal].splice(Math.max(0,at), 0, gone);
    save(); renderFood();
  });
}

/* ---- BMI analysis ----
   Indian (ICMR/WHO-Asia) cutoffs are the clinically relevant ones here; the
   international WHO set is shown alongside so the number still lines up with
   every chart online. */
const BMI_IN=[[18.5,'Underweight'],[23,'Normal'],[25,'Overweight'],[Infinity,'Obese']];
const BMI_WHO=[[18.5,'Underweight'],[25,'Normal'],[30,'Overweight'],[Infinity,'Obese']];
function bmiOf(kg,cm){ const m=+cm/100; return (!kg||!cm)? null : Math.round(kg/(m*m)*10)/10; }
function bmiBand(v,table){
  for(let i=0;i<table.length;i++) if(v<table[i][0]) return table[i][1];
  return table[table.length-1][1];
}

function bmiHTML(){
  const st=S.settings;
  const ws=S.weights.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  const last=ws[ws.length-1];
  let h='<div class="osec"><h2><span class="dot" style="background:var(--bd)"></span>BMI analysis</h2>';
  if(!last || !st.height){
    h+='<div class="empty">'+(!last?'Log a weigh-in':'Set your height in Settings')+' and this fills in.</div>'+
      '<button class="btn wide" style="margin-top:12px" onclick="'+(!last?'weightForm()':'openSettings()')+'">'+
      (!last?'Log weight':'Open Settings')+'</button></div>';
    return h;
  }
  const v=bmiOf(last.kg, st.height);
  const band=bmiBand(v,BMI_IN), who=bmiBand(v,BMI_WHO);
  const ok=(v>=18.5 && v<23);
  /* pointer position across an 15-32 span, which covers every band worth showing */
  const pos=Math.max(0, Math.min(100, (v-15)/(32-15)*100));
  h+='<div class="row" style="align-items:baseline; gap:10px; margin-bottom:2px">'+
      '<span class="tv num" style="font-size:40px; font-family:var(--fd-disp); font-weight:700">'+v+'</span>'+
      '<span class="small" style="color:'+(ok?'var(--good)':'var(--wk)')+'; font-weight:700">'+band+'</span></div>'+
    '<div class="tiny muted" style="margin-bottom:12px">Indian cutoffs · '+who+' by international WHO bands</div>'+
    '<div class="bmiscale"><i style="left:'+pos+'%"></i></div>'+
    '<div class="bmiticks"><span>15</span><span>18.5</span><span>23</span><span>25</span><span>30</span></div>';
  const loIn=kgForBmi(18.5,st.height), hiIn=kgForBmi(22.9,st.height), hiWho=kgForBmi(24.9,st.height);
  h+='<div class="tline"><span class="small">Healthy range at '+st.height+' cm</span>'+
      '<span class="tiny num" style="text-align:right">'+loIn+' - '+hiIn+' '+unit()+
      '<span class="muted"> · to '+hiWho+' WHO</span></span></div>';
  if(st.goalWeight){
    const gb=bmiOf(+st.goalWeight, st.height);
    h+='<div class="tline"><span class="small">Your goal, '+st.goalWeight+' '+unit()+'</span>'+
      '<span class="tiny num" style="text-align:right">BMI '+gb+' <span class="muted">'+bmiBand(gb,BMI_IN)+'</span></span></div>';
  }
  const room=Math.round((hiIn-last.kg)*10)/10;
  h+='<div class="tline" style="border:0"><span class="small">Room before the next band</span>'+
    '<span class="tiny num" style="text-align:right">'+(room>0? '+'+room+' '+unit() : Math.abs(room)+' '+unit()+' over')+'</span></div>';
  if(ws.length>1){
    const bs=ws.filter(function(w){return w.kg;}).map(function(w){ return {date:w.date, kg:bmiOf(w.kg,st.height)}; });
    h+='<div class="tiny muted" style="margin:14px 0 2px">BMI over time</div>'+weightChart(bs,true);
  }
  h+='<p class="tiny muted" style="margin-top:12px; line-height:1.6">BMI knows your height and weight and nothing else. '+
    'It cannot tell muscle from fat, so while you are lifting three times a week a rising number is not automatically the wrong direction. '+
    'Read it next to the tape measure and the photos, not on its own.</p>';
  return h+'</div>';
}
