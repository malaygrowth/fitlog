<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#0e1214; --surface:#161d21; --raised:#1f282e; --line:#2b373f;
    --ink:#edf2f4; --ink2:#93a6b0; --ink3:#5c6d76;
    --wk:#f2a03d; --wk-dim:#f2a03d33;
    --wa:#56b8e8; --wa-dim:#56b8e833;
    --fd:#8fd068; --fd-dim:#8fd06833;
    --bd:#b48ee0; --bd-dim:#b48ee033;
    --sl:#8ea0e8; --stp:#5ecfb5;
    --bad:#e8695e; --good:#4fc98a;
    --r:16px;
    --fd-disp:'Archivo', -apple-system, Roboto, system-ui, sans-serif;
    --fd-serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
    --fd-dot:'Doto', ui-monospace, monospace;
    --grad-am:linear-gradient(135deg, #ffc76e, #f08a2b);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;
    font-size:16px; line-height:1.45;
    min-height:100vh; min-height:100dvh;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
  input,select,textarea{font:inherit; color:var(--ink); background:var(--raised); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--wk); outline-offset:1px}
  input[type=number]{font-variant-numeric:tabular-nums}
  ::placeholder{color:var(--ink3)}

  #app{max-width:480px; margin:0 auto; padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 8px;
  }
  header.top .brand{font-family:var(--fd-disp); font-weight:800; letter-spacing:-.02em; font-size:21px}
  header.top .brand small{display:block; font-weight:500; font-size:12px; color:var(--ink2); letter-spacing:.01em}
  .gear{width:44px;height:44px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink2)}

  main{padding:6px 14px 20px; display:block}
  section.tab{display:none}
  section.tab.on{display:block}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px}
  .card h2{font-family:var(--fd-disp); font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); margin-bottom:12px; display:flex; align-items:center; gap:8px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%}
  .row{display:flex; align-items:center; gap:10px}
  .row.wrap{flex-wrap:wrap}
  .spread{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .grow{flex:1}
  .muted{color:var(--ink2)} .tiny{font-size:12px} .small{font-size:13.5px}
  .num{font-variant-numeric:tabular-nums}
  .big{font-family:var(--fd-disp); font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
  .serifacc{font-family:var(--fd-serif); font-style:italic; font-size:1.18em; letter-spacing:.01em}
  .qcard{font-family:var(--fd-serif); font-style:italic; font-size:19.5px; line-height:1.4; color:var(--ink)}
  .qcard .qtip{font-family:-apple-system, Roboto, system-ui, sans-serif; font-style:normal; font-size:12px; color:var(--ink2); margin-top:10px; line-height:1.5}
  .dots{display:flex; gap:8px; margin-top:12px}
  .dcol{display:flex; flex-direction:column; gap:3px; flex:1; align-items:center}
  .dcol i{width:9px; height:9px; border-radius:50%; background:var(--raised); display:block}
  .dcol .dl{font-size:9px; color:var(--ink3); margin-top:3px; font-weight:700}
  .wkdots{display:flex; gap:10px; margin-top:12px}
  .wkdots .wd{display:flex; flex-direction:column; align-items:center; gap:4px}
  .wkdots .wd i{width:13px; height:13px; border-radius:50%; background:var(--raised); display:block; box-sizing:border-box}
  .wkdots .wd span{font-size:9px; color:var(--ink3); font-weight:700}

  .btn{background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:11px 14px; font-weight:600; font-size:14.5px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:7px}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--grad-am); border-color:transparent; color:#191106; box-shadow:0 4px 16px #f2a03d33}
  .btn.water{background:var(--wa); border-color:var(--wa); color:#0a1920}
  .btn.food{background:var(--fd); border-color:var(--fd); color:#101b0a}
  .btn.body{background:var(--bd); border-color:var(--bd); color:#170f22}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--bad); border-color:#e8695e55}
  .btn.wide{width:100%}
  .btn.sm{padding:7px 11px; min-height:36px; font-size:13px; border-radius:10px}
  .chip{background:var(--raised); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13.5px; font-weight:600; min-height:38px}
  .chip.on{background:var(--wk); border-color:var(--wk); color:#191106}

  /* bottom nav */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs .in{max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
  nav.tabs button{display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px 5px; color:var(--ink3); font-size:10.5px; font-weight:600; letter-spacing:.02em; border-radius:10px}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button.on{color:var(--ink)}
  nav.tabs button.on .ic-today{color:var(--wk)}
  nav.tabs button.on .ic-wk{color:var(--wk)}
  nav.tabs button.on .ic-tm{color:var(--wk)}
  nav.tabs button.on .ic-fd{color:var(--fd)}
  nav.tabs button.on .ic-bd{color:var(--bd)}

  /* rings + bars */
  .ring{position:relative; width:118px; height:118px; flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .mid{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
  .bar{height:8px; background:var(--raised); border-radius:99px; overflow:hidden}
  .bar i{display:block; height:100%; border-radius:99px}

  /* set table */
  .sethead,.setrow{display:grid; grid-template-columns:42px 1fr 80px 68px 48px; gap:8px; align-items:center}
  .sethead{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink3); margin:10px 0 6px}

/* beep via WebAudio */
let AC=null;
function beep(times){
  times = times||2;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    for(let i=0;i<times;i++){
      const o=AC.createOscillator(), g=AC.createGain();
      o.connect(g); g.connect(AC.destination);
      o.frequency.value=880; o.type='sine';
      const t0=AC.currentTime + i*0.28;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.4,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
      o.start(t0); o.stop(t0+0.24);
    }
  }catch(e){}
}
function notify(title, body, sound){
  /* Android only shows notifications via a service worker registration;
     desktop and iOS Safari accept the Notification constructor. Try both. */
  try{
    if('Notification' in window && Notification.permission==='granted'){
      const fallback=function(){ try{ new Notification(title,{body:body, tag:'fitlog'}); }catch(e){} };
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
        navigator.serviceWorker.getRegistration().then(function(reg){
          if(reg && reg.showNotification) reg.showNotification(title,{body:body, tag:'fitlog', vibrate:[200,80,200]});
          else fallback();
        }).catch(fallback);
      } else fallback();
    }
  }catch(e){}
  toast(title + (body ? ' — '+body : ''));
  vib([200,80,200]);
  if(sound) beep(2);
}
function askNotify(){
  if(!('Notification' in window)){ toast('Notifications not supported here'); return; }
  Notification.requestPermission().then(function(p){

function round25(x){ return Math.round(x/2.5)*2.5; }
function lastDateFor(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const ex=S.sessions[i].ex.find(function(e){ return e.exId===exId; });
    if(ex && ex.sets.length) return S.sessions[i].date;
  }
  return null;
}
function targetFor(exId){
  const g=exGroupOf(exId);
  if(g==='Cardio'||g==='Mobility') return null;
  const pa=prevArr(exId); if(!pa) return null;
  const work=pa.filter(function(s){ return !s.wu && (+s.w||+s.r); });
  if(!work.length) return null;
  const top=work.reduce(function(a,s){ return (+s.w||0)>(+a.w||0)?s:a; }, work[0]);
  const w=+top.w||0, r=+top.r||0;
  /* layoff detection: after 3+ weeks away from a lift, prescribe a
     comeback load instead of progression — old numbers are a ceiling, not a target */
  const ld=lastDateFor(exId);
  if(ld){
    const gap=Math.round((new Date(today()+'T12:00:00')-new Date(ld+'T12:00:00'))/86400000);
    if(gap>21 && w>0){
      return 'comeback: ~'+Math.max(2.5,round25(w*0.6))+'×10–12 light — '+gap+' days since last time, rebuild first';
    }
  }
  if(!w) return r ? 'target: '+(r+1)+' reps' : null;
  if(r>=12) return 'target: '+round25(w+2.5)+'×8 — add weight, reset reps';
  return 'target: '+w+'×'+(r+1)+' — one more rep than last time';
}
function warmupFor(exId){
  const pa=prevArr(exId); if(!pa) return null;
  const work=pa.filter(function(s){ return !s.wu && +s.w; });
  if(!work.length) return null;
  const w=Math.max.apply(null, work.map(function(s){return +s.w;}));
  if(w<30) return null;
  return 'warm-up: bar×10 · '+Math.max(20,round25(w*0.5))+'×5 · '+round25(w*0.75)+'×3';
}

function patternOf(n,g){
  n=n.toLowerCase();
  if(g==='Mobility') return /hang/.test(n) ? 'vpull' : 'stretch';
  if(g==='Cardio') return 'cardio';
  if(/leg extension|leg curl|calf/.test(n)) return null;
  if(/bench|push[- ]?up|fly|crossover|dip/.test(n)) return 'hpush';
  if(/split|bulgarian|lunge|step[- ]?up/.test(n)) return 'lunge';
  if(/squat|leg press|wall sit|wall ball|burpee|jump|climber|jack|knees|bear/.test(n)) return 'squat';
  if(/deadlift|swing|thrust|bridge/.test(n)) return 'hinge';
  if(/pulldown|pull[- ]?up|chin/.test(n)) return 'vpull';
  if(/row|face pull|reverse fly/.test(n)) return 'hpull';
  if(/carry/.test(n)) return 'carry';
  if(/plank|crunch|leg raise|sit[- ]?up/.test(n)) return 'core';

  if(/press/.test(n)) return 'vpush';
  return null;
}

  if(w>=expect-250) return '<b style="color:var(--good)">On pace ✓</b> · ';
  return '<b style="color:var(--wk)">'+(Math.round((expect-w)/50)*50)+'ml behind pace</b> · ';

function dotStrip(getVal, goal, color){
  const L=['M','T','W','T','F','S','S'];
  let h='<div class="dots">';
  const mon=wkMonday(today());
  /* show the trailing 7 days ending today */

    const n=Math.round(Math.min(1,v/goal)*4);
    const p=6-i;
    let col='';
    for(let k=0;k<4;k++) col+='<i class="di" style="animation-delay:'+(p*45+k*25)+'ms'+((3-k)<n?'; background:'+color:'')+'"></i>';
    const dd=new Date(d+'T12:00:00');
    h+='<div class="dcol">'+col+'<span class="dl">'+L[(dd.getDay()+6)%7]+'</span></div>';

/* ============ weekly report ============ */
function wkMonday(iso){ const d=new Date(iso+'T12:00:00'); return dShift(iso, -((d.getDay()+6)%7)); }
function weekStats(ws){
  const we=dShift(ws,6);
  function inR(d){ return d>=ws && d<=we; }
  const ses=S.sessions.filter(function(s){ return inR(s.date); });
  let vol=0, dur=0, km=0;
  ses.forEach(function(s){ vol+=s.vol||0; dur+=s.dur||0;
    s.ex.forEach(function(e){ if(exGroupOf(e.exId)==='Cardio') e.sets.forEach(function(t){ km+=+t.w||0; }); }); });
  let pr=0;
  S.exercises.forEach(function(ex){
    if(ex.group==='Cardio'||ex.group==='Mobility') return;
    let inBest=0, preBest=0;
    S.sessions.forEach(function(s){
      const e=s.ex.find(function(x){return x.exId===ex.id;}); if(!e) return;
      e.sets.forEach(function(t){
        const est=est1RM(t.w,t.r);
        if(inR(s.date)){ if(est>inBest) inBest=est; }
        else if(s.date<ws && est>preBest) preBest=est;
      });
    });
    if(inBest>0 && preBest>0 && inBest>preBest) pr++;
  });
  let slS=0,slN=0,slG7=0, waS=0,waN=0,waHit=0, stS=0,stN=0,stHit=0, kcS=0,ptS=0,fdN=0;
  for(let i=0;i<7;i++){
    const d=dShift(ws,i);
    const sl=S.sleep[d]; if(sl){ slS+=sl.hrs; slN++; if(sl.q==='g'&&sl.hrs>=7) slG7++; }
    const w=S.water[d]||0; if(w>0){ waS+=w; waN++; if(w>=S.settings.waterGoal) waHit++; }
    const sp=S.steps[d]||0; if(sp>0){ stS+=sp; stN++; if(sp>=(+S.settings.stepGoal||8000)) stHit++; }
    const ft=foodTotals(d); if(ft.kcal>0){ kcS+=ft.kcal; ptS+=ft.p; fdN++; }
  }
  const wts=S.weights.filter(function(x){return inR(x.date);}).sort(function(a,b){return a.date<b.date?-1:1;});
  return {ses:ses.length, vol:vol, dur:dur, km:Math.round(km*10)/10, pr:pr,
    sleep: slN? Math.round(slS/slN*10)/10 :0, slN:slN, slG7:slG7,
    water: waN? Math.round(waS/waN) :0, waHit:waHit,
    steps: stS, stHit:stHit,
    kcal: fdN? Math.round(kcS/fdN) :0, prot: fdN? Math.round(ptS/fdN) :0, fdN:fdN,
    wDelta: wts.length>1? Math.round((wts[wts.length-1].kg-wts[0].kg)*10)/10 : null,
    wLast: wts.length? wts[wts.length-1].kg : null};
}
function dif(c,p,unitTxt,goodUp){
  if(!p && !c) return '';
  const d=Math.round((c-p)*10)/10;
  if(!d) return '<span class="muted">same as last wk</span>';
  const up=d>0, good=(goodUp===false)? !up : up;
  return '<span style="color:var(--'+(good?'good':'bad')+')">'+(up?'▲':'▼')+Math.abs(d)+(unitTxt||'')+' vs last wk</span>';
}
function coachNotes(cur,prv,adh){
  const n=[];
  if(adh.brk>0) n.push('Planned break covered '+adh.brk+' day'+(adh.brk>1?'s':'')+' this week — that was the plan, so it counts as following the plan. Walks, protein and sleep keep everything you built.');
  if(cur.ses===0 && !(adh.brk>=4)) n.push('No workouts this week. Restart small — one 15-minute rehab session tonight beats a perfect plan tomorrow.');
  if(cur.slG7>=3) n.push('You got the hours but woke groggy '+cur.slG7+' mornings — that is quality, not quantity. Late screens and late smoke fragment deep sleep; move both earlier in the evening.');
  else if(adh.planned>0 && adh.done>=adh.planned) n.push('You followed the plan '+adh.done+'/'+adh.planned+' days. This is the consistency that changes bodies.');
  else if(adh.planned>0) n.push('Plan adherence '+adh.done+'/'+adh.planned+'. Missed days happen — the rule is: never miss twice in a row.');
  if(cur.slN>=3 && cur.sleep<7) n.push('Sleep averaged '+cur.sleep+'h. Under 7 hours, strength and recovery stall — protect the 22:30 wind-down.');
  if(prv.vol>0 && cur.vol>prv.vol*1.25) n.push('Training volume jumped '+Math.round((cur.vol/prv.vol-1)*100)+'% vs last week. Keep increases near 10% — your knee and wrist are watching.');
  if(cur.fdN>=3 && cur.prot<(+S.settings.proteinGoal||120)*0.8) n.push('Protein averaged '+cur.prot+'g against your '+S.settings.proteinGoal+'g goal — one more whey scoop or 100g paneer daily closes it.');
  if(cur.wLast && prv.wLast && cur.wLast<prv.wLast-0.3 && cur.vol>=prv.vol) n.push('Body weight fell while training rose — you are under-eating for a muscle-building goal. Add ~200 kcal/day.');
  return n.slice(0,3);
}
function openReport(ws){
  ws = ws || wkMonday(today());

  const cur=weekStats(ws), prv=weekStats(dShift(ws,-7));
  /* plan adherence + sets per muscle for this week */
  const we=dShift(ws,6), adh={planned:0, done:0, brk:0}, gsets={};
  for(let i=0;i<7;i++){
    const d=dShift(ws,i);
    if(d>today()) break;
    if(activeBreak(d)){ adh.brk++; continue; }
    const pid=(S.plan||{})[new Date(d+'T12:00:00').getDay()];
    if(pid){ adh.planned++; if(S.sessions.some(function(s){return s.date===d;})) adh.done++; }
  }
  S.sessions.forEach(function(s){
    if(s.date<ws||s.date>we) return;
    s.ex.forEach(function(e){
      const g=exGroupOf(e.exId);

      gsets[g]=(gsets[g]||0)+e.sets.filter(function(t){return !t.wu;}).length;
    });
  });
  const gtxt=Object.keys(gsets).sort(function(a,b){return gsets[b]-gsets[a];})
    .map(function(g){return g+' '+gsets[g];}).join(' · ');
  function row(l,v,d){ return '<div class="listrow"><span class="small">'+l+'</span><span class="small num" style="text-align:right">'+v+(d?'<div class="tiny">'+d+'</div>':'')+'</span></div>'; }
  function sect(t){ return '<div class="tiny muted" style="margin:14px 0 2px; font-weight:700; letter-spacing:.07em; text-transform:uppercase">'+t+'</div>'; }
  let h='<h3 style="margin-bottom:4px">Weekly report</h3>'+
    '<div class="datebar" style="margin-bottom:4px"><button class="btn sm" onclick="openReport(\''+dShift(ws,-7)+'\')">‹</button>'+

    '<button class="btn sm" onclick="openReport(\''+dShift(ws,7)+'\')" '+(ws>=curWk?'disabled style="opacity:.35"':'')+'>›</button></div>';
  h+=sect('Training')+
    row('Workouts', cur.ses, dif(cur.ses,prv.ses,''))+
    (adh.planned? row('Plan adherence', adh.done+' / '+adh.planned,'') : '')+
    (adh.brk? row('Planned break days', adh.brk,'') : '')+
    row('Volume', Math.round(cur.vol).toLocaleString()+' '+unit(), dif(Math.round(cur.vol),Math.round(prv.vol),''))+
    row('Time training', Math.round(cur.dur/60)+' min','')+
    row('New PRs', cur.pr,'')+
    (gtxt? '<div class="tiny muted num" style="padding:8px 2px">Working sets: '+gtxt+'</div>' : '');
  h+=sect('Cardio & steps')+
    row('Distance', cur.km+' km', dif(cur.km,prv.km,' km'))+
    row('Steps', cur.steps.toLocaleString(), dif(cur.steps,prv.steps,''))+
    row('Step-goal days', cur.stHit+' / 7','');
  h+=sect('Sleep')+
    row('Average', cur.slN? cur.sleep+' h':'—', dif(cur.sleep,prv.sleep,' h'))+
    row('Nights logged', cur.slN+' / 7','');
  h+=sect('Nutrition & water')+
    row('Avg calories', cur.fdN? cur.kcal+' kcal':'—', dif(cur.kcal,prv.kcal,''))+
    row('Avg protein', cur.fdN? cur.prot+' g':'—', dif(cur.prot,prv.prot,' g'))+
    row('Water goal days', cur.waHit+' / 7','')+
    row('Avg water', cur.water? Math.round(cur.water/100)/10+' L':'—','');

function lineChartSVG(data,color){ /* data=[{d:iso,y:num}] chronological */
  const W=372,H=118,PL=36,PR=12,PT=12,PB=18;
  const ys=data.map(function(p){return p.y;});
  let mn=Math.min.apply(null,ys), mx=Math.max.apply(null,ys);
  const span=(mx-mn)||1; mn-=span*0.15; mx+=span*0.15;
  const X=function(i){ return PL+(W-PL-PR)*(data.length===1?0.5:i/(data.length-1)); };
  const Y=function(v){ return PT+(H-PT-PB)*(1-(v-mn)/(mx-mn)); };
  const pts=data.map(function(p,i){ return X(i)+','+Y(p.y); }).join(' ');
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto">';
  [0.3,0.7].forEach(function(f){
    const y=PT+(H-PT-PB)*f, v=Math.round(mx-(mx-mn)*f);
    s+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'+
       '<text x="'+(PL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+v+'</text>';
  });
  s+='<polygon points="'+X(0)+','+(H-PB)+' '+pts+' '+X(data.length-1)+','+(H-PB)+'" fill="'+color+'" opacity="0.12"/>';
  s+='<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  s+='<circle cx="'+X(data.length-1)+'" cy="'+Y(data[data.length-1].y)+'" r="4.5" fill="'+color+'" stroke="var(--surface)" stroke-width="2"/>';
  s+='<text x="'+PL+'" y="'+(H-4)+'" font-size="10" fill="var(--ink3)">'+fmtD(data[0].d)+'</text>';
  s+='<text x="'+(W-PR)+'" y="'+(H-4)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+fmtD(data[data.length-1].d)+'</text>';
  return s+'</svg>';
}
function barChartSVG(items,color){ /* items=[{l:label,y:num}] */
  const W=372,H=132,PB=20,PT=16;
  const mx=Math.max.apply(null,items.map(function(i){return i.y;}))||1;
  const n=items.length, gap=6, bw=(W-12)/n-gap;
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto">';
  items.forEach(function(it,i){
    const bh=Math.max(2,(H-PT-PB)*it.y/mx), x=6+i*(bw+gap), y=H-PB-bh;
    const last=i===n-1;
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+color+'" opacity="'+(last?1:0.55)+'"/>';
    if(last||it.y===mx) s+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="10" fill="var(--ink2)">'+(it.y>=1000? Math.round(it.y/100)/10+'k' : Math.round(it.y))+'</text>';
  });
  s+='<line x1="4" y1="'+(H-PB)+'" x2="'+(W-4)+'" y2="'+(H-PB)+'" stroke="var(--line)" stroke-width="1.5"/>';
  s+='<text x="6" y="'+(H-5)+'" font-size="10" fill="var(--ink3)">'+items[0].l+'</text>';
  s+='<text x="'+(W-6)+'" y="'+(H-5)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+items[n-1].l+'</text>';
  return s+'</svg>';
}

function cardioBest(exId){
  let km=0, pace=null;
  S.sessions.forEach(function(s){ s.ex.forEach(function(e){
    if(e.exId!==exId) return;
    e.sets.forEach(function(t){
      const d=+t.w||0, m=+t.r||0;
      if(d>km) km=d;
      if(d>=0.4 && m>0){ const p=m/d; if(pace===null||p<pace) pace=p; }
    });
  });});
  if(!km) return null;
  let ptxt='—';
  if(pace!==null){ const pm=Math.floor(pace); ptxt=pm+':'+pad(Math.round((pace-pm)*60)); }
  return {km:km, pace:ptxt};
}

  S.sessions.forEach(function(s){ s.ex.forEach(function(e){
    if(e.exId!==exId) return;
    e.sets.forEach(function(t){
      if(t.wu) return;

function progressHTML(){

  const wkStart=wkMonday(today());
  const bars=[];
  for(let i=9;i>=0;i--){
    const ws=dShift(wkStart,-7*i), we=dShift(ws,6);
    let v=0;
    S.sessions.forEach(function(s){ if(s.date>=ws && s.date<=we) v+=s.vol||0; });

    bars.push({l:dd.getDate()+'/'+(dd.getMonth()+1), y:Math.round(v)});
  }

  });});

    const series=[];

  });
  if(!topIds.length) h+='<div class="card"><div class="empty">Charts appear once a lift has 3+ logged sessions.</div></div>';

function finishSession(){
  const a=S.active;
  a.ex=a.ex.filter(function(e){ return e.sets.some(function(s){ return s.done||s.w||s.r; }); });
  if(!a.ex.length){ toast('Nothing logged — discarding'); S.active=null; save(); WV='home'; renderWorkout(); return; }
  let vol=0, nSets=0;
  const prs=[];
  a.ex.forEach(function(e){
    e.sets=e.sets.filter(function(s){return s.w||s.r;});
    const g=exGroupOf(e.exId), lift=(g!=='Cardio'&&g!=='Mobility');
    /* bests before this session (warm-ups never count) */
    let bw=0, b1=0;
    if(lift) S.sessions.forEach(function(s){
      const pe=s.ex.find(function(x){return x.exId===e.exId;}); if(!pe) return;
      pe.sets.forEach(function(t){ if(t.wu) return;
        const w=+t.w||0, est=est1RM(t.w,t.r);
        if(w>bw) bw=w; if(est>b1) b1=est; });
    });
    let exPR=null;
    e.sets.forEach(function(s){
      nSets++;
      if(g==='Cardio'||s.wu) return;
      const w=+s.w||0, r=+s.r||0, est=est1RM(w,r);
      vol+=w*r;
      if(!lift) return;
      if(bw>0 && w>bw){ exPR={ex:exName(e.exId), txt:w+'×'+r+' — heaviest ever'}; bw=w; }
      else if(b1>0 && est>b1 && !exPR){ exPR={ex:exName(e.exId), txt:w+'×'+r+' — est 1RM '+Math.round(est)+' '+unit()}; b1=est; }
    });
    if(exPR) prs.push(exPR);
  });
  const dur=Math.round((Date.now()-a.start)/1000);
  const sess={id:a.id, name:a.name, date:a.date, dur:dur, vol:vol, ex:a.ex, prs:prs};
  if(a.note) sess.note=a.note;
  S.sessions.push(sess);
  S.sessions.sort(function(x,y){ return x.date<y.date?-1:1; });
  S.active=null; save(); WV='home'; renderWorkout();
  const total=S.sessions.length;
  if(total%10===0) setTimeout(function(){ toast('🏅 Workout #'+total+' all-time — consistency compounds'); }, 600);
  const showSummary=function(){ openSheet(summaryHTML); };
  const summaryHTML='<h3>Workout complete 💪</h3>'+
    '<div class="row" style="gap:18px; margin-bottom:8px">'+
    '<div><div class="big num" style="font-size:24px">'+Math.round(dur/60)+'m</div><div class="tiny muted">duration</div></div>'+
    '<div><div class="big num" style="font-size:24px">'+Math.round(vol).toLocaleString()+'</div><div class="tiny muted">'+unit()+' volume</div></div>'+
    '<div><div class="big num" style="font-size:24px">'+nSets+'</div><div class="tiny muted">sets</div></div>'+
    '<div><div class="big num" style="font-size:24px">'+(prs.length||'—')+'</div><div class="tiny muted">PRs</div></div></div>'+
    (prs.length
      ? prs.map(function(p){ return '<div class="listrow"><span class="small">🏆 '+esc(p.ex)+'</span><span class="small num muted">'+p.txt+'</span></div>'; }).join('')
      : '<p class="small muted">No records today — showing up is the base of every PR.</p>')+
    '<div class="field" style="margin-top:14px"><label for="sesNote">Note (optional)</label>'+
    '<textarea id="sesNote" rows="2" placeholder="How did it feel? Knee/wrist okay?"></textarea></div>'+
    '<button class="btn primary wide" onclick="saveSesNote(\''+sess.id+'\')">Done</button>';
  if(prs.length) prCelebrate(prs, showSummary); else showSummary();
}

    const c=['#ffc76e','#f2a03d','#f08a2b','#4fc98a'][i%4];

  }

       '<button class="btn sm danger" onclick="delSession(\''+s.id+'\')">Delete</button></div></details>';

}

function editSession(id){
  if(S.active){ toast('Finish or discard the current session first'); return; }

function openExInfo(exId){
  const name=exName(exId), g=exGroupOf(exId);
  let h='<h3>'+esc(name)+'</h3><div class="tiny muted" style="margin:-8px 0 12px">'+esc(g)+'</div>';
  const pat=patternOf(name,g);
  const im=(window.EXIMG||{})[name];
  if(im){
    h+='<div id="exImgWrap"><div class="pcompare" style="background:#fff; border-radius:12px; padding:6px">'+
      '<img src="img/ex/'+im+'_0.jpg" alt="start position" onerror="exImgAlt()">'+
      '<img src="img/ex/'+im+'_1.jpg" alt="finish position" onerror="exImgAlt()"></div>'+
      '<div class="tiny muted" style="text-align:center; margin:6px 0 12px">start → finish</div></div>'+
      (pat&&PATTERNS[pat] ? '<div id="exSvgWrap" style="display:none">'+patternSVG(pat)+'</div>' : '');
  } else if(pat && PATTERNS[pat]) h+=patternSVG(pat);
  if(CUES[name]) h+='<p class="small" style="margin-bottom:12px; color:var(--ink2)">💡 '+CUES[name]+'</p>';
  const steps=PATTERN_STEPS[pat];
  if(steps) h+='<ol class="small" style="margin:0 0 12px 20px; color:var(--ink2)">'+steps.map(function(s){return '<li style="margin-bottom:4px">'+s+'</li>';}).join('')+'</ol>';
  h+='<a class="btn wide" style="margin-bottom:14px; text-decoration:none" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(name+' how to proper form')+'">▶ Watch form videos</a>';
  if(g==='Cardio'){
    const cb=cardioBest(exId);
    h+= cb
      ? '<div class="listrow"><span class="small">Longest distance</span><span class="small num"><b>'+cb.km+' km</b></span></div>'+
        '<div class="listrow"><span class="small">Best pace</span><span class="small num"><b>'+cb.pace+'</b> /km</span></div>'
      : '<div class="empty">No logs yet.</div>';
  } else {
    let bw=null, b1=null, bv=0;
    S.sessions.forEach(function(s){ s.ex.forEach(function(e){
      if(e.exId!==exId) return;
      let sv=0;
      e.sets.forEach(function(t){
        if(t.wu) return;
        const w=+t.w||0, r=+t.r||0, est=est1RM(w,r); sv+=w*r;
        if(!bw||w>bw.w) bw={w:w, r:r, date:s.date};
        if(!b1||est>b1.est) b1={w:w, r:r, est:est, date:s.date};
      });
      if(sv>bv) bv=sv;
    });});
    h+= bw
      ? '<div class="listrow"><span class="small">Heaviest weight</span><span class="small num"><b>'+bw.w+' '+unit()+'</b> × '+bw.r+' <span class="muted">'+fmtD(bw.date)+'</span></span></div>'+
        '<div class="listrow"><span class="small">Best est 1RM</span><span class="small num"><b>'+Math.round(b1.est)+' '+unit()+'</b> <span class="muted">('+b1.w+'×'+b1.r+')</span></span></div>'+
        '<div class="listrow"><span class="small">Best session volume</span><span class="small num"><b>'+Math.round(bv).toLocaleString()+'</b> '+unit()+'</span></div>'
      : '<div class="empty">No logs yet — records appear after your first sets.</div>';
  }
  /* strength trend */
  if(g!=='Cardio' && g!=='Mobility'){
    const series=[];
    S.sessions.forEach(function(s){
      const e=s.ex.find(function(x){return x.exId===exId;}); if(!e) return;
      let best=0;
      e.sets.forEach(function(t){ if(t.wu) return; const est=est1RM(t.w,t.r); if(est>best) best=est; });
      if(best>0) series.push({d:s.date, y:Math.round(best)});
    });
    if(series.length>=3){
      h+='<div class="tiny muted" style="margin:14px 0 4px; font-weight:700; letter-spacing:.07em; text-transform:uppercase">Est 1RM trend</div>'+
         lineChartSVG(series.slice(-15),'var(--wk)');
    }
  }
  /* recent appearances */
  const rec=[];
  for(let i=S.sessions.length-1; i>=0 && rec.length<5; i--){
    const s=S.sessions[i], e=s.ex.find(function(x){return x.exId===exId;});
    if(e) rec.push({date:s.date, line:e.sets.map(function(t){return (t.wu?'W ':'')+fmtSet(t,g);}).join('  ')});
  }
  if(rec.length){
    h+='<div class="tiny muted" style="margin:14px 0 2px; font-weight:700; letter-spacing:.07em; text-transform:uppercase">Recent</div>';
    rec.forEach(function(r){ h+='<div class="listrow"><span class="tiny muted">'+fmtD(r.date)+'</span><span class="small num">'+r.line+'</span></div>'; });
  }
  openSheet(h);
}
function plates(){
  const target=+$('#plW').value, bar=+$('#plBar').value;
  const out=$('#plOut');
  if(!target){ out.textContent='Enter a target weight first.'; return; }
  if(target<bar){ out.textContent='Target is lighter than the bar.'; return; }
  const AVAIL=[25,20,15,10,5,2.5,1.25];
  let side=(target-bar)/2, picked=[];
  AVAIL.forEach(function(p){ while(side>=p-0.001){ picked.push(p); side-=p; } });
  const loaded=target-side*2;
  out.innerHTML = picked.length
    ? '<b>Per side:</b> '+picked.join(' + ')+' kg'+
      (side>0.001? '<div class="tiny muted" style="margin-top:4px">Closest loadable: '+loaded+' kg (off by '+Math.round(side*2*100)/100+')</div>':'')
    : '<b>Empty bar</b> — '+bar+' kg total.';
}

function restTick(){
  const left=Math.max(0, restEnd-Date.now());
  const s=Math.ceil(left/1000);
  $('#restClock').textContent = Math.floor(s/60)+':'+pad(s%60);
  $('#restBar').style.width = (restTotal? (left/1000)/restTotal*100 :0)+'%';
  if(s!==restLastS){
    restLastS=s;
    if(s<=5 && s>0){ vib(140); $('#restClock').style.color='var(--wk)'; }
    else $('#restClock').style.color='';
  }
  if(left<=0){
    clearInterval(restInt); restInt=null;
    beep(3); vib([300,100,300]); notify('Rest over','Next set!');
    setTimeout(function(){ $('#rest').classList.remove('on'); }, 1200);

}

let swRun=false, swAcc=0, swT0=0, swInt=null, swLapsArr=[];
function swFmt(ms){
  const t=Math.floor(ms/100), d=t%10, s=Math.floor(t/10)%60, m=Math.floor(t/600);
  return pad(m)+':'+pad(s)+'.'+d;
}
function swToggle(){
  if(swRun){ swAcc+=Date.now()-swT0; swRun=false; clearInterval(swInt); $('#swMain').textContent='Start'; }
  else{ swT0=Date.now(); swRun=true; swInt=setInterval(swDraw,100); $('#swMain').textContent='Pause'; }
}
function swNow(){ return swAcc + (swRun? Date.now()-swT0 :0); }
function swDraw(){ $('#swClock').textContent=swFmt(swNow()); }
function swLap(){
  if(!swRun && swNow()===0) return;
  swLapsArr.unshift(swNow());
  $('#swLaps').innerHTML=swLapsArr.map(function(t,i){
    const prev=swLapsArr[i+1]||0;
    return '<div class="listrow"><span class="tiny muted">Lap '+(swLapsArr.length-i)+'</span><span class="small num">'+swFmt(t-prev)+' <span class="muted">· '+swFmt(t)+'</span></span></div>';
  }).join('');
}
function swReset(){ swRun=false; clearInterval(swInt); swAcc=0; swLapsArr=[];
  $('#swClock').textContent='00:00.0'; $('#swLaps').innerHTML=''; $('#swMain').textContent='Start'; }

/* ============ HIIT ============ */
let hi={run:false, phase:'ready', round:0, end:0, int:null};
function hiToggle(){
  if(hi.run){ hi.pauseLeft=hi.end-Date.now(); hi.run=false; clearInterval(hi.int); $('#hiMain').textContent='Resume'; return; }
  if(hi.phase==='ready'||hi.phase==='done'){
    hi.phase='work'; hi.round=1; hi.end=Date.now()+(+$('#hiWork').value||30)*1000; beep(1);
    S.settings.hiit={w:+$('#hiWork').value||40, r:+$('#hiRest').value||20, n:+$('#hiRounds').value||8}; save();
  }
  else if(hi.pauseLeft){ hi.end=Date.now()+hi.pauseLeft; hi.pauseLeft=0; }
  hi.run=true; $('#hiMain').textContent='Pause';
  clearInterval(hi.int); hi.int=setInterval(hiTick,150); hiTick();
}
function hiTick(){
  const W=+$('#hiWork').value||30, R=+$('#hiRest').value||0, N=+$('#hiRounds').value||1;
  const left=hi.end-Date.now();
  if(left<=0){
    if(hi.phase==='work'){
      if(hi.round>=N && R===0){ return hiDone(); }
      if(R>0){ hi.phase='rest'; hi.end=Date.now()+R*1000; beep(2); vib(200); }
      else { hi.round++; hi.end=Date.now()+W*1000; beep(1); }
    } else { /* rest over */
      if(hi.round>=N){ return hiDone(); }
      hi.round++; hi.phase='work'; hi.end=Date.now()+W*1000; beep(1); vib(100);
    }
  }
  const s=Math.ceil(Math.max(0,hi.end-Date.now())/1000);
  $('#hiClock').textContent=Math.floor(s/60)+':'+pad(s%60);
  $('#hiClock').style.color = hi.phase==='work' ? 'var(--wk)' : 'var(--wa)';
  $('#hiPhase').textContent = (hi.phase==='work'?'WORK':'REST')+' · round '+hi.round+' of '+N;
}
function hiDone(){
  clearInterval(hi.int); hi.run=false; hi.phase='done';
  $('#hiClock').textContent='Done'; $('#hiClock').style.color='var(--good)';
  $('#hiPhase').textContent='All rounds complete';
  $('#hiMain').textContent='Start';
  beep(4); vib([400,120,400]); notify('HIIT complete','Nice work.');
}
function hiReset(){ clearInterval(hi.int); hi={run:false,phase:'ready',round:0,end:0,int:null};
  $('#hiClock').textContent='Ready'; $('#hiClock').style.color='';
  $('#hiPhase').textContent=($('#hiWork').value||40)+'s work · '+($('#hiRest').value||20)+'s rest · '+($('#hiRounds').value||8)+' rounds';
  $('#hiMain').textContent='Start'; }

let FDMEAL='s', FDRES=[], FDITEM=null, FDQ='';
function fdbAllFoods(){
  return FOODDB.map(function(f){ return {name:f[0], kcal:f[1], p:f[2], c:f[3], f:f[4]}; })
    .concat((S.myFoods||[]).map(function(m){ return {name:m.name, kcal:m.kcal, p:m.p, c:m.c, f:m.f, mine:true, id:m.id}; }));
}
function fdbSearch(q){
  FDQ=(q||'').trim();
  const box=$('#fdbRes'); FDITEM=null; $('#fdbSel').innerHTML='';
  if(!FDQ){ box.innerHTML=''; return; }
  const toks=FDQ.toLowerCase().split(/\s+/);
  FDRES=fdbAllFoods().filter(function(f){
    const n=f.name.toLowerCase();
    return toks.every(function(t){ return n.indexOf(t)>-1; });
  }).slice(0,8);
  box.innerHTML = FDRES.map(function(f,i){
    return '<div class="listrow" style="cursor:pointer" onclick="fdbPick('+i+')"><span class="small">'+esc(f.name)+
      (f.mine? ' <span class="tiny" style="color:var(--wk)">★ mine</span>':'')+'</span>'+
      '<span class="row" style="gap:8px"><span class="tiny muted num">'+f.kcal+' kcal · P'+f.p+'</span>'+
      (f.mine? '<button class="btn ghost sm danger" onclick="event.stopPropagation();delMyFood(\''+f.id+'\')">✕</button>':'')+'</span></div>';
  }).join('')
  + '<div class="tiny" style="padding:8px 2px"><a href="#" style="color:var(--wk)" onclick="myFoodForm();return false">＋ Not here? Save “'+esc(FDQ)+'” as my food</a></div>';
}
function fdbPick(i){
  FDITEM=FDRES[i]; if(!FDITEM) return;
  $('#fdbRes').innerHTML='';
  $('#fdbSel').innerHTML='<div class="card" style="background:var(--raised); margin:8px 0 4px"><b class="small">'+esc(FDITEM.name)+'</b>'+
    '<div class="tiny muted num" style="margin:2px 0 10px">'+FDITEM.kcal+' kcal · P '+FDITEM.p+' · C '+FDITEM.c+' · F '+FDITEM.f+' (per unit)</div>'+
    '<div class="row"><span class="small">Quantity</span><input id="fdbQty" type="number" inputmode="decimal" value="1" min="0.5" step="0.5" style="max-width:90px; text-align:center">'+
    '<button class="btn food grow" onclick="fdbAdd()">Add</button></div></div>';
}
function fdbAdd(){
  const f=FDITEM; if(!f) return;
  const n=Math.max(0.5, +$('#fdbQty').value||1);
  const e={id:uid(), name:(n!==1? n+'× ':'')+f.name, kcal:Math.round(f.kcal*n), p:Math.round(f.p*n*10)/10, c:Math.round(f.c*n*10)/10, f:Math.round(f.f*n*10)/10};
  const day=S.food[foodDate]=S.food[foodDate]||{};
  (day[FDMEAL]=day[FDMEAL]||[]).push(e);

}

function saveMyFood(){
  const name=$('#mfName').value.trim(), k=+$('#mfK').value||0;
  if(!name){ toast('Name it first'); return; }
  if(!k){ toast('Calories needed — even a rough guess beats a blank'); return; }
  const m={id:uid(), name:name, kcal:k, p:+$('#mfP').value||0, c:+$('#mfC').value||0, f:+$('#mfF').value||0};
  S.myFoods.push(m); save();
  addFoodForm(FDMEAL);
  $('#fdbQ').value=name; fdbSearch(name);
  const idx=FDRES.findIndex(function(f){return f.id===m.id;});
  if(idx>-1) fdbPick(idx);
  toast('Saved to My Foods ★');
}
function delMyFood(id){
  if(!confirm('Remove this from My Foods? (Already-logged entries keep their data.)')) return;
  S.myFoods=S.myFoods.filter(function(m){return m.id!==id;});

function quickAdd(meal,qid){

function delFood(meal,id){

function weightChart(ws){
  const data=ws.slice(-30);
  const W=396, H=140, PL=34, PR=12, PT=12, PB=20;
  let mn=Math.min.apply(null,data.map(function(d){return d.kg;}));
  let mx=Math.max.apply(null,data.map(function(d){return d.kg;}));
  const goal=+S.settings.goalWeight||null;
  if(goal){ mn=Math.min(mn,goal); mx=Math.max(mx,goal); }
  const span=(mx-mn)||1; mn-=span*0.12; mx+=span*0.12;
  const X=function(i){ return PL+(W-PL-PR)*(data.length===1?0.5:i/(data.length-1)); };
  const Y=function(v){ return PT+(H-PT-PB)*(1-(v-mn)/(mx-mn)); };
  let pts=data.map(function(d,i){ return X(i)+','+Y(d.kg); }).join(' ');
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto; margin-top:12px" role="img" aria-label="Weight trend, last '+data.length+' entries">';
  /* faint grid: 3 lines */
  [0.25,0.5,0.75].forEach(function(f){
    const y=PT+(H-PT-PB)*f, v=Math.round((mx-(mx-mn)*f)*10)/10;
    svg+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'+
      '<text x="'+(PL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="var(--ink3)" style="font-variant-numeric:tabular-nums">'+v+'</text>';
  });
  if(goal){
    svg+='<line x1="'+PL+'" y1="'+Y(goal)+'" x2="'+(W-PR)+'" y2="'+Y(goal)+'" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/>'+
      '<text x="'+(W-PR)+'" y="'+(Y(goal)-4)+'" text-anchor="end" font-size="10" fill="var(--good)">goal '+goal+'</text>';
  }
  /* area + line */
  svg+='<polygon points="'+X(0)+','+(H-PB)+' '+pts+' '+X(data.length-1)+','+(H-PB)+'" fill="var(--bd)" opacity="0.13"/>';
  svg+='<polyline points="'+pts+'" fill="none" stroke="var(--bd)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  /* endpoint emphasized */
  const lx=X(data.length-1), ly=Y(data[data.length-1].kg);
  svg+='<circle cx="'+lx+'" cy="'+ly+'" r="4.5" fill="var(--bd)" stroke="var(--surface)" stroke-width="2"/>';
  /* x labels: first + last */
  svg+='<text x="'+PL+'" y="'+(H-5)+'" font-size="10" fill="var(--ink3)">'+fmtD(data[0].date)+'</text>';
  svg+='<text x="'+(W-PR)+'" y="'+(H-5)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+fmtD(data[data.length-1].date)+'</text>';
  svg+='</svg>';
  return svg;
}
function addWeight(){
  const kg=+$('#wKg').value, date=$('#wDate').value||today();
  if(!kg){ toast('Enter your weight'); return; }
  S.weights=S.weights.filter(function(w){return w.date!==date;});
  S.weights.push({date:date, kg:kg});
  save(); renderBody(); toast('Logged '+kg+' '+unit());
}
function delWeight(date){ S.weights=S.weights.filter(function(w){return w.date!==date;}); save(); renderBody(); }

/* ============ progress photos ============ */
function addPhoto(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=function(){
    const img=new Image();
    img.onload=function(){
      const MAX=720;
      let w=img.width, h=img.height;
      const sc=Math.min(1, MAX/Math.max(w,h));
      w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const data=c.toDataURL('image/jpeg',0.72);
      const entry={id:uid(), date:today(), data:data};
      S.photos.push(entry);
      try{
        localStorage.setItem(K, JSON.stringify(S));
        renderBody(); toast('Photo saved ('+Math.round(data.length/1365)+' KB)');
      }catch(e){
        S.photos.pop();
        toast('Storage full — delete old photos or export a backup first');
      }
    };
    img.onerror=function(){ toast('Could not read that image'); };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
  inp.value='';
}
function viewPhoto(id){
  const p=S.photos.find(function(x){return x.id===id;}); if(!p) return;
  openSheet('<h3>'+fmtD(p.date)+'</h3>'+
    '<img src="'+p.data+'" alt="progress photo" style="width:100%; border-radius:12px">'+
    '<button class="btn danger wide" style="margin-top:12px" onclick="delPhoto(\''+p.id+'\')">Delete photo</button>');
}
function delPhoto(id){
  if(!confirm('Delete this photo?')) return;
  S.photos=S.photos.filter(function(p){return p.id!==id;});
  save(); closeSheet(); renderBody();
}
function comparePhotos(){
  const ph=S.photos; if(ph.length<2) return;
  const a=ph[0], b=ph[ph.length-1];
  const days=Math.round((new Date(b.date+'T12:00:00')-new Date(a.date+'T12:00:00'))/86400000);
  openSheet('<h3>Then vs now</h3><p class="tiny muted" style="margin:-6px 0 12px">'+days+' days apart</p>'+
    '<div class="pcompare">'+
    '<div><img src="'+a.data+'" alt="first photo"><div class="tiny muted" style="margin-top:4px">'+fmtD(a.date)+'</div></div>'+
    '<div><img src="'+b.data+'" alt="latest photo"><div class="tiny muted" style="margin-top:4px">'+fmtD(b.date)+'</div></div>'+
    '</div>');
}

/* ============ SETTINGS ============ */
function openSettings(){
  const st=S.settings;
  const notifState = !('Notification' in window) ? 'unsupported' : Notification.permission;
  openSheet('<h3>Settings</h3>'+
    '<div class="field"><label for="sName">Your name</label><input id="sName" value="'+esc(st.name)+'" placeholder="How should I greet you?"></div>'+
    '<div class="fields2">'+
    '<div class="field"><label for="sUnit">Weight unit</label><select id="sUnit"><option'+(st.unit==='kg'?' selected':'')+'>kg</option><option'+(st.unit==='lb'?' selected':'')+'>lb</option></select></div>'+
    '<div class="field"><label for="sHeight">Height (cm, for BMI)</label><input id="sHeight" type="number" inputmode="numeric" value="'+esc(st.height)+'" placeholder="e.g. 175"></div></div>'+
    '<div class="fields2">'+
    '<div class="field"><label for="sWater">Water goal (ml/day)</label><input id="sWater" type="number" inputmode="numeric" value="'+st.waterGoal+'"></div>'+
    '<div class="field"><label for="sRest">Default rest (seconds)</label><input id="sRest" type="number" inputmode="numeric" value="'+st.rest+'"></div></div>'+
    '<div class="fields2">'+
    '<div class="field"><label for="sCal">Calorie goal</label><input id="sCal" type="number" inputmode="numeric" value="'+st.calGoal+'"></div>'+
    '<div class="field"><label for="sProt">Protein goal (g)</label><input id="sProt" type="number" inputmode="numeric" value="'+st.proteinGoal+'"></div></div>'+
    '<div class="fields2">'+
    '<div class="field"><label for="sCarb">Carb goal (g)</label><input id="sCarb" type="number" inputmode="numeric" value="'+st.carbGoal+'"></div>'+
    '<div class="field"><label for="sFat">Fat goal (g)</label><input id="sFat" type="number" inputmode="numeric" value="'+st.fatGoal+'"></div></div>'+
    '<div class="field"><label for="sGoalW">Goal weight ('+st.unit+', shows on chart)</label><input id="sGoalW" type="number" inputmode="decimal" value="'+esc(st.goalWeight)+'" placeholder="optional"></div>'+
    '<hr style="border:0;border-top:1px solid var(--line); margin:14px 0">'+
    '<label class="row small" style="gap:8px; cursor:pointer; margin-bottom:10px"><input type="checkbox" id="sWaterRemind" '+(st.waterRemind?'checked':'')+' style="width:20px;height:20px;accent-color:var(--wa)">Water reminders (while app is open)</label>'+
    '<div class="fields2">'+
    '<div class="field"><label for="sWaterEvery">Remind every (min)</label><input id="sWaterEvery" type="number" inputmode="numeric" value="'+st.waterEvery+'"></div>'+
    '<div class="field"><label for="sWkRemind">Workout reminder time</label><input id="sWkRemind" type="time" value="'+esc(st.workoutRemind)+'"></div></div>'+
    '<div class="fields2">'+
    '<div class="field"><label for="sSlRemind">Sleep wind-down time</label><input id="sSlRemind" type="time" value="'+esc(st.sleepRemind)+'"></div>'+
    '<div class="field"><label for="sSlGoal">Sleep goal (hours)</label><input id="sSlGoal" type="number" inputmode="decimal" step="0.5" value="'+(+st.sleepGoal||8)+'"></div></div>'+
    '<div class="field"><label for="sStpGoal">Step goal (per day)</label><input id="sStpGoal" type="number" inputmode="numeric" value="'+(+st.stepGoal||8000)+'"></div>'+
    '<div class="tiny muted" style="font-weight:700; letter-spacing:.07em; text-transform:uppercase; margin:14px 0 8px">Custom daily reminders</div>'+
    ((S.reminders&&S.reminders.length)
      ? S.reminders.map(function(r){ return '<div class="listrow"><span class="small">'+esc(r.label)+' <span class="muted num">· '+r.time+(r.date?' · once on '+fmtD(r.date):' daily')+'</span></span><button class="btn ghost sm danger" onclick="delReminder(\''+r.id+'\')">✕</button></div>'; }).join('')
      : '<p class="tiny muted" style="margin-bottom:6px">e.g. “Creatine” at 09:00, “Casein shake” at 22:45, “Stretch break” at 17:00</p>')+
    '<div class="field" style="margin:8px 0 0"><input id="remLabel" placeholder="Reminder name"></div>'+
    '<div class="row" style="margin:8px 0 12px"><input id="remTime" type="time" value="09:00" style="max-width:120px"><input id="remDate" type="date" style="max-width:160px" title="leave empty for daily"><button class="btn sm" onclick="addReminder()">Add</button></div>'+
    '<p class="tiny muted" style="margin:-6px 0 12px">Leave the date empty for a daily reminder; set it for a one-time reminder.</p>'+
    (notifState!=='granted' && notifState!=='unsupported'
      ? '<button class="btn wide" style="margin-bottom:10px" onclick="askNotify()">Allow notifications</button>' : '')+
    (notifState==='granted' ? '<p class="tiny muted" style="margin-bottom:10px">Notifications: allowed ✓ (they fire while the app is open)</p>':'')+
    '<button class="btn wide" style="margin-bottom:10px" onclick="notify(\'Test notification 🔔\',\'This is exactly how reminders will look and sound.\', true)">Send test notification</button>'+
    '<button class="btn primary wide" onclick="saveSettings()">Save settings</button>'+
    '<hr style="border:0;border-top:1px solid var(--line); margin:16px 0">'+
    '<div class="row" style="gap:10px"><button class="btn grow" onclick="exportData()">Export backup</button>'+
    '<label class="btn grow" style="cursor:pointer">Import<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div>'+
    '<button class="btn danger wide" style="margin-top:10px" onclick="resetAll()">Erase all data</button>'+
    '<p class="tiny muted" style="margin-top:14px">All data lives only on this device (browser storage). Export a backup now and then.</p>');
}
function addReminder(){
  const label=$('#remLabel').value.trim(), time=$('#remTime').value;
  if(!label || !time){ toast('Give the reminder a name and a time'); return; }
  collectSettings();
  const date=$('#remDate')?$('#remDate').value:'';
  const r={id:uid(), label:label, time:time};
  if(date) r.date=date;
  S.reminders.push(r);
  save(); openSettings(); toast('Reminder added — '+time+(date?' on '+fmtD(date):' daily'));
}
function delReminder(id){
  collectSettings();
  S.reminders=S.reminders.filter(function(r){ return r.id!==id; });
  save(); openSettings();
}
function saveSettings(){
  collectSettings();
  save(); closeSheet(); render(); toast('Saved');
  const st=S.settings;
  if(st.waterRemind && ('Notification' in window) && Notification.permission==='default') askNotify();
}
function collectSettings(){
  const st=S.settings;
  st.name=$('#sName').value.trim(); st.unit=$('#sUnit').value;
  st.height=$('#sHeight').value; st.waterGoal=+$('#sWater').value||3000;
  st.rest=+$('#sRest').value||90; st.calGoal=+$('#sCal').value||2200;
  st.proteinGoal=+$('#sProt').value||130; st.carbGoal=+$('#sCarb').value||250; st.fatGoal=+$('#sFat').value||70;
  st.goalWeight=$('#sGoalW').value;
  st.waterRemind=$('#sWaterRemind').checked; st.waterEvery=Math.max(10,+$('#sWaterEvery').value||60);
  st.workoutRemind=$('#sWkRemind').value;
  st.sleepRemind=$('#sSlRemind').value; st.sleepGoal=+$('#sSlGoal').value||8;
  st.stepGoal=+$('#sStpGoal').value||8000;
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='coachz-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  S.lastBackup=today(); save();
  toast('Backup downloaded');
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=function(){
    try{
      const d=JSON.parse(rd.result);
      if(!d.settings || !d.exercises) throw 0;
      S=Object.assign(defaults(), d);
      /* same normalization as boot: fill any settings keys the backup predates */
      S.settings=Object.assign(defaults().settings, S.settings||{});
      save(); closeSheet(); render(); toast('Backup restored');
    }catch(e){ toast('That file is not a CoachZ backup'); }
  };
  rd.readAsText(f);
}
function resetAll(){
  if(!confirm('Erase ALL data? This cannot be undone.')) return;
  if(!confirm('Really sure? Export a backup first if in doubt.')) return;
  S=defaults(); save(); closeSheet(); go('today'); toast('Fresh start');
}

/* ============ reminders engine ============ */
let lastDrinkTs=Date.now(), lastRemindTs=0, wkRemindedOn='', slRemindedOn='', spRemindedOn='', remFiredOn={};
setInterval(function(){
  const st=S.settings, now=new Date(), hr=now.getHours();
  const hm=pad(hr)+':'+pad(now.getMinutes());
  if(st.sleepRemind && slRemindedOn!==today() && hm===st.sleepRemind){
    slRemindedOn=today();
    notify('Wind down 🌙','In bed by 11pm — sleep is where the muscle gets built.', true);
  }
  (S.reminders||[]).forEach(function(r){
    if(r.date && r.date!==today()) return;
    if(remFiredOn[r.id]===today() || hm!==r.time) return;
    remFiredOn[r.id]=today();
    notify('⏰ '+r.label,'', true);
    if(r.date){ S.reminders=S.reminders.filter(function(x){return x.id!==r.id;}); save(); }
  });
  if(spRemindedOn!==today() && hm==='21:00'){
    spRemindedOn=today();
    const missed=S.supps.filter(function(sp){ return !(S.suppLog[today()]||{})[sp.id]; })
      .map(function(sp){ return sp.name.split(' — ')[0]; });
    if(!S.steps[today()]) missed.push('today’s steps');
    if(missed.length) notify('Evening check ✅', missed.join(', '), true);
  }
  if(st.waterRemind && hr>=8 && hr<22){
    const since=Date.now()-Math.max(lastDrinkTs,lastRemindTs);
    if(since > st.waterEvery*60000){
      lastRemindTs=Date.now();
      const left=Math.max(0, st.waterGoal-waterToday());
      notify('Time to drink water 💧', left>0 ? Math.round(left/1000*10)/10+'L to go today' : 'Goal already met — sip anyway', true);
    }
  }
  if(st.workoutRemind && wkRemindedOn!==today()){
    if(hm===st.workoutRemind && !S.sessions.some(function(s){return s.date===today();})){
      wkRemindedOn=today();
      const prt=todaysPlanRoutine();
      notify('Workout time 🏋️', prt? 'Today’s plan: '+prt.name : 'You planned to train at '+st.workoutRemind, true);
    }
  }
}, 30000);

/* ============ boot ============ */
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
drawRestPresets();
if(S.settings.hiit){
  $('#hiWork').value=S.settings.hiit.w; $('#hiRest').value=S.settings.hiit.r; $('#hiRounds').value=S.settings.hiit.n;
}
hiReset();
renderToday();
</script>
