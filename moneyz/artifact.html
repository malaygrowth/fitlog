<script>
/* Optional sync layer.
   Off unless the user fills in a URL, a key and an account tag in Settings.
   The app is fully usable with this file removed: core.html only ever calls
   window.Sync behind a truthiness check.

   Wire protocol, one row per record:
     { id, owner, coll, payload, updated_at, deleted }
   Conflicts resolve last write wins on updated_at. Settings never leave the
   device, so the sync key itself is never uploaded.

   Default adapter speaks PostgREST, which is what Supabase exposes. See the
   README for the table and the row level security policy. */
'use strict';
window.Sync = (function(){
  var timer = null, running = false, SKEW = 60000;

  function cfg(){
    var s = (window.DB && DB.settings) || {};
    return {
      on: !!(s.syncOn && s.syncUrl && s.syncKey && s.syncOwner),
      url: (s.syncUrl || '').replace(/\/$/, ''),
      key: s.syncKey || '',
      table: s.syncTable || 'moneyz_records',
      owner: s.syncOwner || '',
      since: s.lastSync || ''
    };
  }
  function ts(x){ var n = Date.parse(x); return isNaN(n) ? 0 : n; }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function head(c, extra){
    var h = {
      'apikey': c.key,
      'Authorization': 'Bearer ' + c.key,
      'Content-Type': 'application/json'
    };
    if (extra) for (var k in extra) if (extra.hasOwnProperty(k)) h[k] = extra[k];
    return h;
  }
  function check(r){
    if (r.ok) return r;
    return r.text().then(function(body){
      var msg = 'HTTP ' + r.status;
      if (r.status === 401 || r.status === 403) msg = 'Key rejected (' + r.status + ')';
      else if (r.status === 404) msg = 'Table not found';
      throw new Error(msg + (body ? ': ' + String(body).slice(0, 140) : ''));
    });
  }
  function base(c){ return c.url + '/rest/v1/' + encodeURIComponent(c.table); }

  function pull(c){
    var q = base(c) + '?owner=eq.' + encodeURIComponent(c.owner) + '&select=*';
    if (c.since) q += '&updated_at=gt.' + encodeURIComponent(new Date(ts(c.since) - SKEW).toISOString());
    return fetch(q, {headers: head(c)}).then(check).then(function(r){ return r.json(); });
  }
  function push(c, rows){
    if (!rows.length) return Promise.resolve(0);
    return fetch(base(c) + '?on_conflict=id', {
      method: 'POST',
      headers: head(c, {'Prefer': 'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify(rows)
    }).then(check).then(function(){ return rows.length; });
  }

  var COLLS = ['env', 'tx', 'fav'];

  function localRows(c){
    var out = [], cut = c.since ? ts(c.since) - SKEW : 0;
    COLLS.forEach(function(coll){
      var bag = DB[coll] || {};
      for (var id in bag) {
        if (!bag.hasOwnProperty(id)) continue;
        var r = bag[id];
        /* Untouched starter envelopes are defaults, not the user's data.
           Uploading them would let a device that just booted overwrite real
           budgets set elsewhere, so they stay home until they are edited. */
        if (r.seed) continue;
        if (ts(r.updatedAt) <= cut) continue;
        out.push({
          id: r.id, owner: c.owner, coll: coll,
          payload: r, updated_at: r.updatedAt, deleted: !!r.deleted
        });
      }
    });
    return out;
  }
  function merge(rows){
    var n = 0;
    rows.forEach(function(row){
      if (COLLS.indexOf(row.coll) < 0) return;
      var local = DB[row.coll][row.id];
      /* A remote record always beats an untouched seed, whatever the clocks say. */
      if (local && !local.seed && ts(local.updatedAt) >= ts(row.updated_at)) return;
      var rec = row.payload && typeof row.payload === 'object' ? row.payload : {};
      rec.id = row.id;
      rec.updatedAt = row.updated_at;
      rec.deleted = !!row.deleted;
      DB[row.coll][row.id] = rec;
      n++;
    });
    return n;
  }

  function run(loud){
    var c = cfg();
    if (!c.on) return Promise.resolve(loud ? 'Sync is off. Fill in a URL, a key and an account tag.' : '');
    if (running) return Promise.resolve('Already syncing.');
    running = true;
    var sent = 0, got = 0;
    var mark = new Date().toISOString();
    return pull(c)
      .then(function(rows){ got = merge(rows || []); return push(c, localRows(c)); })
      .then(function(n){
        sent = n;
        DB.settings.lastSync = mark;
        persist();
        return 'Synced. <b>' + sent + ' up, ' + got + ' down.</b>';
      })
      .catch(function(e){
        return '<span class="err">Sync failed. <b>' + esc(String(e.message || e).slice(0, 120)) + '</b></span>';
      })
      .then(function(msg){ running = false; return msg; });
  }

  function schedule(){
    if (!cfg().on) return;
    clearTimeout(timer);
    timer = setTimeout(function(){ run(false); }, 2500);
  }

  return {run: run, schedule: schedule, enabled: function(){ return cfg().on; }};
})();
</script>

<script>
'use strict';

/* ---------- constants ---------- */
var VER = 1;
var KEY = 'moneyz.v1';
var CUR = {
  INR:{sym:'₹', loc:'en-IN'}, USD:{sym:'$', loc:'en-US'}, EUR:{sym:'€', loc:'de-DE'},
  GBP:{sym:'£', loc:'en-GB'}, AED:{sym:'AED ', loc:'en-AE'}, SGD:{sym:'S$', loc:'en-SG'},
  AUD:{sym:'A$', loc:'en-AU'}, CAD:{sym:'C$', loc:'en-CA'}
};
/* Seed ids are fixed, not random. Two devices that both start fresh then
   sync will merge their starter envelopes instead of ending up with two of
   each. Envelopes made by hand keep random ids. */
var SEED = [
  ['seed-groceries','Groceries','🛒'], ['seed-eatingout','Eating out','🍛'],
  ['seed-transport','Transport','🚗'], ['seed-bills','Bills','💡'],
  ['seed-shopping','Shopping','👕'], ['seed-health','Health','💊'],
  ['seed-fun','Fun','🎬'], ['seed-other','Other','✴']
];

/* ---------- state ---------- */
var DB, view = 'home', period = '', pendingUndo = null, toastTimer = null;

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function nowISO(){ return new Date().toISOString(); }

function blank(){
  var db = {
    v: VER, device: uid(),
    settings: {
      currency:'INR', monthStart:1, theme:'dark', income:0,
      syncOn:false, syncUrl:'', syncKey:'', syncTable:'moneyz_records', syncOwner:'', lastSync:''
    },
    env:{}, tx:{}, fav:{}
  };
  SEED.forEach(function(s, i){
    db.env[s[0]] = {id:s[0], name:s[1], emoji:s[2], budget:0, rollover:false, order:i,
                    archived:false, seed:true, updatedAt:nowISO(), deleted:false};
  });
  return db;
}

function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    var d = JSON.parse(raw);
    if (!d || !d.settings) return blank();
    if (!d.env) d.env = {};
    if (!d.tx) d.tx = {};
    if (!d.fav) d.fav = {};
    if (!d.device) d.device = uid();
    return d;
  } catch (e) { return blank(); }
}
/* persist() writes to disk only. save() also nudges sync. Sync itself uses
   persist() so that merging remote rows cannot re-trigger a sync loop. */
function persist(){
  DB.savedAt = nowISO();
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast('Could not save. Storage may be full.', null); }
}
function save(){
  persist();
  if (window.Sync) Sync.schedule();
}
function S(){ return DB.settings; }

/* record helpers: every write stamps updatedAt so sync can merge by last write.
   Writing through put() also clears the seed flag: a record the user has
   touched is real data, and from then on it syncs and can win a conflict. */
function put(coll, rec){
  rec.updatedAt = nowISO();
  delete rec.seed;
  DB[coll][rec.id] = rec;
  save();
}
function drop(coll, id){
  var r = DB[coll][id];
  if (!r) return;
  r.deleted = true; r.updatedAt = nowISO();
  save();
}
function live(coll){
  var out = [], k;
  for (k in DB[coll]) if (DB[coll].hasOwnProperty(k) && !DB[coll][k].deleted) out.push(DB[coll][k]);
  return out;
}

/* ---------- dates and periods ---------- */
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function dkey(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function today(){ return dkey(new Date()); }
function parseD(ds){ var p = ds.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

function pkey(y, m){ return y + '-' + pad2(m); }
function nextP(pk){ var p = pk.split('-'), y = +p[0], m = +p[1]; return m === 12 ? pkey(y + 1, 1) : pkey(y, m + 1); }
function prevP(pk){ var p = pk.split('-'), y = +p[0], m = +p[1]; return m === 1 ? pkey(y - 1, 12) : pkey(y, m - 1); }

/* A period is named by the month its start day falls in. */
function periodOf(ds){
  var p = ds.split('-'), y = +p[0], m = +p[1], d = +p[2];
  return d >= S().monthStart ? pkey(y, m) : prevP(pkey(y, m));
}
function periodStart(pk){
  var p = pk.split('-');
  return new Date(+p[0], +p[1] - 1, S().monthStart);
}
function periodEnd(pk){
  var e = periodStart(nextP(pk));
  e.setDate(e.getDate() - 1);
  return e;
}
function periodLabel(pk){
  var p = pk.split('-'), y = +p[0], m = +p[1];
  var mn = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  if (S().monthStart === 1) return mn[m - 1] + ' ' + y;
  var s = periodStart(pk), e = periodEnd(pk), sh = mn.map(function(x){ return x.slice(0, 3); });
  return s.getDate() + ' ' + sh[s.getMonth()] + ' to ' + e.getDate() + ' ' + sh[e.getMonth()];
}
function daysLeftIn(pk){
  var e = periodEnd(pk), t = new Date(); t.setHours(0, 0, 0, 0);
  if (t > e) return 0;
  var s = periodStart(pk);
  if (t < s) t = s;
  return Math.round((e - t) / 86400000) + 1;
}
function firstPeriod(){
  var tx = live('tx'), min = null;
  tx.forEach(function(t){ var p = periodOf(t.date); if (!min || p < min) min = p; });
  return min || period;
}

/* ---------- money ---------- */
function money(minor, dec){
  var c = CUR[S().currency] || CUR.INR;
  var neg = minor < 0, v = Math.abs(minor) / 100;
  var s = new Intl.NumberFormat(c.loc, {
    minimumFractionDigits: dec ? 2 : 0,
    maximumFractionDigits: dec ? 2 : 0
  }).format(v);
  return (neg ? '-' : '') + c.sym + s;
}
function toMinor(str){
  var n = parseFloat(String(str).replace(/[^0-9.\-]/g, ''));
  if (isNaN(n)) return 0;
  return Math.round(n * 100);
}

/* ---------- calculations ---------- */
var _idx = null;
function index(){
  if (_idx) return _idx;
  var by = {};
  live('tx').forEach(function(t){
    var p = periodOf(t.date);
    if (!by[p]) by[p] = [];
    by[p].push(t);
  });
  _idx = by;
  return by;
}
function bust(){ _idx = null; }

function txOf(pk){ return index()[pk] || []; }

/* per-envelope movement inside one period */
function moveOf(envId, pk){
  var out = 0, inn = 0, adj = 0;
  txOf(pk).forEach(function(t){
    if (t.envId !== envId) return;
    if (t.kind === 'in') inn += t.amt;
    else if (t.kind === 'adj') adj += t.amt;
    else out += t.amt;
  });
  return {out:out, in:inn, adj:adj};
}

/* Rollover carry. Budgets are not versioned, so history uses today's budget. */
function carryIn(env, pk){
  if (!env.rollover) return 0;
  var p = firstPeriod(), carry = 0, guard = 0;
  while (p !== pk && guard++ < 240) {
    var m = moveOf(env.id, p);
    carry = env.budget + carry + m.adj + m.in - m.out;
    p = nextP(p);
  }
  return carry;
}
function envStats(env, pk){
  var m = moveOf(env.id, pk), carry = carryIn(env, pk);
  var budget = env.budget + carry + m.adj;
  var avail = budget + m.in - m.out;
  return {
    budget:budget, base:env.budget, carry:carry, adj:m.adj,
    spent:m.out, got:m.in, net:m.out - m.in, avail:avail,
    pct: budget > 0 ? Math.min(100, Math.round(((m.out - m.in) / budget) * 100)) : (m.out > 0 ? 100 : 0)
  };
}
function envelopes(){
  return live('env').filter(function(e){ return !e.archived; })
    .sort(function(a, b){ return (a.order || 0) - (b.order || 0); });
}
function totals(pk){
  var budget = 0, spent = 0, avail = 0;
  envelopes().forEach(function(e){
    var s = envStats(e, pk);
    budget += s.budget; spent += s.net; avail += s.avail;
  });
  /* Unassigned entries never touch an envelope, but they are still real money
     leaving the account, so they come off what is left to spend. */
  var unenv = 0;
  txOf(pk).forEach(function(t){
    if (t.envId) return;
    if (t.kind === 'out') { unenv += t.amt; spent += t.amt; }
    else if (t.kind === 'in') { unenv -= t.amt; spent -= t.amt; }
  });
  return {budget:budget, spent:spent, avail:avail - unenv, unenv:unenv};
}
function spentOn(ds){
  var v = 0;
  txOf(periodOf(ds)).forEach(function(t){
    if (t.date !== ds) return;
    if (t.kind === 'out') v += t.amt;
    else if (t.kind === 'in') v -= t.amt;
  });
  return v;
}

/* ---------- dom helpers ---------- */
function el(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function envById(id){ return DB.env[id] || null; }
function envName(id){ var e = envById(id); return e ? e.name : 'Unassigned'; }
function envEmoji(id){ var e = envById(id); return e ? e.emoji : '•'; }

/* ---------- render ---------- */
function render(){
  bust();
  el('periodLabel').textContent = periodLabel(period);
  el('tab-home').innerHTML = view === 'home' ? homeHTML() : '';
  el('tab-env').innerHTML = view === 'env' ? envHTML() : '';
  el('tab-log').innerHTML = view === 'log' ? logHTML() : '';
  el('tab-ins').innerHTML = view === 'ins' ? insHTML() : '';
  var t = document.querySelectorAll('.tabs button');
  for (var i = 0; i < t.length; i++) t[i].classList.toggle('on', t[i].dataset.tab === view);
  var s = document.querySelectorAll('section.tab');
  for (var j = 0; j < s.length; j++) s[j].classList.toggle('on', s[j].id === 'tab-' + view);
  paintSync();
}

function paintSync(){
  var n = el('syncLine');
  if (!n) return;
  if (window.Sync && Sync.enabled()) {
    n.innerHTML = 'Sync is on. Last synced <b>' +
      (S().lastSync ? esc(new Date(S().lastSync).toLocaleTimeString()) : 'never') + '</b>';
  } else {
    n.textContent = 'Everything here lives in this browser only.';
  }
}

function barClass(pct){ return pct >= 100 ? 'over' : (pct >= 80 ? 'warn' : ''); }

function homeHTML(){
  var t = totals(period), cur = period === periodOf(today());
  var dl = Math.max(1, daysLeftIn(period));
  var perDay = cur ? Math.floor(t.avail / dl) : 0;
  var st = spentOn(today());
  var leftToday = perDay - st;
  var h = '';

  if (cur) {
    h += '<div class="card hero">' +
      '<div class="lbl">Safe to spend today</div>' +
      '<div class="big ' + (leftToday < 0 ? 'over' : '') + '">' + esc(money(leftToday)) + '</div>' +
      '<div class="sub">' + esc(money(perDay)) + ' a day for the ' + dl + ' day' + (dl === 1 ? '' : 's') + ' left, ' +
      esc(money(st)) + ' spent today</div>' +
      '<div class="split">' +
        '<div><div class="v num">' + esc(money(t.avail)) + '</div><div class="k">Left</div></div>' +
        '<div><div class="v num">' + esc(money(t.spent)) + '</div><div class="k">Spent</div></div>' +
        '<div><div class="v num">' + esc(money(t.budget)) + '</div><div class="k">Budget</div></div>' +
      '</div></div>';
  } else {
    h += '<div class="card hero">' +
      '<div class="lbl">' + esc(periodLabel(period)) + '</div>' +
      '<div class="big ' + (t.avail < 0 ? 'over' : '') + '">' + esc(money(t.avail)) + '</div>' +
      '<div class="sub">left of ' + esc(money(t.budget)) + ', ' + esc(money(t.spent)) + ' spent</div></div>';
  }

  if (t.budget === 0) {
    h += '<div class="card"><b>Set your budgets to begin</b>' +
      '<div class="muted" style="margin:6px 0 12px">Give each envelope a monthly amount. Everything else, the daily number and the alerts, follows from that.</div>' +
      '<button class="btn" data-go="env">Open envelopes</button></div>';
  }

  var favs = live('fav');
  if (favs.length) {
    h += '<div class="lbl" style="margin:18px 0 8px">Quick add</div><div class="chips">';
    favs.forEach(function(f){
      h += '<button class="chip" data-fav="' + esc(f.id) + '">' + esc(f.label || envName(f.envId)) +
        '<span class="a">' + esc(money(f.amt)) + '</span></button>';
    });
    h += '</div>';
  }

  var evs = envelopes();
  if (evs.length) {
    h += '<div class="lbl" style="margin:18px 0 8px">Envelopes</div><div class="card">';
    evs.forEach(function(e){
      var s = envStats(e, period);
      h += '<button class="env" data-env="' + esc(e.id) + '">' +
        '<div class="r1"><div class="nm"><span class="e">' + esc(e.emoji) + '</span><b>' + esc(e.name) + '</b></div>' +
        '<div class="av ' + (s.avail < 0 ? 'neg' : '') + ' num">' + esc(money(s.avail)) + '</div></div>' +
        '<div class="bar"><i class="' + barClass(s.pct) + '" style="width:' + Math.max(0, s.pct) + '%"></i></div>' +
        '<div class="r2"><span>' + esc(money(s.net)) + ' of ' + esc(money(s.budget)) + '</span>' +
        '<span>' + (s.carry ? (s.carry > 0 ? '+' : '') + esc(money(s.carry)) + ' rolled over' : '') + '</span></div>' +
        '</button>';
    });
    h += '</div>';
  }

  var recent = txOf(period).slice().sort(function(a, b){
    return a.date === b.date ? (b.updatedAt > a.updatedAt ? 1 : -1) : (a.date < b.date ? 1 : -1);
  }).slice(0, 5);
  if (recent.length) {
    h += '<div class="lbl" style="margin:18px 0 8px">Recent</div><div class="card">' + txRows(recent) + '</div>';
  }

  return h;
}

function txRows(list){
  var h = '';
  list.forEach(function(t){
    var isIn = t.kind === 'in', isAdj = t.kind === 'adj';
    h += '<button class="tx" data-tx="' + esc(t.id) + '">' +
      '<div class="ic">' + esc(isAdj ? '⇄' : envEmoji(t.envId)) + '</div>' +
      '<div class="m"><b>' + esc(t.note || (isAdj ? 'Moved money' : envName(t.envId))) + '</b>' +
      '<span>' + esc(envName(t.envId)) + ' · ' + esc(shortDate(t.date)) + '</span></div>' +
      '<div class="v ' + (isIn ? 'in' : '') + ' num">' + (isIn ? '+' : '') + esc(money(isAdj ? t.amt : (isIn ? t.amt : -t.amt))) + '</div>' +
      '</button>';
  });
  return h;
}
function shortDate(ds){
  var d = parseD(ds), t = today();
  if (ds === t) return 'Today';
  var y = new Date(); y.setDate(y.getDate() - 1);
  if (ds === dkey(y)) return 'Yesterday';
  var sh = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + sh[d.getMonth()];
}

function envHTML(){
  var evs = envelopes(), t = totals(period);
  var h = '<div class="card"><div class="lbl">Budgeted this period</div>' +
    '<div style="font-size:28px;font-weight:800;margin-top:2px">' + esc(money(t.budget)) + '</div>' +

    '</div><div class="card">';
  if (!evs.length) h += '<div class="empty">No envelopes yet.</div>';
  evs.forEach(function(e){
    var s = envStats(e, period);
    h += '<button class="env" data-env="' + esc(e.id) + '">' +
      '<div class="r1"><div class="nm"><span class="e">' + esc(e.emoji) + '</span><b>' + esc(e.name) + '</b></div>' +
      '<div class="av num">' + esc(money(e.budget)) + '</div></div>' +

function logHTML(){
  var list = txOf(period).slice().sort(function(a, b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
  if (!list.length) return '<div class="empty">Nothing logged in ' + esc(periodLabel(period)) + '.</div>';
  var h = '', day = null, group = [];
  var flush = function(){
    if (!group.length) return;
    h += '<div class="daysep">' + esc(shortDate(day)) + ' · ' + esc(money(group.reduce(function(a, t){
      return a + (t.kind === 'in' ? -t.amt : (t.kind === 'adj' ? 0 : t.amt));
    }, 0))) + '</div><div class="card">' + txRows(group) + '</div>';
    group = [];
  };
  list.forEach(function(t){
    if (t.date !== day) { flush(); day = t.date; }
    group.push(t);
  });
  flush();
  return h;
}

function insHTML(){
  var periods = [], p = period, i;
  for (i = 0; i < 6; i++) { periods.unshift(p); p = prevP(p); }
  var vals = periods.map(function(pk){ return totals(pk).spent; });
  var max = Math.max.apply(null, vals.concat([1]));
  var W = 300, H = 110, bw = W / periods.length;
  var h = '<div class="card"><div class="lbl">Spending, last 6 periods</div>' +
    '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 22) + '" role="img" aria-label="Spending by period">';
  periods.forEach(function(pk, k){
    var v = vals[k], hh = Math.max(2, Math.round((v / max) * H));
    var x = k * bw + bw * 0.18, w = bw * 0.64;
    h += '<rect x="' + x.toFixed(1) + '" y="' + (H - hh) + '" width="' + w.toFixed(1) + '" height="' + hh +
      '" rx="4" fill="' + (pk === period ? 'var(--gr)' : 'var(--raised)') + '"></rect>' +
      '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H + 14) + '" text-anchor="middle" font-size="9" fill="var(--ink3)">' +
      esc(pk.split('-')[1]) + '</text>';
  });
  h += '</svg><div class="muted" style="margin-top:8px">' + esc(money(vals[vals.length - 1])) +
    ' this period against ' + esc(money(vals[vals.length - 2] || 0)) + ' last.</div></div>';

  var evs = envelopes().map(function(e){
    return {e:e, v:envStats(e, period).net};
  }).filter(function(x){ return x.v > 0; }).sort(function(a, b){ return b.v - a.v; });
  var sum = evs.reduce(function(a, x){ return a + x.v; }, 0);
  h += '<div class="card"><div class="lbl">Where it went</div>';
  if (!evs.length) h += '<div class="empty">Nothing spent yet this period.</div>';
  evs.forEach(function(x){
    var pct = sum ? Math.round((x.v / sum) * 100) : 0;
    h += '<div class="env"><div class="r1"><div class="nm"><span class="e">' + esc(x.e.emoji) + '</span><b>' + esc(x.e.name) + '</b></div>' +
      '<div class="av num">' + esc(money(x.v)) + '</div></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="r2"><span>' + pct + '% of spending</span></div></div>';
  });
  var un = totals(period).unenv;
  if (un > 0) {
    h += '<div class="env"><div class="r1"><div class="nm"><span class="e">•</span><b>Unassigned</b></div>' +
      '<div class="av num">' + esc(money(un)) + '</div></div>' +
      '<div class="r2"><span>not in any envelope</span></div></div>';
  }
  h += '</div>';

  var t = totals(period);
  if (S().income) {
    var saved = S().income - t.spent;
    h += '<div class="card"><div class="lbl">Saved this period</div>' +
      '<div style="font-size:28px;font-weight:800;color:' + (saved < 0 ? 'var(--rd)' : 'var(--gr)') + '">' + esc(money(saved)) + '</div>' +
      '<div class="muted">' + esc(money(S().income)) + ' in, ' + esc(money(t.spent)) + ' out, ' +
      (S().income > 0 ? Math.round((saved / S().income) * 100) : 0) + '% kept.</div></div>';
  }
  return h;
}

/* ---------- sheets ---------- */
function openSheet(html){
  el('sheet').innerHTML = '<div class="grab"></div>' + html;
  el('sheet').classList.add('on');
  el('scrim').classList.add('on');
}
function closeSheet(){
  el('sheet').classList.remove('on');
  el('scrim').classList.remove('on');
}

/* add or edit a transaction */
var draft = null;
function openTx(txId){
  var t = txId ? DB.tx[txId] : null;
  draft = t ? {id:t.id, envId:t.envId, amt:t.amt, kind:t.kind, note:t.note, date:t.date}
            : {id:null, envId:(envelopes()[0] || {}).id || null, amt:0, kind:'out', note:'', date:today()};
  draft.str = t ? String(Math.abs(t.amt) / 100) : '';
  drawTx();
}
function drawTx(){
  var evs = envelopes();
  var h = '<h2>' + (draft.id ? 'Edit entry' : 'Add entry') + '</h2>' +
    '<div class="seg"><button data-kind="out" class="' + (draft.kind === 'out' ? 'on' : '') + '">Spent</button>' +
    '<button data-kind="in" class="' + (draft.kind === 'in' ? 'on' : '') + '">Received</button></div>' +
    '<div class="amt ' + (draft.str ? '' : 'dim') + '" id="amtView">' + esc(money(toMinor(draft.str || '0'))) + '</div>' +
    '<div class="chips" style="margin:6px 0 2px">';
  evs.forEach(function(e){
    h += '<button class="chip ' + (draft.envId === e.id ? 'on' : '') + '" data-pick="' + esc(e.id) + '">' +
      esc(e.emoji) + ' ' + esc(e.name) + '</button>';
  });
  h += '<button class="chip ' + (draft.envId ? '' : 'on') + '" data-pick="">Unassigned</button></div>' +
    '<div class="pad">';
  ['1','2','3','4','5','6','7','8','9','.','0','⌫'].forEach(function(k){
    h += '<button data-pad="' + esc(k) + '">' + esc(k) + '</button>';
  });
  h += '</div>' +
    '<div class="row2"><div class="field"><label>Date</label><input type="date" id="txDate" value="' + esc(draft.date) + '"></div>' +
    '<div class="field"><label>Note</label><input id="txNote" value="' + esc(draft.note || '') + '" placeholder="optional"></div></div>' +
    '<button class="btn" id="txSave">' + (draft.id ? 'Save' : 'Add') + '</button>';
  if (draft.id) h += '<button class="btn danger" id="txDel">Delete</button>';
  else h += '<button class="btn sec" id="txFav">Save as a quick add</button>';
  openSheet(h);
}
function commitTx(){
  var amt = toMinor(draft.str);
  if (!amt) { toast('Enter an amount first.', null); return; }
  draft.date = el('txDate').value || today();
  draft.note = el('txNote').value.trim();
  var rec = {
    id: draft.id || uid(), envId: draft.envId || null, amt: Math.abs(amt),
    kind: draft.kind, note: draft.note, date: draft.date, deleted:false
  };
  put('tx', rec);
  closeSheet();
  bust(); render();
  toast(draft.id ? 'Entry saved.' : money(rec.amt) + ' logged to ' + envName(rec.envId) + '.',
        draft.id ? null : function(){ drop('tx', rec.id); bust(); render(); });
}

      '<div><div class="v num">' + esc(money(s.budget)) + '</div><div class="k">Budget</div></div></div>';
  }
  h += '<div class="row2"><div class="field" style="flex:0 0 74px"><label>Icon</label>' +
    '<input id="eEmoji" value="' + esc(e ? e.emoji : '✴') + '" maxlength="4"></div>' +
    '<div class="field"><label>Name</label><input id="eName" value="' + esc(e ? e.name : '') + '" placeholder="Groceries"></div></div>' +
    '<div class="field"><label>Amount each period</label>' +
    '<input id="eBudget" type="number" inputmode="decimal" step="0.01" value="' + (e ? e.budget / 100 : '') + '" placeholder="0"></div>' +
    '<div class="field"><label><input type="checkbox" id="eRoll" style="width:auto;margin-right:8px"' + (e && e.rollover ? ' checked' : '') + '>' +
    'Roll leftover into next period</label></div>' +
    '<button class="btn" id="eSave">Save</button>';
  if (e) {
    h += '<h3>Move money</h3><div class="row2">' +
      '<div class="field"><label>Amount</label><input id="mvAmt" type="number" inputmode="decimal" step="0.01" placeholder="0"></div>' +
      '<div class="field"><label>To</label><select id="mvTo">' +
      envelopes().filter(function(x){ return x.id !== e.id; }).map(function(x){
        return '<option value="' + esc(x.id) + '">' + esc(x.name) + '</option>';
      }).join('') + '</select></div></div>' +
      '<button class="btn sec" id="mvGo">Move out of ' + esc(e.name) + '</button>' +
      '<button class="btn danger" id="eDel" style="margin-top:18px">Delete envelope</button>';
  }
  openSheet(h);
  el('eSave').onclick = function(){
    var name = el('eName').value.trim();
    if (!name) { toast('Give it a name.', null); return; }
    var rec = e ? e : {id:uid(), order:envelopes().length, archived:false, deleted:false};
    rec.name = name;
    rec.emoji = el('eEmoji').value.trim() || '✴';
    rec.budget = toMinor(el('eBudget').value);
    rec.rollover = el('eRoll').checked;
    put('env', rec);
    closeSheet(); bust(); render();
  };
  if (e) {
    el('mvGo').onclick = function(){
      var amt = toMinor(el('mvAmt').value), to = el('mvTo').value;
      if (!amt || !to) { toast('Enter an amount and a destination.', null); return; }
      put('tx', {id:uid(), envId:e.id, amt:-amt, kind:'adj', note:'To ' + envName(to), date:today(), deleted:false});
      put('tx', {id:uid(), envId:to, amt:amt, kind:'adj', note:'From ' + e.name, date:today(), deleted:false});
      closeSheet(); bust(); render();
      toast(money(amt) + ' moved to ' + envName(to) + '.', null);
    };
    el('eDel').onclick = function(){
      if (!confirm('Delete ' + e.name + '? Entries already logged to it stay in your history.')) return;
      drop('env', e.id);
      closeSheet(); bust(); render();
    };
  }
}

    '<div class="row2"><div class="field"><label>Table</label><input id="yTable" value="' + esc(s.syncTable) + '"></div>' +
    '<div class="field"><label>Account tag</label><input id="yOwner" value="' + esc(s.syncOwner) + '" placeholder="anuj"></div></div>' +
    '<button class="btn sec" id="ySync">Sync now</button>' +
    '<div class="sync" id="ySt">' + (s.lastSync ? 'Last sync ' + esc(new Date(s.lastSync).toLocaleString()) : 'Never synced') + '</div>';

  h += '<h3>Backup</h3>' +
    '<button class="btn sec" id="bExport">Export a JSON backup</button>' +
    '<button class="btn sec" id="bText">Backup as text</button>' +
    '<button class="btn sec" id="bImport">Import a backup</button>' +
    '<input type="file" id="bFile" accept="application/json" style="display:none">' +
    '<button class="btn danger" id="bReset" style="margin-top:18px">Erase everything</button>' +
    '<div class="sync" style="margin-top:14px">MoneyZ v' + VER + '</div>';
  openSheet(h);

  el('sSave').onclick = function(){
    s.currency = el('sCur').value;
    var st = Math.min(28, Math.max(1, parseInt(el('sStart').value, 10) || 1));
    s.monthStart = st;
    s.income = toMinor(el('sIncome').value);
    s.theme = el('sLight').checked ? 'light' : 'dark';
    document.body.classList.toggle('light', s.theme === 'light');
    save();
    period = periodOf(today());
    closeSheet(); bust(); render();
    toast('Settings saved.', null);
  };
  el('ySync').onclick = function(){
    s.syncOn = el('yOn').checked;
    s.syncUrl = el('yUrl').value.trim().replace(/\/$/, '');
    s.syncKey = el('yKey').value.trim();
    s.syncTable = el('yTable').value.trim() || 'moneyz_records';
    s.syncOwner = el('yOwner').value.trim();
    save();
    el('ySt').textContent = 'Syncing...';
    /* Sync builds this string itself and escapes anything the server sent. */
    Sync.run(true).then(function(msg){
      el('ySt').innerHTML = msg;
      bust(); render();
    });
  };
  el('bExport').onclick = function(){
    var blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'moneyz-backup-' + today() + '.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  };
  /* Some hosts, an embedded viewer for instance, block file downloads outright.
     The text route works everywhere and covers both directions. */
  el('bText').onclick = openBackupText;
  el('bImport').onclick = function(){ el('bFile').click(); };
  el('bFile').onchange = function(ev){
    var f = ev.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var d = JSON.parse(r.result);
        if (!d.settings || !d.env) throw new Error('shape');
        if (!confirm('Replace everything on this device with the backup?')) return;
        DB = d; save();
        closeSheet(); boot();
        toast('Backup restored.', null);
      } catch (e2) { toast('That file is not a MoneyZ backup.', null); }
    };
    r.readAsText(f);
  };
  el('bReset').onclick = function(){
    if (!confirm('Erase every envelope and entry on this device? This cannot be undone.')) return;
    DB = blank(); save(); closeSheet(); boot();
  };
}

/* Backup as text: works where file downloads are blocked, and restores from a
   pasted backup just as the file route does. */
function openBackupText(){
  openSheet('<h2>Backup as text</h2>' +
    '<div class="muted" style="margin-bottom:10px">Copy this somewhere safe. To restore, paste a backup over it and tap Restore.</div>' +
    '<textarea id="bBox" rows="9" spellcheck="false" style="font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace"></textarea>' +
    '<button class="btn" id="bCopy">Copy</button>' +
    '<button class="btn danger" id="bRestore">Restore from this text</button>' +
    '<button class="btn sec" id="bBack">Back to settings</button>');
  var box = el('bBox');
  box.value = JSON.stringify(DB);
  box.focus();
  box.setSelectionRange(0, box.value.length);
  el('bCopy').onclick = function(){
    box.select();
    var done = function(){ toast('Backup copied.', null); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(box.value).then(done, function(){
        toast('Copy blocked here. The text is selected, copy it by hand.', null);
      });
    } else {
      toast('The text is selected, copy it by hand.', null);
    }
  };
  el('bRestore').onclick = function(){
    var d;
    try { d = JSON.parse(box.value); } catch (e) { toast('That is not valid JSON.', null); return; }
    if (!d || !d.settings || !d.env) { toast('That is not a MoneyZ backup.', null); return; }
    if (!confirm('Replace everything on this device with this backup?')) return;
    DB = d; save(); closeSheet(); boot();
    toast('Backup restored.', null);
  };
  el('bBack').onclick = openSettings;
}

/* quick add favourite from the current draft */
function saveFav(){
  var amt = toMinor(draft.str);
  if (!amt) { toast('Enter an amount first.', null); return; }
  var label = (el('txNote').value.trim() || envName(draft.envId));
  put('fav', {id:uid(), envId:draft.envId || null, amt:Math.abs(amt), label:label, deleted:false});
  toast('Quick add saved.', null);
  render();
}

/* ---------- toast ---------- */
function toast(msg, undo){
  el('toastMsg').textContent = msg;
  el('toastAct').style.display = undo ? '' : 'none';
  pendingUndo = undo;
  el('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el('toast').classList.remove('on'); pendingUndo = null; }, undo ? 5000 : 2600);
}

/* ---------- events ---------- */
document.addEventListener('click', function(ev){
  var t = ev.target.closest ? ev.target.closest('[data-tab],[data-fav],[data-env],[data-tx],[data-pad],[data-kind],[data-pick],[data-go],[data-new-env],[data-favdel]') : null;
  if (!t) return;
  var d = t.dataset;

  if (d.tab) { view = d.tab; render(); return; }
  if (d.go) { view = d.go; render(); return; }
  if (d.newEnv) { openEnv(null); return; }
  if (d.env) { openEnv(d.env); return; }
  if (d.tx) { openTx(d.tx); return; }
  if (d.favdel) { drop('fav', d.favdel); openSettings(); render(); return; }

  if (d.fav !== undefined && d.fav !== '') {
    var f = DB.fav[d.fav];
    if (!f) return;
    var rec = {id:uid(), envId:f.envId, amt:f.amt, kind:'out', note:f.label, date:today(), deleted:false};
    put('tx', rec); bust(); render();
    toast(money(f.amt) + ' to ' + envName(f.envId) + '.', function(){ drop('tx', rec.id); bust(); render(); });
    return;
  }
  if (d.kind) { draft.kind = d.kind; drawTx(); return; }
  if (d.pick !== undefined) { draft.envId = d.pick || null; drawTx(); return; }
  if (d.pad) {
    var k = d.pad;
    if (k === '⌫') draft.str = draft.str.slice(0, -1);
    else if (k === '.') { if (draft.str.indexOf('.') < 0) draft.str = (draft.str || '0') + '.'; }
    else if (/\.\d\d$/.test(draft.str)) { /* two decimals is the limit */ }
    else draft.str += k;
    el('amtView').textContent = money(toMinor(draft.str || '0'));
    el('amtView').classList.toggle('dim', !draft.str);
    return;
  }
});

document.addEventListener('click', function(ev){
  var id = ev.target.id;
  if (id === 'txSave') commitTx();
  else if (id === 'txFav') saveFav();
  else if (id === 'txDel') {
    drop('tx', draft.id); closeSheet(); bust(); render();
    toast('Entry deleted.', null);
  }
});

el('fab').onclick = function(){ openTx(null); };
el('scrim').onclick = closeSheet;
el('btnSettings').onclick = openSettings;
el('btnPrev').onclick = function(){ period = prevP(period); render(); };
el('btnNext').onclick = function(){ period = nextP(period); render(); };
el('toastAct').onclick = function(){
  if (pendingUndo) pendingUndo();
  pendingUndo = null;
  el('toast').classList.remove('on');
};

/* ---------- boot ---------- */
function boot(){
  DB = load();
  document.body.classList.toggle('light', S().theme === 'light');
  period = periodOf(today());
  bust(); render();
  if (window.Sync) Sync.run(false).then(function(){ bust(); render(); });
}
boot();
</script>
