<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23292f"/>
      <stop offset="1" stop-color="#0a0d10"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c9d1d9"/>
      <stop offset="0.55" stop-color="#8a939e"/>
      <stop offset="0.8" stop-color="#4a525b"/>
      <stop offset="1" stop-color="#2b3138"/>
    </linearGradient>
    <linearGradient id="chromeUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8edf2"/>
      <stop offset="0.5" stop-color="#9aa4af"/>
      <stop offset="1" stop-color="#3a4149"/>
    </linearGradient>
    <linearGradient id="ringg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f8"/>
      <stop offset="0.5" stop-color="#7e8791"/>
      <stop offset="1" stop-color="#1c2126"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bgg)"/>

  <!-- emblem disc -->
  <circle cx="256" cy="256" r="164" fill="#0d1114"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="url(#ringg)" stroke-width="10"/>
  <circle cx="256" cy="256" r="146" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="8"/>

  <!-- C : open ring, gap on the right where the Z passes -->
  <path d="M 340 148 A 118 118 0 1 0 340 364" fill="none" stroke="url(#chrome)" stroke-width="40" stroke-linecap="round"/>
  <path d="M 340 148 A 118 118 0 1 0 340 364" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round" transform="translate(-4 -6)"/>

  <!-- Z with extended slash -->
  <g stroke="#0a0d10" stroke-width="9" stroke-linejoin="round">
    <rect x="66" y="234" width="380" height="44" rx="10" transform="rotate(-45 256 256)" fill="url(#chrome)"/>
    <polygon points="242,140 388,140 374,184 228,184" fill="url(#chromeUp)"/>
    <polygon points="138,328 284,328 270,372 124,372" fill="url(#chromeUp)"/>
  </g>
  <!-- highlight edge on slash -->
  <rect x="80" y="238" width="352" height="8" rx="4" transform="rotate(-45 256 256)" fill="#fff" opacity="0.5"/>
</svg>
